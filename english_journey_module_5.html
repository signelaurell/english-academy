<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Journey · Vocabulary Builder</title><style>:root{font-family:system-ui,Segoe UI,sans-serif;color:#24324c;background:#f5f6fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:28px 18px}header{background:linear-gradient(120deg,#30265f,#6456b7);color:white;padding:32px;border-radius:22px}h1{margin:5px 0}header p{opacity:.9}.layout{display:grid;grid-template-columns:260px 1fr;gap:20px;margin-top:22px}.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 4px 22px #25315c0b}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:#6253b5;color:white}button:disabled{opacity:.45;cursor:not-allowed}.nav{display:block;width:100%;text-align:left;margin:7px 0;background:#f0effa;color:#37315e}.nav.active{background:#6253b5;color:white}.nav:disabled{background:#f6f6fa;color:#999}.muted{color:#68738b;font-size:.94rem}.lesson{font-size:.83rem;text-transform:uppercase;letter-spacing:.1em;color:#6a5fc0;font-weight:750}.explain{background:#f4f2ff;border-left:4px solid #8272da;border-radius:9px;padding:16px;margin:16px 0}.question{border-top:1px solid #e9e9f1;padding:19px 0}.choices{display:grid;gap:8px;margin-top:12px}.choice{background:#f3f5fa;color:#26334d;text-align:left;border:1px solid #e3e7f0}.choice.selected{border-color:#6759bc;background:#eae6ff}.feedback{padding:12px;border-radius:9px;margin-top:10px;background:#fff5e8}.feedback.good{background:#e7f8ef;color:#17643c}.progress{height:9px;background:#e7e6f0;border-radius:9px;overflow:hidden}.progress div{height:100%;background:#55b99b;transition:width .2s}.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#eae6ff;color:#5a4baf;font-size:.8rem}input{font:inherit;width:100%;border:1px solid #cbd1e1;border-radius:9px;padding:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.secondary{background:#eae8f8;color:#433786}.hidden{display:none}@media(max-width:700px){.layout{grid-template-columns:1fr}.wrap{padding:12px}header{padding:24px}.panel{padding:17px}}</style></head><body><div class="wrap"><header><div style="font-size:.83rem;letter-spacing:.15em">ENGLISH JOURNEY · MODULE 5</div><h1>Vocabulary Builder</h1><p>Grow your vocabulary. Choose better words. Express yourself with confidence.</p><div class="progress"><div id="progress" style="width:0%"></div></div><p id="progressText" style="margin-bottom:0;font-size:.88rem"></p></header><div class="layout"><aside class="panel"><strong>Your learning path</strong><p class="muted">Complete each lesson to unlock the next.</p><div id="nav"></div><p class="muted">Your progress is saved in this browser on this device.</p><button class="secondary" id="reset" style="font-size:.8rem">Reset progress</button></aside><main class="panel" id="main"></main></div></div><script>
const lessons=[
{title:'Everyday Vocabulary',goal:'Choose useful words for everyday situations.',teach:'A good vocabulary helps you describe school, free time and daily life. Notice how words change meaning depending on the sentence.',sv:'Välj det ord som passar situationen. Läs hela meningen innan du svarar.',questions:[['I usually ___ my homework after dinner.',['make','do','take','get'],1,'We say “do my homework”.'],['Please ___ the bus at the next stop.',['get off','turn on','look for','put away'],0,'“Get off” means leave a bus or train.'],['My phone battery is ___. I need to charge it.',['empty','crowded','polite','fresh'],0,'An empty battery has no power left.'],['We were ___ because the train was late.',['delayed','delicious','quiet','honest'],0,'“Delayed” describes something happening later than planned.'],['Can I ___ your pencil for a minute?',['borrow','lend','spend','bring'],0,'“Borrow” means use something temporarily and return it.'],['My sister is very ___. She always helps people.',['kind','lazy','rude','nervous'],0,'“Kind” describes a helpful, caring person.']]},
{title:'Synonyms & Antonyms',goal:'Find words with similar and opposite meanings.',teach:'Synonyms have similar meanings: happy → glad. Antonyms have opposite meanings: happy ↔ sad. Two synonyms are not always interchangeable in every sentence.',sv:'Synonymer betyder ungefär samma sak. Antonymer betyder motsatsen.',questions:[['Choose a synonym for “angry”.',['furious','calm','sleepy','gentle'],0,'“Furious” means very angry.'],['Choose an antonym for “generous”.',['selfish','helpful','friendly','thoughtful'],0,'“Selfish” is the opposite of generous.'],['Which word is closest in meaning to “tiny”?',['small','heavy','bright','distant'],0,'“Tiny” means very small.'],['Choose an antonym for “ancient”.',['modern','historic','old','traditional'],0,'“Modern” contrasts with ancient.'],['Choose a synonym for “difficult”.',['challenging','simple','ordinary','quick'],0,'“Challenging” can mean difficult.'],['Choose an antonym for “increase”.',['decrease','improve','expand','continue'],0,'“Decrease” means become smaller or less.']]},
{title:'Words in Context',goal:'Use clues in sentences to work out meaning.',teach:'When you meet an unfamiliar word, read the whole sentence. Look for examples, contrasts and explanations before you guess.',sv:'Använd ledtrådar i meningen. Ord runt omkring kan avslöja betydelsen.',questions:[['The path was slippery after the rain, so we walked ___.',['carefully','loudly','suddenly','carelessly'],0,'A slippery path requires careful walking.'],['Although Maya was exhausted, she finished the race. “Exhausted” means ___.',['very tired','very excited','very angry','very hungry'],0,'Finishing a race despite exhaustion suggests extreme tiredness.'],['The instructions were confusing, so I asked the teacher to ___ them.',['explain','hide','forget','replace'],0,'An explanation helps make confusing instructions clear.'],['The café was packed; there were no free ___.',['seats','menus','windows','drinks'],0,'“Packed” suggests the café was full of people.'],['Unlike his talkative brother, Leo is rather ___.',['quiet','cheerful','curious','friendly'],0,'“Unlike” signals a contrast with talkative.'],['The weather was unpredictable: sunny one minute and ___ the next.',['rainy','warm','pleasant','clear'],0,'Rain after sunshine illustrates changing weather.']]},
{title:'Common Expressions',goal:'Understand common phrases used in English.',teach:'English speakers often use groups of words with a special meaning. Learn expressions as complete phrases rather than translating every word.',sv:'Vanliga uttryck kan ha en annan betydelse än orden var för sig.',questions:[['“Keep an eye on my bag” means ___.',['watch my bag','carry my bag','open my bag','buy my bag'],0,'“Keep an eye on” means watch or look after.'],['If an exam is “a piece of cake”, it is ___.',['easy','long','important','surprising'],0,'“A piece of cake” means something is easy.'],['“I am running late” means ___.',['I will arrive late','I am exercising','I am going home','I am in a race'],0,'“Running late” means behind schedule.'],['“Give me a hand” means ___.',['help me','wave at me','follow me','call me'],0,'“Give someone a hand” can mean help them.'],['“It slipped my mind” means ___.',['I forgot it','I disliked it','I understood it','I changed it'],0,'The expression means you forgot something.'],['“Let’s call it a day” means ___.',['let’s stop working','let’s start again','let’s make a plan','let’s meet tomorrow'],0,'“Call it a day” means finish for now.']]},
{title:'Better Word Choices',goal:'Make your English more precise and interesting.',teach:'Strong writing uses precise words. Instead of “very tired”, try “exhausted”. Choose words that match what you really mean; complicated words are not always better.',sv:'Välj ett mer exakt ord som passar sammanhanget. Svårare är inte alltid bättre.',questions:[['The film was very scary. Choose a stronger word for “scary”.',['terrifying','ordinary','peaceful','cheerful'],0,'“Terrifying” means extremely frightening.'],['She walked ___ into the room because she did not want to wake anyone.',['quietly','wildly','proudly','rapidly'],0,'“Quietly” matches the goal of not waking anyone.'],['The soup tasted ___. Everyone asked for more.',['delicious','strange','bitter','plain'],0,'“Delicious” expresses that the food tasted very good.'],['Instead of “very big”, choose a more precise word.',['enormous','narrow','brief','tiny'],0,'“Enormous” means extremely large.'],['He ___ the answer because he was not completely sure.',['guessed','announced','proved','demanded'],0,'“Guessed” fits uncertainty.'],['The teacher gave us ___ instructions, so everyone knew what to do.',['clear','vague','confusing','uncertain'],0,'“Clear” instructions are easy to understand.']]},
{title:'Vocabulary Challenge',goal:'Show what you have learned across the module.',teach:'Time to put everything together! Read carefully and choose the best answer. You need at least 80% to complete this module.',sv:'Sluttest: blanda ord, synonymer, sammanhang och uttryck.',questions:[['Which word means “very surprised”?',['astonished','exhausted','annoyed','relaxed'],0,'“Astonished” means very surprised.'],['Choose an antonym for “confident”.',['insecure','certain','brave','assured'],0,'“Insecure” can mean lacking confidence.'],['I ___ my keys, so I cannot get into the house.',['lost','lent','saved','found'],0,'Losing keys explains why you cannot enter.'],['“Break the ice” usually means ___.',['make people feel comfortable','stop a conversation','leave a party','tell a secret'],0,'It means ease tension when people first meet.'],['The room was ___; we could barely hear each other.',['noisy','silent','empty','peaceful'],0,'“Noisy” explains why hearing was difficult.'],['Choose a synonym for “brave”.',['courageous','careless','nervous','gentle'],0,'“Courageous” means brave.'],['She ___ the invitation because she was busy.',['declined','accepted','created','delivered'],0,'“Declined” means politely refused.'],['“I’m looking forward to the trip” means ___.',['I am excited about it','I am worried about it','I have forgotten it','I have cancelled it'],0,'“Look forward to” means anticipate something positively.'],['Choose a better word for “very cold”.',['freezing','boiling','humid','mild'],0,'“Freezing” means extremely cold.'],['He spoke ___ so that the baby would not wake up.',['softly','angrily','loudly','suddenly'],0,'Speaking softly helps avoid waking a baby.']]}];
const key='english-journey-vocab-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{};let state={unlocked:Math.max(0,Math.min(5,saved.unlocked||0)),completed:Array.isArray(saved.completed)?saved.completed:[],current:Math.max(0,Math.min(5,saved.current||0))};let answers={},showSv=false,submitted=false;const $=id=>document.getElementById(id);function store(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(){let done=state.completed.length;$('progress').style.width=(done/6*100)+'%';$('progressText').textContent=done+' of 6 lessons completed';$('nav').innerHTML=lessons.map((l,i)=>`<button class="nav ${state.current===i?'active':''}" data-go="${i}" ${i>state.unlocked?'disabled':''}>${state.completed.includes(i)?'✓':i>state.unlocked?'🔒':'○'} ${i+1}. ${esc(l.title)}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openLesson(+b.dataset.go))}function openLesson(i){state.current=i;answers={};submitted=false;showSv=false;store();render()}function render(){nav();const l=lessons[state.current];$('main').innerHTML=`<div class="lesson">Lesson ${state.current+1} of 6</div><h2>${esc(l.title)}</h2><span class="pill">${state.completed.includes(state.current)?'Completed ✓':'Independent learning'}</span><p>${esc(l.goal)}</p><div class="explain"><strong>Learn it!</strong><p>${esc(l.teach)}</p><button class="secondary" id="translate">${showSv?'Hide Swedish help':'Visa svensk förklaring'}</button>${showSv?`<p lang="sv">${esc(l.sv)}</p>`:''}</div><h3>Try it!</h3><p class="muted">Choose the best answer for each question. You can retry as often as you need.</p><div id="questions">${l.questions.map((q,j)=>`<section class="question"><strong>${j+1}. ${esc(q[0])}</strong><div class="choices">${q[1].map((opt,k)=>`<button class="choice ${answers[j]===k?'selected':''}" data-q="${j}" data-a="${k}" ${submitted?'disabled':''}>${esc(opt)}</button>`).join('')}</div>${submitted?`<div class="feedback ${answers[j]===q[2]?'good':''}">${answers[j]===q[2]?'✓ Correct.':'Not quite.'} ${esc(q[3])}</div>`:''}</section>`).join('')}</div><div class="actions"><button id="check" ${Object.keys(answers).length!==l.questions.length||submitted?'disabled':''}>Check my answers</button>${submitted?'<button id="retry" class="secondary">Try again</button>':''}<button id="next" class="secondary" style="display:none">Next lesson →</button></div><div id="result" aria-live="polite"></div>`;$('translate').onclick=()=>{showSv=!showSv;render()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{answers[+b.dataset.q]=+b.dataset.a;render()});$('check').onclick=()=>{submitted=true;render()};if(submitted){const score=l.questions.filter((q,j)=>answers[j]===q[2]).length,pass=score/l.questions.length>=.8;$('result').innerHTML=`<div class="explain"><strong>Your result: ${score}/${l.questions.length} (${Math.round(score/l.questions.length*100)}%)</strong><p>${pass?'Great work! You passed this lesson.':'Keep practising! Review the feedback and try again. You need 80% to continue.'}</p></div>`;if(pass){if(!state.completed.includes(state.current))state.completed.push(state.current);state.unlocked=Math.max(state.unlocked,Math.min(5,state.current+1));store();nav();if(state.current<5){$('next').style.display='inline-block';$('next').onclick=()=>openLesson(state.current+1)}else{$('result').innerHTML+='<p><strong>🎉 Congratulations! You completed Vocabulary Builder!</strong></p>'}}$('retry').onclick=()=>{answers={};submitted=false;render()}}} $('reset').onclick=()=>{if(confirm('Reset all progress in Vocabulary Builder on this device?')){state={unlocked:0,completed:[],current:0};store();openLesson(0)}};render();
</script></body></html>
