<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Journey · Advanced Grammar II</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fc;color:#24314b;font-family:Inter,system-ui,Arial,sans-serif}.top{background:linear-gradient(115deg,#30345d,#6953a8);color:white;padding:26px max(22px,calc((100vw - 1080px)/2))}.top small{letter-spacing:2px;font-weight:700}.top h1{margin:7px 0;font-size:30px}.layout{max-width:1080px;margin:25px auto;display:grid;grid-template-columns:275px 1fr;gap:22px;padding:0 16px}.panel{background:white;border:1px solid #e3e5f1;border-radius:16px;padding:22px;box-shadow:0 4px 20px #2830500a}.nav button{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border:1px solid #e2e5f2;background:white;border-radius:11px;color:#35415e;cursor:pointer}.nav button.active{border-color:#7464b7;background:#f0ecff;font-weight:700}.nav button:disabled{opacity:.45;cursor:not-allowed}button{font:inherit}.primary{background:#6652a7;color:white;border:0;border-radius:9px;padding:11px 18px;cursor:pointer;font-weight:700}.secondary{background:white;border:1px solid #bbb7d9;border-radius:9px;padding:10px 14px;cursor:pointer}.muted{color:#65718a}.lessonbox{background:#f1f0fb;border-radius:12px;padding:18px;line-height:1.65}.question{border:1px solid #e1e4ef;border-radius:13px;padding:17px;margin-top:14px}.question h3{font-size:16px;margin:0 0 12px}.option{display:block;width:100%;text-align:left;border:1px solid #dfe3ed;background:white;border-radius:9px;margin:7px 0;padding:10px 12px;cursor:pointer}.option.selected{border-color:#6754a9;background:#f1edff}.option:disabled{cursor:default}.feedback{padding:11px;border-radius:9px;margin-top:9px;background:#f1f4fa}.good{background:#e5f7ec;color:#155d38}.bad{background:#fff1e6;color:#8c4117}textarea{width:100%;min-height:110px;border:1px solid #ccd2e2;border-radius:10px;padding:12px;font:inherit;resize:vertical}.check{display:block;margin:9px 0}.progress{height:9px;background:#e6e8f0;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#36a88e}.sectiontitle{margin-top:30px}.hidden{display:none}.tag{display:inline-block;background:#edeaf9;border-radius:30px;padding:5px 10px;font-size:12px;color:#55459b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#result{margin-top:16px}.footer{font-size:12px;color:#7b8498;margin-top:18px}@media(max-width:720px){.layout{grid-template-columns:1fr}.top h1{font-size:25px}}</style><style id="academy2-css">.academy-back{position:relative;z-index:10;padding:12px 22px;background:#171027;color:#e9d5ff;font:700 14px system-ui}.academy-back a{color:#e9d5ff;text-decoration:none}.academy-back a:hover{text-decoration:underline}.academy-bottom{margin-top:32px}.academy-status{margin:12px 0 0;font:600 12px system-ui;color:#cbb5e5}.academy-status-line{display:flex;justify-content:space-between;gap:8px}.academy-track{height:7px;border-radius:9px;background:#4d3766;overflow:hidden;margin-top:8px}.academy-track>div{height:100%;background:#ae72ff;border-radius:9px}.academy-mastered{border-color:#22c55e!important;background:linear-gradient(140deg,#16452d,#10291e)!important}.academy-mastered .academy-status{color:#9cf4b4}.academy-mastered .academy-track>div{background:#22c55e}.academy-celebration{position:fixed;inset:0;z-index:99999;background:#080411c9;display:grid;place-items:center;padding:20px}.academy-pop{width:min(440px,100%);padding:38px 25px;text-align:center;border:2px solid #a78bfa;border-radius:24px;background:#25143d;color:#fff;box-shadow:0 0 90px #a855f755;font-family:system-ui}.academy-pop h2{font-size:25px;color:#e9c5ff}.academy-pop p{font-size:18px;line-height:1.5}.academy-pop button{border:0;border-radius:12px;background:#a78bfa;color:#160b2a;font-weight:800;padding:14px 22px;cursor:pointer}</style></head><body><header class="top"><small>ENGLISH JOURNEY · MODULE 11</small><h1>Advanced Grammar II</h1><div>Explore new structures. Build more confident English.</div></header><div class="layout"><aside class="panel"><h2>Your learning path</h2><p class="muted">Complete each lesson to unlock the next.</p><div class="progress"><div id="bar"></div></div><p id="progressText" class="muted"></p><nav class="nav" id="nav"></nav><button class="secondary" id="reset">Reset my progress</button></aside><main class="panel" id="main"></main></div><script>const LESSONS={"lessons": [{"title": "First Conditional", "explain": "Use if + present simple and will + base verb for a real possible future result. Example: If I finish early, I will call you. The if-clause can come first or second. Never use will directly after if in these examples.", "sv": "Första konditionalis: if + presens, will + grundform. Används för möjliga framtida situationer.", "questions": [{"q": "If it ___ tomorrow, we will stay home.", "options": ["rains", "will rain", "rained"], "answer": 0, "feedback": "After if, use present simple."}, {"q": "Choose the correct sentence.", "options": ["If I will study, I pass.", "If I study, I will pass.", "If I studied, I will pass."], "answer": 1, "feedback": "Use present simple in the if-clause and will in the result."}, {"q": "If you are tired, you ___ better after some rest.", "options": ["felt", "will feel", "feeling"], "answer": 1, "feedback": "Will + base verb describes a possible future result."}, {"q": "Which part is the condition? “We will leave if the bus arrives.”", "options": ["We will leave", "the bus arrives", "will leave"], "answer": 1, "feedback": "The if-clause states the condition."}, {"q": "Choose the correct verb: “She will help if she ___ time.”", "options": ["has", "will have", "had"], "answer": 0, "feedback": "She takes has in present simple."}, {"q": "Which sentence means a realistic future possibility?", "options": ["If I had wings, I would fly.", "If I see Alex, I will say hello.", "If I were invisible, I would hide."], "answer": 1, "feedback": "The first conditional describes a possible future event."}], "writing": {"prompt": "Write two original sentences using the grammar from this lesson. Then compare them with the model examples.", "sample": "If I finish my homework, I will watch a film. If it rains, we will stay inside.", "checks": ["I used the target grammar correctly.", "My verbs and word order are correct.", "My sentences communicate a clear meaning."]}}, {"title": "Second Conditional", "explain": "Use if + past simple and would + base verb to imagine unlikely or hypothetical situations now or in the future. Example: If I had a robot, I would ask it to clean my room. In careful English, “If I were you” is common.", "sv": "Andra konditionalis: if + preteritum, would + grundform. För tänkta eller osannolika situationer.", "questions": [{"q": "If I ___ a million pounds, I would travel.", "options": ["have", "had", "will have"], "answer": 1, "feedback": "Second conditional uses past simple after if."}, {"q": "Choose the correct result: “If she knew the answer, she ___ us.”", "options": ["would tell", "will tell", "told"], "answer": 0, "feedback": "Use would + base verb."}, {"q": "Which sentence is hypothetical?", "options": ["If I have time, I will call.", "If I were taller, I would play basketball.", "When I have time, I call."], "answer": 1, "feedback": "The speaker imagines a different present."}, {"q": "If I ___ you, I would apologise.", "options": ["am", "will be", "were"], "answer": 2, "feedback": "If I were you is a common hypothetical expression."}, {"q": "Choose the correct sentence.", "options": ["If he would practise, he improved.", "If he practised, he would improve.", "If he will practise, he would improve."], "answer": 1, "feedback": "Use past simple with if, would + base verb in the result."}, {"q": "“If I lived near school, I would walk.” This suggests that the speaker…", "options": ["definitely lives near school", "is imagining living near school", "walked yesterday"], "answer": 1, "feedback": "The sentence describes a hypothetical situation."}], "writing": {"prompt": "Write two original sentences using the grammar from this lesson. Then compare them with the model examples.", "sample": "If I could fly, I would visit another country. If I were you, I would ask for help.", "checks": ["I used the target grammar correctly.", "My verbs and word order are correct.", "My sentences communicate a clear meaning."]}}, {"title": "Passive Voice", "explain": "In active sentences, the subject does the action: Someone painted the wall. In passive sentences, the subject receives the action: The wall was painted. Build the passive with be + past participle. Present: is made. Past: was made.", "sv": "Passiv form: be + perfektparticip. Fokus ligger på vad som händer eller påverkas, inte alltid vem som gör det.", "questions": [{"q": "Choose the passive sentence.", "options": ["The chef cooked dinner.", "Dinner was cooked by the chef.", "The chef is cooking dinner."], "answer": 1, "feedback": "Was cooked is past passive."}, {"q": "The windows ___ cleaned every Friday.", "options": ["are", "is", "was"], "answer": 0, "feedback": "Plural windows takes are in present passive."}, {"q": "This song ___ written in 2010.", "options": ["is", "was", "were"], "answer": 1, "feedback": "Past passive uses was/were + past participle."}, {"q": "What is the passive of “People speak English here”?", "options": ["English is spoken here.", "English speaks here.", "English was speak here."], "answer": 0, "feedback": "Is spoken is present passive."}, {"q": "The homework was ___ yesterday.", "options": ["finish", "finished", "finishing"], "answer": 1, "feedback": "Passive uses the past participle finished."}, {"q": "Why might a writer use the passive?", "options": ["To focus on the action or result", "To always describe the future", "To avoid using verbs"], "answer": 0, "feedback": "Passive often focuses on what happened rather than who did it."}], "writing": {"prompt": "Write two original sentences using the grammar from this lesson. Then compare them with the model examples.", "sample": "The letters were delivered yesterday. This game is played around the world.", "checks": ["I used the target grammar correctly.", "My verbs and word order are correct.", "My sentences communicate a clear meaning."]}}, {"title": "Relative Clauses", "explain": "Relative clauses add information about a noun. Use who for people, which for things and that for people or things in defining clauses. Example: The student who won the race is in my class. The phone that I bought is broken.", "sv": "Relativa bisatser beskriver ett substantiv. Who för personer, which för saker, that kan ofta användas för båda.", "questions": [{"q": "The girl ___ sits next to me is kind.", "options": ["which", "who", "where"], "answer": 1, "feedback": "Who refers to a person."}, {"q": "This is the game ___ I told you about.", "options": ["that", "who", "where"], "answer": 0, "feedback": "That can refer to a thing in a defining clause."}, {"q": "Choose the best sentence.", "options": ["The man which helped me was friendly.", "The man who helped me was friendly.", "The man where helped me was friendly."], "answer": 1, "feedback": "Who introduces a clause about a person."}, {"q": "I found the keys ___ were missing.", "options": ["who", "where", "that"], "answer": 2, "feedback": "That refers to the keys."}, {"q": "What does “who lives upstairs” do in “The boy who lives upstairs plays drums”?", "options": ["Adds information about the boy", "Changes the sentence to past tense", "Asks a question"], "answer": 0, "feedback": "The relative clause identifies the boy."}, {"q": "Choose the correct relative pronoun: “The book ___ has a blue cover is mine.”", "options": ["which", "who", "whose"], "answer": 0, "feedback": "Which refers to a thing."}], "writing": {"prompt": "Write two original sentences using the grammar from this lesson. Then compare them with the model examples.", "sample": "The friend who called me was kind. I found a film that I really liked.", "checks": ["I used the target grammar correctly.", "My verbs and word order are correct.", "My sentences communicate a clear meaning."]}}, {"title": "Reported Speech", "explain": "Reported speech tells someone what another person said. Direct: “I am tired,” Mia said. Reported: Mia said that she was tired. When reporting later, present often shifts to past: am → was, can → could, will → would. Pronouns may also change.", "sv": "Indirekt tal återberättar vad någon sagt. Tempus och pronomen ändras ofta när vi berättar i efterhand.", "questions": [{"q": "Direct: “I am hungry,” Tom said. Reported: Tom said that he ___ hungry.", "options": ["is", "was", "will be"], "answer": 1, "feedback": "Am often shifts to was when reporting later."}, {"q": "Direct: “I can swim,” Ana said. Reported: Ana said she ___ swim.", "options": ["could", "will", "is"], "answer": 0, "feedback": "Can often shifts to could."}, {"q": "Direct: “I will help,” Sam said. Reported: Sam said he ___ help.", "options": ["can", "would", "was"], "answer": 1, "feedback": "Will often shifts to would."}, {"q": "Which is reported speech?", "options": ["“I love music,” she said.", "She said that she loved music.", "Do you love music?"], "answer": 1, "feedback": "This sentence reports what she said rather than quoting directly."}, {"q": "Direct: “We are ready,” they said. Reported: They said they ___ ready.", "options": ["were", "are being", "will"], "answer": 0, "feedback": "Are often shifts to were."}, {"q": "Why might “I” change to “she” in reported speech?", "options": ["The speaker is now described by someone else", "Reported speech always uses she", "The sentence becomes a question"], "answer": 0, "feedback": "Pronouns change to match who is being talked about."}], "writing": {"prompt": "Write two original sentences using the grammar from this lesson. Then compare them with the model examples.", "sample": "Ella said that she was busy. Ben said that he could help.", "checks": ["I used the target grammar correctly.", "My verbs and word order are correct.", "My sentences communicate a clear meaning."]}}, {"title": "Advanced Grammar Challenge", "explain": "You have practised conditionals, passive voice, relative clauses and reported speech. Read each sentence carefully and choose the form that matches its meaning.", "sv": "Sluttest: blanda alla fem områden. Läs sammanhanget noggrant innan du väljer svar.", "questions": [{"q": "If we leave now, we ___ on time.", "options": ["arrived", "will arrive", "would arrived"], "answer": 1, "feedback": "A realistic future condition uses will + base verb."}, {"q": "If I ___ a spaceship, I would visit Mars.", "options": ["had", "have", "will have"], "answer": 0, "feedback": "An imagined situation uses past simple after if."}, {"q": "The bridge ___ built in 1995.", "options": ["is", "were", "was"], "answer": 2, "feedback": "Past passive: was built."}, {"q": "The teacher ___ helped me was patient.", "options": ["who", "which", "where"], "answer": 0, "feedback": "Who refers to a person."}, {"q": "Direct: “I am nervous,” Jo said. Reported: Jo said that she ___ nervous.", "options": ["will be", "was", "can be"], "answer": 1, "feedback": "Am often shifts to was in reported speech."}, {"q": "Choose the correct sentence.", "options": ["If she studies, she will improve.", "If she will study, she improves.", "If she studied, she will improved."], "answer": 0, "feedback": "Present simple after if and will + base verb for the future result."}], "writing": {"prompt": "Write two original sentences using the grammar from this lesson. Then compare them with the model examples.", "sample": "If I practise, I will improve. The song was written years ago.", "checks": ["I used the target grammar correctly.", "My verbs and word order are correct.", "My sentences communicate a clear meaning."]}}]}.lessons;const KEY='english_journey_module_11_progress_v1';let progress;try{progress=JSON.parse(localStorage.getItem(KEY))||{unlocked:0,done:[]}}catch(e){progress={unlocked:0,done:[]}};if(!Array.isArray(progress.done))progress.done=[];let current=Math.min(progress.unlocked,5),answers={},showSwedish=false,attempted=false;function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('bar').style.width=(progress.done.length/6*100)+'%';document.getElementById('progressText').textContent=progress.done.length+' of 6 lessons completed';document.getElementById('nav').innerHTML=LESSONS.map((l,i)=>`<button data-go="${i}" ${i>progress.unlocked?'disabled':''} class="${i===current?'active':''}">${progress.done.includes(i)?'✓ ':i>progress.unlocked?'🔒 ':''}${i+1}. ${esc(l.title)}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{current=+b.dataset.go;answers={};attempted=false;render()});let l=LESSONS[current];document.getElementById('main').innerHTML=`<div class="row"><span class="tag">LESSON ${current+1} / 6</span><span class="muted">~8–12 minutes</span></div><h1>${esc(l.title)}</h1><p class="muted">Read the explanation, practise, and check your understanding.</p><div class="lessonbox"><strong>Learn it!</strong><p>${esc(l.explain).replace(/\n/g,"<br>")}</p><button class="secondary" id="sv">${showSwedish?'Hide Swedish help':'Visa svensk förklaring'}</button>${showSwedish?`<p lang="sv">${esc(l.sv)}</p>`:''}</div><h2 class="sectiontitle">Try it! <small class="muted">6 questions</small></h2><div id="questions"></div><button class="primary" id="grade">Check my answers</button><div id="result" aria-live="polite"></div><h2 class="sectiontitle">Extra practice: Write your own examples</h2><p>${esc(l.writing.prompt)}</p><textarea id="draft" placeholder="Write your own answer here..."></textarea><p class="muted">Your response is for practice. It is not sent or automatically assessed.</p><button class="secondary" id="sampleBtn">Show a model answer</button><div class="lessonbox hidden" id="sample"><strong>One possible answer</strong><p>${esc(l.writing.sample)}</p><p>Compare the structure and ideas, not just the exact words.</p></div><h3>Self-check</h3>${l.writing.checks.map(c=>`<label class="check"><input type="checkbox"> ${esc(c)}</label>`).join('')}<p class="footer">Progress is stored in this browser. Draft writing is not saved.</p>`;document.getElementById('sv').onclick=()=>{showSwedish=!showSwedish;const draft=document.getElementById('draft').value;render();document.getElementById('draft').value=draft};document.getElementById('sampleBtn').onclick=()=>document.getElementById('sample').classList.toggle('hidden');document.getElementById('grade').onclick=grade;drawQuestions()}function drawQuestions(){let l=LESSONS[current];document.getElementById('questions').innerHTML=l.questions.map((q,i)=>`<div class="question"><h3>${i+1}. ${esc(q.q)}</h3>${q.options.map((o,j)=>`<button class="option ${answers[i]===j?'selected':''}" data-q="${i}" data-a="${j}" ${attempted?'disabled':''}>${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}<div id="fb${i}"></div></div>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[+b.dataset.q]=+b.dataset.a;drawQuestions()})}function grade(){let l=LESSONS[current];if(Object.keys(answers).length<l.questions.length){document.getElementById('result').innerHTML='<div class="feedback bad">Answer all six questions before checking.</div>';return}attempted=true;drawQuestions();let score=0;l.questions.forEach((q,i)=>{let ok=answers[i]===q.answer;if(ok)score++;document.getElementById('fb'+i).innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'✓ Correct.':'Not yet. Correct answer: '+esc(q.options[q.answer])+'.'} ${esc(q.feedback)}</div>`});let pct=Math.round(score/l.questions.length*100),passed=pct>=80;document.getElementById('result').innerHTML=`<div class="feedback ${passed?'good':'bad'}"><strong>${score}/6 (${pct}%)</strong> — ${passed?'Well done! You have passed this lesson.':'You need at least 80% (5 out of 6). Review the explanations and try again.'}</div><div class="row" style="margin-top:12px"><button class="secondary" id="retry">Try again</button>${passed&&current<5?'<button class="primary" id="next">Next lesson →</button>':''}${passed&&current===5?'<strong>🎉 Module 11 complete!</strong>':''}</div>`;if(passed){if(!progress.done.includes(current))progress.done.push(current);progress.unlocked=Math.max(progress.unlocked,Math.min(current+1,5));save();document.getElementById('bar').style.width=(progress.done.length/6*100)+'%';document.getElementById('progressText').textContent=progress.done.length+' of 6 lessons completed';document.querySelectorAll('[data-go]').forEach(b=>{if(+b.dataset.go<=progress.unlocked)b.disabled=false});}document.getElementById('retry').onclick=()=>{answers={};attempted=false;drawQuestions();document.getElementById('result').innerHTML=''};let n=document.getElementById('next');if(n)n.onclick=()=>{current++;answers={};attempted=false;showSwedish=false;render()}}document.getElementById('reset').onclick=()=>{if(confirm('Reset all progress for Module 11 on this browser?')){progress={unlocked:0,done:[]};current=0;answers={};attempted=false;save();render()}};render();</script><script>(function(){
const moduleKeys={"english_journey_module_2.html": "english_journey_writing_basics_v1", "english_journey_module_5.html": "english-journey-vocab-v1", "english_journey_module_7.html": "english-journey-module7-v1", "english_journey_module_11.html": "english_journey_module_11_progress_v1", "english_journey_module_8.html": "english-journey-module8-v1", "english_journey_module_9_fixed.html": "english_journey_module_9_progress_v1", "english_journey_module_12_fixed.html": "english_journey_module_12_progress_v1", "english_journey_module_1.html": "english-journey-foundations-v1", "english_journey_module_6.html": "english-journey-module6-v1", "english_journey_module_4.html": "englishJourney_grammarInAction_v1", "english_journey_module_10.html": "english_journey_module_10_progress_v1", "english_journey_module_3.html": "englishJourney_readingSkillsI_v1"};
const gameNames=['english_arcade_grammar_rush.html','english_arcade_reading_detective.html','english_arcade_sentence_scramble.html','english_arcade_word_match.html','english_arcade_story_paths.html'];
const gameTitles=['Grammar Rush','Reading Detective','Sentence Scramble','Word Match','Story Paths'];
const prefix='academy2.game.';
function getModule(file){try{let d=JSON.parse(localStorage.getItem(moduleKeys[file])||'{}');let a=d.done||d.completed||[];return Math.min(6,Array.isArray(a)?new Set(a).size:0)}catch(e){return 0}}
function gameCount(file){try{let v=localStorage.getItem('academy3.plays.'+file);return v===null?(localStorage.getItem(prefix+file)==='1'?1:0):Math.max(0,parseInt(v,10)||0)}catch(e){return 0}}
function gameDone(file){return gameCount(file)>0}
function celebration(title){let wrap=document.createElement('div');wrap.className='academy-celebration';wrap.innerHTML='<div class="academy-pop"><div style="font-size:52px">🏆 ✨ 🎉</div><h2>ACHIEVEMENT UNLOCKED!</h2><p></p><button type="button">Awesome! ✨</button></div>';wrap.querySelector('p').textContent='Well done! You have mastered '+title+'!';wrap.querySelector('button').onclick=()=>wrap.remove();document.body.append(wrap)}
function award(id,title){try{let k='academy2.achievement.'+id;if(!localStorage.getItem(k)){localStorage.setItem(k,'1');celebration(title)}}catch(e){}}
function checkAchievements(){let all=Object.keys(moduleKeys),grammar=all.filter(x=>/module_(1|4|8|11)\.html$/.test(x));if(grammar.every(x=>getModule(x)===6))award('grammar','all grammar modules');if(all.every(x=>getModule(x)===6))award('allmodules','all course modules');if(gameNames.every(gameDone))award('arcade','all arcade games');if(all.every(x=>getModule(x)===6)&&gameNames.every(gameDone))award('academy','English Academy')}
function markGame(file){try{let key='academy3.plays.'+file;localStorage.setItem(key,String(gameCount(file)+1))}catch(e){}checkAchievements()}
function renderHome(){document.querySelectorAll('a.card[href]').forEach(card=>{let file=card.getAttribute('href');let isModule=!!moduleKeys[file],isGame=gameNames.includes(file);if(!isModule&&!isGame)return;let n=isModule?getModule(file):gameCount(file);card.classList.toggle('academy-mastered',isModule&&n===6);let label=card.querySelector('.academy-status');if(!label){label=document.createElement('div');label.className='academy-status';card.insertBefore(label,card.querySelector('.go'))}if(isModule){label.innerHTML='<div class="academy-status-line"><span>'+(n===6?'✓ Mastered!':n+' / 6 lessons completed')+'</span><span>'+Math.round(n/6*100)+'%</span></div><div class="academy-track"><div style="width:'+Math.round(n/6*100)+'%"></div></div>'}else{label.innerHTML='<div class="academy-status-line"><span>🎮 '+n+' '+(n===1?'time':'times')+' played</span><span>'+(n?'Keep playing!':'Ready to play')+'</span></div>';}});let n=Object.keys(moduleKeys).reduce((a,x)=>a+getModule(x),0);let banner=document.getElementById('academy-overview');if(banner)banner.textContent='Your journey: '+n+' / 72 lessons completed · '+gameNames.reduce((a,x)=>a+gameCount(x),0)+' arcade rounds played';checkAchievements()}
window.Academy2={markGame,checkAchievements,renderHome};
if(document.body.querySelector('a.card[href]')){renderHome();window.addEventListener('pageshow',renderHome)}
else {let bar=document.createElement('div');bar.className='academy-back';bar.innerHTML='<a href="index.html">← Back to English Academy</a>';document.body.prepend(bar);let bottom=bar.cloneNode(true);bottom.className+=' academy-bottom';document.body.append(bottom);let file=location.pathname.split('/').pop();if(moduleKeys[file]){let old=getModule(file);setInterval(()=>{let now=getModule(file);if(now>old){old=now;if(now===6){award('module-'+file,document.title.replace(/\s*[|–-].*$/,'')||'this module');checkAchievements()}}},1300)}}
})();</script></body></html>
