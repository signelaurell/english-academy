<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Journey · Advanced Grammar I</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;color:#23304c;background:#f5f6fc}.top{background:linear-gradient(120deg,#30345d,#6651a8);color:white;padding:24px max(20px,calc((100vw - 1000px)/2))}.top h1{margin:5px 0;font-size:29px}.top small{opacity:.85}main{max-width:1000px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:260px 1fr;gap:20px}.panel{background:white;border:1px solid #e1e4f0;border-radius:17px;padding:23px;box-shadow:0 4px 15px #28315d0b}.nav button{display:block;width:100%;text-align:left;margin:9px 0;padding:13px;border:1px solid #e0e4ef;background:#fafbff;border-radius:11px;color:#293557;cursor:pointer}.nav button.active{background:#eee9ff;border-color:#a99ae8}.nav button:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-block;background:#e9e4fb;color:#5c4498;border-radius:20px;padding:5px 11px;font-size:12px;font-weight:700}.progress{height:9px;background:#e9eaf2;border-radius:9px;overflow:hidden;margin:13px 0}.progress>div{height:100%;background:#7461c8}.lesson h2{font-size:27px;margin:10px 0}.intro{color:#65718a}.learn{background:#f3f0ff;border-left:4px solid #8c75d6;border-radius:10px;padding:17px;margin:20px 0;line-height:1.65}.passage{background:#fafbff;border:1px solid #e2e4f0;border-radius:11px;padding:20px;line-height:1.85;font-size:16px}.task{border-top:1px solid #e7e8f0;padding:19px 0}.task p{font-weight:600}.options{display:grid;gap:9px}.options button{border:1px solid #dfe2ee;background:white;padding:12px;text-align:left;border-radius:9px;cursor:pointer;color:#263252;font-size:15px}.options button.selected{border-color:#7561c6;background:#eeeaff}.options button.good{background:#e5f6eb;border-color:#62ae7b}.options button.bad{background:#fff0ed;border-color:#d38a80}.feedback{margin-top:9px;color:#4c5870;font-size:14px}.primary,.secondary{border:0;background:#6754b3;color:white;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}.secondary{background:#eee9ff;color:#574298}.primary:disabled{opacity:.5;cursor:not-allowed}.sw{margin-top:8px}.score{background:#f1f9f4;padding:15px;border-radius:10px;margin:15px 0}.footer{font-size:12px;color:#7b8599;margin-top:25px}button:focus-visible{outline:3px solid #a28ce7}@media(max-width:740px){main{grid-template-columns:1fr}.top{padding:20px}.panel{padding:18px}}</style><style id="academy2-css">.academy-back{position:relative;z-index:10;padding:12px 22px;background:#171027;color:#e9d5ff;font:700 14px system-ui}.academy-back a{color:#e9d5ff;text-decoration:none}.academy-back a:hover{text-decoration:underline}.academy-bottom{margin-top:32px}.academy-status{margin:12px 0 0;font:600 12px system-ui;color:#cbb5e5}.academy-status-line{display:flex;justify-content:space-between;gap:8px}.academy-track{height:7px;border-radius:9px;background:#4d3766;overflow:hidden;margin-top:8px}.academy-track>div{height:100%;background:#ae72ff;border-radius:9px}.academy-mastered{border-color:#22c55e!important;background:linear-gradient(140deg,#16452d,#10291e)!important}.academy-mastered .academy-status{color:#9cf4b4}.academy-mastered .academy-track>div{background:#22c55e}.academy-celebration{position:fixed;inset:0;z-index:99999;background:#080411c9;display:grid;place-items:center;padding:20px}.academy-pop{width:min(440px,100%);padding:38px 25px;text-align:center;border:2px solid #a78bfa;border-radius:24px;background:#25143d;color:#fff;box-shadow:0 0 90px #a855f755;font-family:system-ui}.academy-pop h2{font-size:25px;color:#e9c5ff}.academy-pop p{font-size:18px;line-height:1.5}.academy-pop button{border:0;border-radius:12px;background:#a78bfa;color:#160b2a;font-weight:800;padding:14px 22px;cursor:pointer}</style></head><body><header class="top"><small>ENGLISH JOURNEY · MODULE 8</small><h1>Advanced Grammar I</h1><div>Understand the rules. Use English with confidence.</div></header><main><aside class="panel"><b>Your learning path</b><div class="progress"><div id="bar"></div></div><small id="progressLabel"></small><nav class="nav" id="nav"></nav><button class="secondary" id="reset">Reset my progress</button></aside><section class="panel lesson" id="content"></section></main><script>const LESSONS=[{"title": "Present Simple vs Present Continuous", "goal": "Choose between routines and actions happening now.", "sw": "Present simple används för vanor. Present continuous (am/is/are + -ing) används för sådant som händer just nu.", "passage": "I usually walk to school. Today I am taking the bus. She plays tennis every Saturday. Look! She is playing tennis now.", "questions": [{"question": "Choose the correct sentence for something happening right now.", "options": ["She reads a book every day.", "She is reading a book.", "She read a book yesterday.", "She has read the book."], "correct": "She is reading a book.", "feedback": "Present continuous describes an action in progress.", "evidence": ""}, {"question": "Complete: My dad usually ___ dinner at six.", "options": ["is cooking", "cooks", "cook", "cooked"], "correct": "cooks", "feedback": "Usually signals a routine; he/she/it takes -s.", "evidence": ""}, {"question": "Complete: Listen! The baby ___ .", "options": ["cries", "is crying", "cry", "cried"], "correct": "is crying", "feedback": "Listen! indicates something happening now.", "evidence": ""}, {"question": "Choose the sentence describing a regular habit.", "options": ["We are visiting them right now.", "We visit our grandparents on Sundays.", "We visited them last Sunday.", "We will visit them tomorrow."], "correct": "We visit our grandparents on Sundays.", "feedback": "On Sundays signals a repeated habit.", "evidence": ""}, {"question": "Complete: I ___ my homework at the moment.", "options": ["do", "am doing", "does", "did"], "correct": "am doing", "feedback": "At the moment calls for am + -ing.", "evidence": ""}, {"question": "Complete: They ___ football every Friday.", "options": ["plays", "play", "are playing", "played"], "correct": "play", "feedback": "Every Friday indicates a routine; they takes the base verb.", "evidence": ""}]}, {"title": "Past Simple vs Present Perfect", "goal": "Tell the difference between finished past events and experiences connected to now.", "sw": "Past simple används för avslutade händelser med en bestämd tid. Present perfect bildas med have/has + tredje verbformen.", "passage": "I visited London in 2023. I have visited London twice. She lost her keys yesterday. She has lost her keys, so she cannot open the door.", "questions": [{"question": "Complete: I ___ that film last night.", "options": ["have watched", "watched", "watch", "am watching"], "correct": "watched", "feedback": "Last night names a finished time, so use past simple.", "evidence": ""}, {"question": "Complete: She ___ never ___ sushi.", "options": ["have / tried", "has / tried", "has / try", "did / tried"], "correct": "has / tried", "feedback": "She takes has, followed by the past participle tried.", "evidence": ""}, {"question": "Which sentence correctly describes a life experience without a specific time?", "options": ["I went to Scotland last year.", "I have been to Scotland.", "I am going to Scotland now.", "I go to Scotland every summer."], "correct": "I have been to Scotland.", "feedback": "Present perfect is often used for life experiences.", "evidence": ""}, {"question": "Complete: We ___ our teacher yesterday.", "options": ["have met", "met", "meet", "are meeting"], "correct": "met", "feedback": "Yesterday calls for the past simple form met.", "evidence": ""}, {"question": "Complete: He ___ already finished his project.", "options": ["have", "has", "is", "did"], "correct": "has", "feedback": "He takes has in the present perfect.", "evidence": ""}, {"question": "Choose the correct sentence.", "options": ["They has lived here for three years.", "They have lived here for three years.", "They have live here for three years.", "They lived here since three years."], "correct": "They have lived here for three years.", "feedback": "Have + past participle works with a period continuing to the present.", "evidence": ""}]}, {"title": "Comparatives and Superlatives", "goal": "Compare two things and identify the highest degree.", "sw": "Comparative jämför två: taller, more interesting. Superlative jämför inom en grupp: the tallest, the most interesting.", "passage": "My bike is faster than yours. This is the fastest bike in the shop. English is more interesting than I expected.", "questions": [{"question": "Complete: This puzzle is ___ than the last one.", "options": ["hardest", "harder", "more hard", "the harder"], "correct": "harder", "feedback": "Short adjectives usually take -er with than.", "evidence": ""}, {"question": "Complete: That is ___ film I have ever seen.", "options": ["funnier", "the funniest", "the funnier", "more funny"], "correct": "the funniest", "feedback": "Superlatives normally use the and -est; funny becomes funniest.", "evidence": ""}, {"question": "Complete: My bag is ___ than yours.", "options": ["heavyer", "heavier", "heaviest", "most heavy"], "correct": "heavier", "feedback": "Heavy changes y to i before -er.", "evidence": ""}, {"question": "Complete: This book is ___ than the first one.", "options": ["interestinger", "more interesting", "most interesting", "the interesting"], "correct": "more interesting", "feedback": "Long adjectives commonly use more for comparisons.", "evidence": ""}, {"question": "Complete: Mount Everest is ___ mountain in the world.", "options": ["higher", "the highest", "the higher", "most high"], "correct": "the highest", "feedback": "A superlative identifies the highest in a group.", "evidence": ""}, {"question": "Choose the grammatically correct comparison.", "options": ["This test is gooder than the last one.", "This test is better than the last one.", "This test is best than the last one.", "This test is more better than the last one."], "correct": "This test is better than the last one.", "feedback": "Good has the irregular comparative better.", "evidence": ""}]}, {"title": "Modal Verbs", "goal": "Use can, could, must, should and might for different meanings.", "sw": "Modala hjälpverb följs av verbets grundform: can swim, should study. Must uttrycker stark skyldighet, should ger råd, might uttrycker möjlighet.", "passage": "You must wear a helmet here. You should drink water. It might rain later. She can speak French.", "questions": [{"question": "Choose the best advice: Your friend is tired.", "options": ["You must to get some rest.", "You should get some rest.", "You can getting some rest.", "You might gets some rest."], "correct": "You should get some rest.", "feedback": "Should + base verb gives advice.", "evidence": ""}, {"question": "Complete: You ___ wear a seat belt in the car.", "options": ["might", "must", "could", "may"], "correct": "must", "feedback": "Must expresses a strong obligation.", "evidence": ""}, {"question": "Complete: It ___ snow tomorrow, but I am not sure.", "options": ["must", "might", "can to", "should to"], "correct": "might", "feedback": "Might expresses uncertainty or possibility.", "evidence": ""}, {"question": "Choose the correct sentence.", "options": ["She cans swim very well.", "She can swim very well.", "She can swims very well.", "She can to swim very well."], "correct": "She can swim very well.", "feedback": "Can is followed by the base form swim.", "evidence": ""}, {"question": "Complete: When I was five, I ___ ride a bike.", "options": ["cannot to", "could not", "must not to", "should not to"], "correct": "could not", "feedback": "Could not can describe a lack of ability in the past.", "evidence": ""}, {"question": "Complete: You ___ be rude to other people.", "options": ["might to", "should not", "can to", "must to"], "correct": "should not", "feedback": "Should not gives advice about what to avoid.", "evidence": ""}]}, {"title": "Choosing the Right Tense", "goal": "Use context clues to select an appropriate tense.", "sw": "Leta efter tidsuttryck: every day (present simple), now (present continuous), yesterday (past simple), already/ever (present perfect).", "passage": "Every day I practise piano. Right now I am practising. Yesterday I practised for an hour. I have already practised today.", "questions": [{"question": "Complete: Right now, we ___ for the bus.", "options": ["wait", "are waiting", "waited", "have wait"], "correct": "are waiting", "feedback": "Right now signals present continuous.", "evidence": ""}, {"question": "Complete: Last weekend, they ___ to the coast.", "options": ["have gone", "went", "go", "are going"], "correct": "went", "feedback": "Last weekend is a finished time; go becomes went.", "evidence": ""}, {"question": "Complete: I ___ never ___ a horse.", "options": ["has / ridden", "have / ridden", "have / rode", "did / ridden"], "correct": "have / ridden", "feedback": "I takes have + the past participle ridden.", "evidence": ""}, {"question": "Complete: He ___ his teeth every morning.", "options": ["brush", "brushes", "is brushing", "brushed"], "correct": "brushes", "feedback": "Every morning signals a routine; he takes -es.", "evidence": ""}, {"question": "Complete: Look! The sun ___ .", "options": ["shines", "is shining", "shone", "has shine"], "correct": "is shining", "feedback": "Look! draws attention to something happening now.", "evidence": ""}, {"question": "Complete: We ___ our homework two hours ago.", "options": ["have finished", "finished", "finish", "are finishing"], "correct": "finished", "feedback": "Ago is used with past simple.", "evidence": ""}]}, {"title": "Advanced Grammar Challenge", "goal": "Apply all five skills in mixed real-life sentences.", "sw": "Repetera tempus, komparation och modala hjälpverb. Läs tidsuttrycken och tänk på vad meningen betyder.", "passage": "Use what you have learned: routines, actions now, past events, experiences, comparisons and modal verbs.", "questions": [{"question": "Complete: I ___ my cousin last Saturday.", "options": ["have visited", "visited", "visit", "am visiting"], "correct": "visited", "feedback": "Last Saturday is a finished past time.", "evidence": ""}, {"question": "Complete: This is ___ meal on the menu.", "options": ["more expensive", "the most expensive", "expensiver", "the more expensive"], "correct": "the most expensive", "feedback": "The superlative of a long adjective uses the most.", "evidence": ""}, {"question": "Complete: You ___ check your answers before handing in your work.", "options": ["should to", "should", "can to", "might to"], "correct": "should", "feedback": "Should + base verb expresses useful advice.", "evidence": ""}, {"question": "Complete: She ___ her keys, so she cannot get inside.", "options": ["have lost", "has lost", "lost yesterday", "is lose"], "correct": "has lost", "feedback": "Present perfect connects a past event with its present result.", "evidence": ""}, {"question": "Complete: We usually ___ lunch at twelve.", "options": ["eats", "eat", "are eating", "ate"], "correct": "eat", "feedback": "Usually signals a habit; we takes the base form.", "evidence": ""}, {"question": "Complete: Be quiet! The students ___ a test.", "options": ["take every day", "are taking", "took yesterday", "have took"], "correct": "are taking", "feedback": "The instruction refers to an action happening now.", "evidence": ""}]}];const KEY='english-journey-module8-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{unlocked:0,completed:[]}}catch(e){state={unlocked:0,completed:[]}}state.unlocked=Math.max(0,Math.min(5,state.unlocked||0));state.completed=Array.isArray(state.completed)?state.completed:[];let current=0,answers={},showSw=false,showEvidence={};const $=s=>document.querySelector(s);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}function render(){const nav=$('#nav');nav.replaceChildren();LESSONS.forEach((l,i)=>{const b=el('button',i===current?'active':'',`${state.completed.includes(i)?'✓':i>state.unlocked?'🔒':'○'}  ${i+1}. ${l.title}`);b.disabled=i>state.unlocked;b.onclick=()=>{current=i;answers={};showEvidence={};showSw=false;render()};nav.append(b)});$('#bar').style.width=(state.completed.length/6*100)+'%';$('#progressLabel').textContent=`${state.completed.length} of 6 lessons completed`;const l=LESSONS[current],c=$('#content');c.replaceChildren();c.append(el('span','pill',`LESSON ${current+1} OF 6`),el('h2','',l.title),el('p','intro',l.goal));const box=el('div','learn');box.append(el('b','', 'LEARN IT!'),el('p','',l.goal+' Read the text carefully. Look for clues and check the passage when you are unsure.'));const sw=el('button','secondary sw',showSw?'Hide Swedish support':'Visa svensk förklaring');sw.onclick=()=>{showSw=!showSw;render()};box.append(sw);if(showSw)box.append(el('p','',l.sw));c.append(box,el('h3','','EXAMPLES'),el('div','passage',l.passage),el('h3','','TRY IT!'));l.questions.forEach((q,i)=>{const task=el('div','task');task.append(el('p','',`${i+1}. ${q.question}`));const opts=el('div','options');q.options.forEach(option=>{let cls=answers[i]===option?'selected':'';if(answers[i]!==undefined&&answers[i]===option)cls=option===q.correct?'good':'bad';const b=el('button',cls,option);b.onclick=()=>{answers[i]=option;render()};opts.append(b)});task.append(opts);if(answers[i]!==undefined){const correct=answers[i]===q.correct;task.append(el('div','feedback',correct?'✓ Correct! '+q.feedback:'Not quite. '+(correct?'': 'Read the passage again and try another answer.')));if(correct){const evidenceBtn=el('button','secondary sw',showEvidence[i]?'Hide explanation':'Why is this correct?');evidenceBtn.onclick=()=>{showEvidence[i]=!showEvidence[i];render()};task.append(evidenceBtn);if(showEvidence[i])task.append(el('div','learn','Explanation: '+q.feedback))}}c.append(task)});const right=l.questions.filter((q,i)=>answers[i]===q.correct).length;const total=l.questions.length;c.append(el('div','score',`Practice score: ${right}/${total} (${Math.round(100*right/total)}%). You need at least 80% to continue.`));const btn=el('button','primary',state.completed.includes(current)?'Lesson completed ✓':current===5?'Complete module':'Complete lesson →');btn.disabled=right<Math.ceil(total*.8);btn.onclick=()=>{if(!state.completed.includes(current))state.completed.push(current);state.unlocked=Math.min(5,Math.max(state.unlocked,current+1));save();if(current<5)current++;answers={};showEvidence={};showSw=false;render();window.scrollTo(0,0)};c.append(btn);if(state.completed.includes(5))c.append(el('div','score','🎉 Module complete! Great work. You are ready for the next module.'));c.append(el('div','footer','Your completed lessons are saved in this browser. Individual answers are not stored or sent anywhere.'))}$('#reset').onclick=()=>{if(confirm('Reset all progress for Module 8?')){state={unlocked:0,completed:[]};save();current=0;answers={};render()}};render();</script><script>(function(){
const moduleKeys={"english_journey_module_2.html": "english_journey_writing_basics_v1", "english_journey_module_5.html": "english-journey-vocab-v1", "english_journey_module_7.html": "english-journey-module7-v1", "english_journey_module_11.html": "english_journey_module_11_progress_v1", "english_journey_module_8.html": "english-journey-module8-v1", "english_journey_module_9_fixed.html": "english_journey_module_9_progress_v1", "english_journey_module_12_fixed.html": "english_journey_module_12_progress_v1", "english_journey_module_1.html": "english-journey-foundations-v1", "english_journey_module_6.html": "english-journey-module6-v1", "english_journey_module_4.html": "englishJourney_grammarInAction_v1", "english_journey_module_10.html": "english_journey_module_10_progress_v1", "english_journey_module_3.html": "englishJourney_readingSkillsI_v1"};
const gameNames=['english_arcade_grammar_rush.html','english_arcade_reading_detective.html','english_arcade_sentence_scramble.html','english_arcade_word_match.html','english_arcade_story_paths.html'];
const gameTitles=['Grammar Rush','Reading Detective','Sentence Scramble','Word Match','Story Paths'];
const prefix='academy2.game.';
function getModule(file){try{let d=JSON.parse(localStorage.getItem(moduleKeys[file])||'{}');let a=d.done||d.completed||[];return Math.min(6,Array.isArray(a)?new Set(a).size:0)}catch(e){return 0}}
function gameCount(file){try{let v=localStorage.getItem('academy3.plays.'+file);return v===null?(localStorage.getItem(prefix+file)==='1'?1:0):Math.max(0,parseInt(v,10)||0)}catch(e){return 0}}
function gameDone(file){return gameCount(file)>0}
function celebration(title){let wrap=document.createElement('div');wrap.className='academy-celebration';wrap.innerHTML='<div class="academy-pop"><div style="font-size:52px">🏆 ✨ 🎉</div><h2>ACHIEVEMENT UNLOCKED!</h2><p></p><button type="button">Awesome! ✨</button></div>';wrap.querySelector('p').textContent='Well done! You have mastered '+title+'!';wrap.querySelector('button').onclick=()=>wrap.remove();document.body.append(wrap)}
function award(id,title){try{let k='academy2.achievement.'+id;if(!localStorage.getItem(k)){localStorage.setItem(k,'1');celebration(title)}}catch(e){}}
function checkAchievements(){let all=Object.keys(moduleKeys),grammar=all.filter(x=>/module_(1|4|8|11)\.html$/.test(x));if(grammar.every(x=>getModule(x)===6))award('grammar','all grammar modules');if(all.every(x=>getModule(x)===6))award('allmodules','all course modules');if(gameNames.every(gameDone))award('arcade','all arcade games');if(all.every(x=>getModule(x)===6)&&gameNames.every(gameDone))award('academy','English Academy')}

window.Academy2={markGame,checkAchievements,renderHome};
if(document.body.querySelector('a.card[href]')){renderHome();window.addEventListener('pageshow',renderHome)}
else {let bar=document.createElement('div');bar.className='academy-back';bar.innerHTML='<a href="index.html">← Back to English Academy</a>';document.body.prepend(bar);let bottom=bar.cloneNode(true);bottom.className+=' academy-bottom';document.body.append(bottom);let file=location.pathname.split('/').pop();if(moduleKeys[file]){let old=getModule(file);setInterval(()=>{let now=getModule(file);if(now>old){old=now;if(now===6){award('module-'+file,document.title.replace(/\s*[|–-].*$/,'')||'this module');checkAchievements()}}},1300)}}
