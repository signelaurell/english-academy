<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Journey | Grammar Foundations</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1d2941;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}header{background:#182b52;color:white;padding:20px max(20px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:22px;font-weight:800}.tag{font-size:12px;opacity:.8}main{max-width:1050px;margin:28px auto;padding:0 20px;display:grid;grid-template-columns:270px 1fr;gap:24px}aside,.panel{background:white;border-radius:18px;padding:23px;box-shadow:0 6px 25px #182b5210}aside{align-self:start}.lesson{display:block;width:100%;text-align:left;padding:12px;border:0;background:transparent;border-radius:12px;margin:7px 0;color:#27334c;cursor:pointer}.lesson:disabled{opacity:.45;cursor:not-allowed}.lesson.active{background:#e9edff;color:#3446a6;font-weight:700}.lesson.done:before{content:'✓ ';color:#14846d}h1{font-size:30px;margin:0 0 6px}h2{margin:4px 0 12px;font-size:22px}p{line-height:1.6}.muted{color:#66748b}.pill{display:inline-block;border-radius:20px;background:#e7f6f1;color:#08755e;padding:5px 10px;font-size:12px;font-weight:700}.explain{background:#f0f5ff;border-left:4px solid #5d70d8;padding:17px;border-radius:9px;margin:20px 0}.swedish{background:#fff8e8;border-left:4px solid #d5a332;padding:14px;border-radius:8px;margin:12px 0}.question{padding:20px 0;border-top:1px solid #e8ecf4}.question strong{display:block;margin-bottom:12px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}button,.option{font:inherit}.option{border:1px solid #d4ddeb;background:white;border-radius:9px;padding:11px;cursor:pointer;text-align:left}.option:hover:not(:disabled){border-color:#5367ce}.option.selected{border:2px solid #566acb;background:#eef1ff}.option.correct{background:#e4f7ed;border-color:#15966c}.option.wrong{background:#fff0ed;border-color:#e27d68}input[type=text]{border:1px solid #c7d0e2;border-radius:9px;padding:12px;font:inherit;max-width:100%;width:290px}button.primary{background:#465bc0;border:0;color:white;padding:12px 19px;border-radius:10px;cursor:pointer;font-weight:700}button.secondary{border:1px solid #bdc8e0;background:white;padding:9px 13px;border-radius:9px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:10px;border-radius:9px;background:#f2f5fb;padding:12px;font-size:14px}.good{color:#087b5a}.bad{color:#b84a36}.bar{height:10px;background:#e7ebf4;border-radius:20px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#26a78b;transition:width .3s}.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}.tiny{font-size:12px}.matchrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.matchrow select{padding:9px;border-radius:8px;border:1px solid #c7d0e2;max-width:100%}@media(max-width:750px){main{display:block}aside{margin-bottom:18px}.options{grid-template-columns:1fr}header{padding:18px}.brand{font-size:18px}}</style><style id="academy2-css">.academy-back{position:relative;z-index:10;padding:12px 22px;background:#171027;color:#e9d5ff;font:700 14px system-ui}.academy-back a{color:#e9d5ff;text-decoration:none}.academy-back a:hover{text-decoration:underline}.academy-bottom{margin-top:32px}.academy-status{margin:12px 0 0;font:600 12px system-ui;color:#cbb5e5}.academy-status-line{display:flex;justify-content:space-between;gap:8px}.academy-track{height:7px;border-radius:9px;background:#4d3766;overflow:hidden;margin-top:8px}.academy-track>div{height:100%;background:#ae72ff;border-radius:9px}.academy-mastered{border-color:#22c55e!important;background:linear-gradient(140deg,#16452d,#10291e)!important}.academy-mastered .academy-status{color:#9cf4b4}.academy-mastered .academy-track>div{background:#22c55e}.academy-celebration{position:fixed;inset:0;z-index:99999;background:#080411c9;display:grid;place-items:center;padding:20px}.academy-pop{width:min(440px,100%);padding:38px 25px;text-align:center;border:2px solid #a78bfa;border-radius:24px;background:#25143d;color:#fff;box-shadow:0 0 90px #a855f755;font-family:system-ui}.academy-pop h2{font-size:25px;color:#e9c5ff}.academy-pop p{font-size:18px;line-height:1.5}.academy-pop button{border:0;border-radius:12px;background:#a78bfa;color:#160b2a;font-weight:800;padding:14px 22px;cursor:pointer}</style></head><body><header><div><div class="brand">✦ English Journey</div><div class="tag">Learn at your own pace</div></div><span class="pill">Grammar Foundations</span></header><main><aside><strong>Your learning path</strong><p class="muted tiny">Complete each lesson to unlock the next.</p><div class="bar"><div id="overall" class="fill"></div></div><div id="nav"></div><hr style="border:0;border-top:1px solid #edf0f6"><button class="secondary" id="reset">Reset progress</button><p class="tiny muted">Progress is saved in this browser only. No answers are uploaded.</p></aside><section class="panel" id="content"></section></main><script>
const lessons=[
{title:'To Be',subtitle:'am · is · are',intro:'We use <b>am, is</b> and <b>are</b> to say who someone is, how they feel or where they are.<br><br><b>I am</b> ready. · <b>She is</b> happy. · <b>They are</b> at school.',sv:'Vi använder am med I, is med he/she/it och are med you/we/they.',qs:[['choice','I ___ thirteen years old.',['am','is','are','be'],'am','Use am after I.'],['choice','My friends ___ in the library.',['am','is','are','be'],'are','Friends is plural, so use are.'],['gap','She ___ very tired today.','is','She takes is.'],['choice','Which sentence is correct?',['We is late.','He are hungry.','You are kind.','I is ready.'],'You are kind.','You takes are.'],['match','Match each subject to the correct form.',[['I','am'],['he','is'],['they','are']]]]},
{title:'Have & Has',subtitle:'Talking about possessions',intro:'Use <b>have</b> with I, you, we and they. Use <b>has</b> with he, she and it.<br><br>I <b>have</b> a bike. · My sister <b>has</b> a dog.',sv:'Have betyder ha. He, she och it följs av has i presens.',qs:[['choice','Emma ___ two brothers.',['have','has','having','had'],'has','Emma = she, so use has.'],['gap','We ___ English on Mondays.','have','We takes have.'],['choice','Which sentence is correct?',['He have a cat.','They has a car.','I has a pen.','She has a bike.'],'She has a bike.','She takes has.'],['gap','My parents ___ a small garden.','have','Parents is plural.'],['match','Match each subject to the correct verb.',[['she','has'],['you','have'],['it','has']]]]},
{title:'Present Simple',subtitle:'Habits and routines',intro:'We use the <b>present simple</b> for routines and facts. With <b>he, she, it</b>, we usually add <b>-s</b> to the verb.<br><br>I play tennis. · He plays tennis. · She watches TV.',sv:'Presens beskriver vanor och fakta. I tredje person singular lägger vi oftast till -s eller -es.',qs:[['gap','My brother ___ (play) football every Saturday.','plays','Brother = he, so add -s.'],['choice','She ___ to school by bus.',['go','goes','going','gone'],'goes','Go becomes goes with she.'],['gap','They ___ (live) near the park.','live','They uses the base form.'],['choice','Which sentence is correct?',['He watch TV.','She studies English.','They plays games.','I goes home.'],'She studies English.','Study changes to studies after she.'],['match','Match the subject with the verb form.',[['I','read'],['he','reads'],['they','read']]]]},
{title:'Questions & Negatives',subtitle:'do · does · don’t · doesn’t',intro:'Use <b>do</b> and <b>does</b> to ask present simple questions. Use <b>don’t</b> and <b>doesn’t</b> to make negatives.<br><br><b>Do</b> you like music? · <b>Does</b> he play? · She <b>doesn’t like</b> coffee.',sv:'Do/don’t används med I/you/we/they. Does/doesn’t används med he/she/it. Efter does/doesn’t står huvudverbet i grundform.',qs:[['choice','___ your sister like pizza?',['Do','Does','Is','Are'],'Does','Your sister = she.'],['gap','I ___ (do not) eat meat.','don’t','I takes don’t.'],['choice','Choose the correct sentence.',['He doesn’t plays.','He don’t play.','He doesn’t play.','He not plays.'],'He doesn’t play.','After doesn’t, use play, not plays.'],['gap','___ they speak English?','do','They takes do.'],['match','Match each subject to its negative helper.',[['she','doesn’t'],['we','don’t'],['he','doesn’t']]]]},
{title:'Pronouns & Possessives',subtitle:'I · me · my · mine',intro:'A <b>subject pronoun</b> does an action: <b>She</b> plays. An <b>object pronoun</b> receives it: I see <b>her</b>.<br><br><b>My</b> book is blue. · This book is <b>mine</b>.',sv:'Subjektspronomen: I, you, he, she, it, we, they. Objektspronomen: me, you, him, her, it, us, them. My står framför ett substantiv; mine kan stå själv.',qs:[['choice','Anna is my friend. I see ___ every day.',['she','her','hers','he'],'her','After see, use the object pronoun her.'],['gap','This is ___ (I) backpack.','my','Before backpack, use my.'],['choice','That jacket belongs to me. It is ___.',['my','me','mine','I'],'mine','Mine stands alone to show possession.'],['choice','___ are going to the cinema.',['Us','Our','We','Them'],'We','We is a subject pronoun.'],['match','Match the subject pronoun to its object form.',[['he','him'],['we','us'],['they','them']]]]},
{title:'Final Challenge',subtitle:'Show what you know',intro:'You have reached the final challenge! Answer ten questions about everything you have practised. You need <b>8 out of 10</b> to complete Grammar Foundations.',sv:'Sluttest med tio frågor. Du behöver minst åtta rätt. Om du inte klarar det får du försöka igen.',qs:[['choice','I ___ happy.',['is','am','are','be'],'am','I takes am.'],['choice','My dad ___ a car.',['have','has','having','had'],'has','Dad = he.'],['gap','She ___ (walk) to school.','walks','Add -s after she.'],['choice','___ they play basketball?',['Does','Do','Is','Has'],'Do','They takes do.'],['gap','He ___ (does not) like fish.','doesn’t','He takes doesn’t.'],['choice','This is ___ book.',['me','mine','my','I'],'my','My comes before book.'],['choice','I know Tom. I often talk to ___.',['he','his','him','her'],'him','Him is the object pronoun.'],['gap','We ___ (be) ready.','are','We takes are.'],['choice','Which is correct?',['She don’t sing.','She doesn’t sings.','She doesn’t sing.','She not sing.'],'She doesn’t sing.','After doesn’t, use the base verb.'],['choice','These shoes belong to us. They are ___.',['our','ours','we','us'],'ours','Ours stands alone.']]}];
const KEY='english-journey-foundations-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{unlocked:0,done:[],index:0}}catch{state={unlocked:0,done:[],index:0}};let responses={},checked=false;function save(){localStorage.setItem(KEY,JSON.stringify(state))}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let l=lessons[state.index];document.getElementById('overall').style.width=(state.done.length/6*100)+'%';document.getElementById('nav').innerHTML=lessons.map((x,i)=>`<button class="lesson ${i===state.index?'active':''} ${state.done.includes(i)?'done':''}" ${i>state.unlocked?'disabled':''} onclick="go(${i})">${i>state.unlocked?'🔒 ':''}${i+1}. ${x.title}<div class="tiny muted">${x.subtitle}</div></button>`).join('');let html=`<span class="pill">MODULE 1 · LESSON ${state.index+1} OF 6</span><h1>${l.title}</h1><p class="muted">${l.subtitle}</p><div class="explain"><b>Learn it!</b><p>${l.intro}</p><button class="secondary" onclick="toggleSwedish()">🇸🇪 Swedish explanation</button><div class="swedish" id="sv" hidden>${l.sv}</div></div><h2>Try it!</h2><p class="muted">Answer all questions, then check your work. You can try again if needed.</p>`;l.qs.forEach((q,i)=>{html+=`<div class="question"><strong>${i+1}. ${q[1]}</strong>`;if(q[0]==='choice')html+=`<div class="options">${q[2].map(a=>`<button class="option ${responses[i]===a?'selected':''}" onclick='choose(${i},${JSON.stringify(a)})'>${escapeHtml(a)}</button>`).join('')}</div>`;if(q[0]==='gap')html+=`<input type="text" autocomplete="off" aria-label="Answer question ${i+1}" value="${escapeHtml(responses[i]||'')}" oninput="typeAnswer(${i},this.value)" placeholder="Type your answer">`;if(q[0]==='match')html+=q[2].map((pair,j)=>`<div class="matchrow" style="margin:9px 0"><span style="min-width:65px">${pair[0]}</span><select onchange="match(${i},${j},this.value)"><option value="">Choose…</option>${[...new Set(q[2].map(p=>p[1]))].map(v=>`<option ${((responses[i]||{})[j]===v)?'selected':''}>${v}</option>`).join('')}</select></div>`).join('');if(checked){let ok=correct(q,responses[i]);html+=`<div class="feedback"><b class="${ok?'good':'bad'}">${ok?'✓ Correct!':'↻ Not quite yet.'}</b> ${ok?(q[0]==='match'?'All pairs match.':q[4]):(q[0]==='match'?'Look at each subject and try another match.':q[0]==='gap'?'Check the subject and the verb form.':'Read the explanation and try again.')}</div>`}html+='</div>'});let score=l.qs.filter((q,i)=>correct(q,responses[i])).length;let threshold=state.index===5?8:Math.ceil(l.qs.length*.8);html+=`<div class="footer"><span class="muted">${checked?`Your score: ${score}/${l.qs.length} · Need ${threshold}`:`Complete all ${l.qs.length} questions`}</span><button class="primary" onclick="check()">${checked&&score>=threshold?'Continue →':'Check answers'}</button></div>`;if(checked&&score<threshold)html+=`<p class="muted tiny">You can change your answers and check again. Use the Swedish explanation if you need help.</p>`;if(state.done.includes(5))html+='<p class="good"><b>🏆 Grammar Foundations completed!</b> Great work. You can revisit any lesson.</p>';document.getElementById('content').innerHTML=html}
function correct(q,a){if(q[0]==='match')return !!a&&q[2].every((p,j)=>a[j]===p[1]);return typeof a==='string'&&a.trim().toLowerCase().replace(/[’]/g,"'")===q[q[0]==='choice'?3:2].toLowerCase().replace(/[’]/g,"'")}function choose(i,v){responses[i]=v;checked=false;render()}function typeAnswer(i,v){responses[i]=v;checked=false}function match(i,j,v){responses[i]??={};responses[i][j]=v;checked=false}function toggleSwedish(){let el=document.getElementById('sv');el.hidden=!el.hidden}function go(i){if(i<=state.unlocked){state.index=i;responses={};checked=false;save();render();scrollTo(0,0)}}function check(){let l=lessons[state.index],score=l.qs.filter((q,i)=>correct(q,responses[i])).length,threshold=state.index===5?8:Math.ceil(l.qs.length*.8);if(checked&&score>=threshold){if(!state.done.includes(state.index))state.done.push(state.index);state.unlocked=Math.max(state.unlocked,Math.min(5,state.index+1));if(state.index<5)state.index++;responses={};checked=false;save();render();scrollTo(0,0);return}checked=true;if(score>=threshold){if(!state.done.includes(state.index))state.done.push(state.index);state.unlocked=Math.max(state.unlocked,Math.min(5,state.index+1));save()}render();scrollTo(0,0)}document.getElementById('reset').onclick=()=>{if(confirm('Reset all progress in this browser?')){state={unlocked:0,done:[],index:0};responses={};checked=false;save();render()}};render();</script><script>(function(){
const moduleKeys={"english_journey_module_2.html": "english_journey_writing_basics_v1", "english_journey_module_5.html": "english-journey-vocab-v1", "english_journey_module_7.html": "english-journey-module7-v1", "english_journey_module_11.html": "english_journey_module_11_progress_v1", "english_journey_module_8.html": "english-journey-module8-v1", "english_journey_module_9_fixed.html": "english_journey_module_9_progress_v1", "english_journey_module_12_fixed.html": "english_journey_module_12_progress_v1", "english_journey_module_1.html": "english-journey-foundations-v1", "english_journey_module_6.html": "english-journey-module6-v1", "english_journey_module_4.html": "englishJourney_grammarInAction_v1", "english_journey_module_10.html": "english_journey_module_10_progress_v1", "english_journey_module_3.html": "englishJourney_readingSkillsI_v1"};
const gameNames=['english_arcade_grammar_rush.html','english_arcade_reading_detective.html','english_arcade_sentence_scramble.html','english_arcade_word_match.html','english_arcade_story_paths.html'];
const gameTitles=['Grammar Rush','Reading Detective','Sentence Scramble','Word Match','Story Paths'];
const prefix='academy2.game.';
function getModule(file){try{let d=JSON.parse(localStorage.getItem(moduleKeys[file])||'{}');let a=d.done||d.completed||[];return Math.min(6,Array.isArray(a)?new Set(a).size:0)}catch(e){return 0}}
function gameCount(file){try{let v=localStorage.getItem('academy3.plays.'+file);return v===null?(localStorage.getItem(prefix+file)==='1'?1:0):Math.max(0,parseInt(v,10)||0)}catch(e){return 0}}
function gameDone(file){return gameCount(file)>0}
function celebration(title){let wrap=document.createElement('div');wrap.className='academy-celebration';wrap.innerHTML='<div class="academy-pop"><div style="font-size:52px">🏆 ✨ 🎉</div><h2>ACHIEVEMENT UNLOCKED!</h2><p></p><button type="button">Awesome! ✨</button></div>';wrap.querySelector('p').textContent='Well done! You have mastered '+title+'!';wrap.querySelector('button').onclick=()=>wrap.remove();document.body.append(wrap)}
function award(id,title){try{let k='academy2.achievement.'+id;if(!localStorage.getItem(k)){localStorage.setItem(k,'1');celebration(title)}}catch(e){}}
function checkAchievements(){let all=Object.keys(moduleKeys),grammar=all.filter(x=>/module_(1|4|8|11)\.html$/.test(x));if(grammar.every(x=>getModule(x)===6))award('grammar','all grammar modules');if(all.every(x=>getModule(x)===6))award('allmodules','all course modules');if(gameNames.every(gameDone))award('arcade','all arcade games');if(all.every(x=>getModule(x)===6)&&gameNames.every(gameDone))award('academy','English Academy')}
function markGame(file){try{let key='academy3.plays.'+file;localStorage.setItem(key,String(gameCount(file)+1))}catch(e){}checkAchievements()}
function renderHome(){document.querySelectorAll('a.card[href]').forEach(card=>{let file=card.getAttribute('href');let isModule=!!moduleKeys[file],isGame=gameNames.includes(file);if(!isModule&&!isGame)return;let n=isModule?getModule(file):gameCount(file);card.classList.toggle('academy-mastered',isModule&&n===6);let label=card.querySelector('.academy-status');if(!label){label=document.createElement('div');label.className='academy-status';card.insertBefore(label,card.querySelector('.go'))}if(isModule){label.innerHTML='<div class="academy-status-line"><span>'+(n===6?'✓ Mastered!':n+' / 6 lessons completed')+'</span><span>'+Math.round(n/6*100)+'%</span></div><div class="academy-track"><div style="width:'+Math.round(n/6*100)+'%"></div></div>'}else{label.innerHTML='<div class="academy-status-line"><span>🎮 '+n+' '+(n===1?'time':'times')+' played</span><span>'+(n?'Keep playing!':'Ready to play')+'</span></div>';}});let n=Object.keys(moduleKeys).reduce((a,x)=>a+getModule(x),0);let banner=document.getElementById('academy-overview');if(banner)banner.textContent='Your journey: '+n+' / 72 lessons completed · '+gameNames.reduce((a,x)=>a+gameCount(x),0)+' arcade rounds played';checkAchievements()}
window.Academy2={markGame,checkAchievements,renderHome};
if(document.body.querySelector('a.card[href]')){renderHome();window.addEventListener('pageshow',renderHome)}
else {let bar=document.createElement('div');bar.className='academy-back';bar.innerHTML='<a href="index.html">← Back to English Academy</a>';document.body.prepend(bar);let bottom=bar.cloneNode(true);bottom.className+=' academy-bottom';document.body.append(bottom);let file=location.pathname.split('/').pop();if(moduleKeys[file]){let old=getModule(file);setInterval(()=>{let now=getModule(file);if(now>old){old=now;if(now===6){award('module-'+file,document.title.replace(/\s*[|–-].*$/,'')||'this module');checkAchievements()}}},1300)}}
})();</script></body></html>
