position:relative;z-index:10;padding:12px 22px;background:#171027;color:#e9d5ff;font:700 14px system-ui}.academy-back a{color:#e9d5ff;text-decoration:none}.academy-back a:hover{text-decoration:underline}.academy-bottom{margin-top:32px}.academy-status{margin:12px 0 0;font:600 12px system-ui;color:#cbb5e5}.academy-status-line{display:flex;justify-content:space-between;gap:8px}.academy-track{height:7px;border-radius:9px;background:#4d3766;overflow:hidden;margin-top:8px}.academy-track>div{height:100%;background:#ae72ff;border-radius:9px}.academy-mastered{border-color:#22c55e!important;background:linear-gradient(140deg,#16452d,#10291e)!important}.academy-mastered .academy-status{color:#9cf4b4}.academy-mastered .academy-track>div{background:#22c55e}.academy-celebration{position:fixed;inset:0;z-index:99999;background:#080411c9;display:grid;place-items:center;padding:20px}.academy-pop{width:min(440px,100%);padding:38px 25px;text-align:center;border:2px solid #a78bfa;border-radius:24px;background:#25143d;color:#fff;box-shadow:0 0 90px #a855f755;font-family:system-ui}.academy-pop h2{font-size:25px;color:#e9c5ff}.academy-pop p{font-size:18px;line-height:1.5}.academy-pop button{border:0;border-radius:12px;background:#a78bfa;color:#160b2a;font-weight:800;padding:14px 22px;cursor:pointer}</style></head><body><header><div><div class="brand">✦ English Journey</div><div class="tag">Learn at your own pace</div></div><span class="pill">Module 2 · Writing Basics</span></header><main><aside><strong>Your learning path</strong><p class="muted tiny">Complete each lesson to unlock the next.</p><div class="bar"><div id="overall" class="fill"></div></div><div id="nav"></div><hr style="border:0;border-top:1px solid #edf0f6"><button class="secondary" id="reset">Reset progress</button><p class="tiny muted">Progress is saved in this browser only. Your writing stays on this device and is not saved.</p><p class="tiny muted">Module 1: <a href="english_journey_module_1.html">Grammar Foundations</a></p></aside><section class="panel" id="content"></section></main><script>
const lessons=[
{title:'Build a Sentence',sub:'Subject · verb · object',intro:'A clear English sentence usually needs a <b>subject</b> and a <b>verb</b>.<br><br><b>My brother</b> <b>plays</b> football. Add details to make your meaning clearer: My brother plays football <b>after school</b>.',sv:'En engelsk mening behöver oftast subjekt och verb. Ordföljden är vanligtvis subjekt + verb + resten.',tasks:[['order','Put the words in the correct order.',['every','reads','evening','Maya','.'], 'Maya reads every evening.'],['choice','Which is a complete sentence?',['Because I like music.','My friend likes music.','In the classroom.','When school finishes.'],'My friend likes music.','A complete sentence has a subject and a main verb.'],['gap','Complete the sentence: My friends ___ basketball after school.','play','The plural subject my friends takes play.'],['order','Build a sentence.',['on','We','Fridays','English','study','.'],'We study English on Fridays.'],['choice','Which sentence uses natural English word order?',['Always I walk home.','I walk always home.','I always walk home.','Walk I always home.'],'I always walk home.','Frequency adverbs like always normally go before the main verb.']]},
{title:'Capital Letters & Punctuation',sub:'Make writing easy to read',intro:'Start a sentence with a <b>capital letter</b>. Capitalise <b>I</b>, names, days and languages. End statements with a <b>full stop</b> and questions with a <b>question mark</b>.',sv:'Stor bokstav används i början av meningar, för namn, veckodagar, språk och alltid för I. Frågor avslutas med frågetecken.',tasks:[['choice','Choose the correctly written sentence.',['i study english on monday.','I study English on Monday.','I Study english on monday.','I study english on Monday'],'I study English on Monday.','I, English and Monday all need capitals.'],['gap','Type the missing punctuation: Where do you live___','?','Direct questions end with a question mark.'],['choice','Which sentence is punctuated correctly?',['My name is Sara?','Do you like music.','Do you like music?','do you like music?'],'Do you like music?','A question begins with a capital and ends with a question mark.'],['gap','Write the correct capitalised word: I speak ___ (english).','English','Languages begin with capital letters.'],['choice','Choose the correct sentence.',['We play football on tuesday.','we play football on Tuesday.','We play football on Tuesday.','We play football on Tuesday?'],'We play football on Tuesday.','Tuesday is capitalised and this is a statement.']]},
{title:'Connecting Ideas',sub:'and · but · because · so',intro:'Use <b>and</b> to add information, <b>but</b> to show a contrast, <b>because</b> to give a reason and <b>so</b> to show a result.<br><br>I stayed home <b>because</b> I was tired.',sv:'And lägger till, but visar motsats, because förklarar varför och so visar resultat.',tasks:[['choice','I love swimming, ___ I do not like cold water.',['and','but','because','so'],'but','But introduces a contrast.'],['gap','I went to bed early ___ I was tired.','because','Because introduces the reason.'],['match','Match the linking word to its purpose.',[['and','add information'],['but','show contrast'],['because','give a reason'],['so','show a result']]],['choice','It was raining, ___ we stayed inside.',['because','but','so','and'],'so','So introduces the result of the rain.'],['choice','Which sentence explains a reason?',['I ran and I jumped.','I ran because I was late.','I ran but I was tired.','I ran so I got warm.'],'I ran because I was late.','Because tells us why something happened.']]},
{title:'Write a Paragraph',sub:'Topic sentence · details · ending',intro:'A paragraph develops <b>one main idea</b>. Start with a topic sentence, add two or three supporting details, and finish with a suitable ending.<br><br><b>My favourite hobby is drawing.</b> I draw after school. I especially like creating comic characters. <b>Drawing helps me relax.</b>',sv:'Ett stycke har en huvudidé. Börja med en ämnesmening, utveckla med detaljer och avsluta tydligt.',tasks:[['choice','Which is the best topic sentence for a paragraph about a hobby?',['It is blue.','My favourite hobby is skateboarding.','Yesterday at four o’clock.','That is why I like it.'],'My favourite hobby is skateboarding.','It clearly introduces the main idea.'],['choice','Which detail best supports “I enjoy reading”?',['My shoes are new.','Books help me discover new worlds.','The bus arrives at eight.','My kitchen is small.'],'Books help me discover new worlds.','The detail develops the idea of enjoying reading.'],['order','Put these parts of a short paragraph in order.',['It helps me feel calm.','I enjoy playing the piano.','I practise for twenty minutes each day.'],'I enjoy playing the piano. I practise for twenty minutes each day. It helps me feel calm.'],['choice','What should most sentences in a paragraph do?',['Introduce a new unrelated topic.','Support the same main idea.','Repeat the first sentence exactly.','Avoid any examples.'],'Support the same main idea.','A focused paragraph develops one main idea.'],['gap','Complete: A paragraph should focus on one main ___.','idea','One main idea keeps a paragraph focused.']]},
{title:'Make Writing More Interesting',sub:'Details · variation · precise words',intro:'Improve simple writing by adding <b>where, when, how</b> or <b>why</b>. Choose specific words and vary sentence beginnings.<br><br>Basic: I went outside.<br>Better: <b>After dinner, I went outside to practise basketball with my friends.</b>',sv:'Utveckla meningar med detaljer om var, när, hur och varför. Variera meningsstarter och välj precisa ord.',tasks:[['choice','Which sentence gives the clearest detail?',['The film was good.','The film was really good.','The mystery film kept me guessing until the end.','It was a film.'],'The mystery film kept me guessing until the end.','Specific details show what made the film interesting.'],['choice','Which word is more precise than “nice” for describing a helpful friend?',['kind','thing','very','some'],'kind','Kind describes the friend’s behaviour more precisely.'],['gap','Choose the linking word: I enjoy English ___ I like learning new expressions.','because','Because introduces the reason.'],['choice','Which opening creates more sentence variety after “I played football.”?',['I was happy.','I went home.','After the match, we celebrated.','I liked it.'],'After the match, we celebrated.','A time phrase varies the sentence opening.'],['choice','Which revision explains why someone felt nervous?',['I was nervous.','I was very nervous.','I was nervous because it was my first performance.','Nervous was I.'],'I was nervous because it was my first performance.','The reason makes the feeling more meaningful.']]},
{title:'Writing Challenge',sub:'Review and practise',intro:'Use everything you have learned: complete sentences, capitals, punctuation, linking words and clear paragraphs. You need <b>at least 80%</b> on the checked questions to complete the module.',sv:'Sluttest med automatiskt rättade frågor och en frivillig skrivutmaning med checklista. Skrivuppgiften bedöms inte automatiskt.',tasks:[['choice','Choose the correct sentence.',['she play games every day.','She plays games every day.','She play games every day?','she plays Games every day.'],'She plays games every day.','The subject she needs plays, and sentences need capitals and punctuation.'],['gap','I stayed inside ___ it was snowing.','because','Because gives a reason.'],['choice','Which is the strongest topic sentence?',['My favourite place is the library.','Because it is quiet.','There are chairs.','I also like books.'],'My favourite place is the library.','It clearly introduces the paragraph topic.'],['choice','Which sentence has the correct punctuation?',['Where is my bag.','Where is my bag?','where is my bag?','Where is my bag!'],'Where is my bag?','Direct questions need a question mark and an initial capital.'],['order','Build a sentence.',['every','reads','My','night','sister','.'],'My sister reads every night.'],['choice','Which sentence shows a contrast?',['I like tea and coffee.','I like tea because it is warm.','I like tea, but my brother prefers coffee.','I like tea, so I make some.'],'I like tea, but my brother prefers coffee.','But contrasts two preferences.'],['choice','Which detail best develops “I love cycling”?',['My bike has bright yellow wheels.','My friend likes pasta.','The lesson starts at nine.','Yesterday was Monday.'],'My bike has bright yellow wheels.','It adds a relevant specific detail.'],['gap','Write the capitalised language name: She studies ___ (spanish).','Spanish','Languages begin with capital letters.'],['choice','Which sentence uses correct word order?',['Usually we eat at six.','We at six usually eat.','Eat we usually at six.','We eat at usually six.'],'Usually we eat at six.','A frequency adverb can begin a sentence before the subject.'],['choice','Which sentence best explains a result?',['It was late, so we went home.','It was late because we went home.','It was late but we went home.','It was late and blue.'],'It was late, so we went home.','So shows a result.']]}];
const KEY='english_journey_writing_basics_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let done=Array.isArray(saved.done)?saved.done:[];let current=0;let responses={};let evaluated=false;let lastScore=0;const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(KEY,JSON.stringify({done}))}catch(e){}}function nav(){const first=lessons.findIndex((_,i)=>!done.includes(i));const max=first<0?lessons.length-1:first;$('nav').innerHTML=lessons.map((l,i)=>`<button class="lesson ${i===current?'active':''} ${done.includes(i)?'done':''}" ${i>max?'disabled':''} data-nav="${i}">${i+1}. ${escapeHTML(l.title)} ${i>max?'🔒':''}<br><span class="tiny muted">${escapeHTML(l.sub)}</span></button>`).join('');$('overall').style.width=(done.length/lessons.length*100)+'%';document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>openLesson(+b.dataset.nav));}
function openLesson(i){current=i;responses={};evaluated=false;render();window.scrollTo({top:0,behavior:'smooth'});}function render(){nav();let l=lessons[current];$('content').innerHTML=`<div class="steps"><span class="step">Module 2</span><span class="step">Lesson ${current+1} of ${lessons.length}</span>${done.includes(current)?'<span class="step done">Completed ✓</span>':''}</div><h1>${escapeHTML(l.title)}</h1><p class="muted">${escapeHTML(l.sub)}</p><div class="explain"><b>Learn it!</b><p>${l.intro}</p><button class="secondary" id="svBtn">Visa svensk förklaring</button><div class="swedish" id="svText" hidden>${escapeHTML(l.sv)}</div></div><h2>Practise it!</h2><p class="muted">Answer all questions, then check your work. You can try again if needed.</p><div id="tasks"></div><div id="results"></div><div class="footer"><button class="secondary" id="prev" ${current===0?'disabled':''}>← Previous lesson</button><button class="primary" id="check">Check my answers</button></div><div id="writing"></div>`;$('svBtn').onclick=()=>{$('svText').hidden=!$('svText').hidden};$('prev').onclick=()=>openLesson(current-1);$('check').onclick=check;renderTasks();}
function renderTasks(){let html='';lessons[current].tasks.forEach((t,i)=>{html+=`<div class="task"><h3>${i+1}. ${t[0]==='order'?'Build the sentence':t[0]==='match'?'Match the pairs':t[0]==='gap'?'Fill in the gap':'Choose the best answer'}</h3>`;if(t[0]==='choice'){html+=`<p>${escapeHTML(t[1])}</p><div class="options">${t[2].map((a,j)=>`<button class="option ${responses[i]===a?'selected':''}" data-q="${i}" data-choice="${j}">${escapeHTML(a)}</button>`).join('')}</div>`}else if(t[0]==='gap'){html+=`<p>${escapeHTML(t[1])}</p><input type="text" data-gap="${i}" autocomplete="off" placeholder="Type your answer" value="${escapeHTML(responses[i]||'')}">`}else if(t[0]==='order'){html+=`<p class="note">Tap the words in the correct order. Tap a word in your answer to remove it.</p><div class="wordbank">${t[2].map((w,j)=>`<button data-word="${i}:${j}" ${((responses[i]||[]).includes(j))?'disabled':''}>${escapeHTML(w)}</button>`).join('')}</div><div class="response" id="order${i}">${escapeHTML((responses[i]||[]).map(j=>t[2][j]).join(' '))||'Your sentence appears here'}</div><button class="secondary" data-clear="${i}">Clear</button>`}else if(t[0]==='match'){html+=t[2].map(([a,b],j)=>`<div class="matchrow"><b>${escapeHTML(a)}</b><select data-match="${i}:${j}"><option value="">Choose...</option>${[...new Set(t[2].map(p=>p[1]))].sort().map(opt=>`<option ${responses[i]?.[j]===opt?'selected':''}>${escapeHTML(opt)}</option>`).join('')}</select></div>`).join('')}html+='</div>'});$('tasks').innerHTML=html;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{responses[+b.dataset.q]=lessons[current].tasks[+b.dataset.q][2][+b.dataset.choice];renderTasks()});document.querySelectorAll('[data-gap]').forEach(b=>b.oninput=()=>responses[+b.dataset.gap]=b.value);document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.word.split(':').map(Number);responses[i]=[...(responses[i]||[]),j];renderTasks()});document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{responses[+b.dataset.clear]=[];renderTasks()});document.querySelectorAll('[data-match]').forEach(b=>b.onchange=()=>{let [i,j]=b.dataset.match.split(':').map(Number);if(!responses[i])responses[i]={};responses[i][j]=b.value});}
function normalize(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/\s+([.,?!])/g,'$1')};function check(){let tasks=lessons[current].tasks;let missing=tasks.some((t,i)=>t[0]==='order'?(!responses[i]||responses[i].length!==t[2].length):t[0]==='match'?t[2].some((p,j)=>!responses[i]?.[j]):!String(responses[i]||'').trim());if(missing){$('results').innerHTML='<div class="notice">Please answer every question before checking.</div>';return;}let correct=0;let feedback=tasks.map((t,i)=>{let r=responses[i],ok=t[0]==='match'?t[2].every((p,j)=>r[j]===p[1]):t[0]==='order'?normalize(r.map(j=>t[2][j]).join(' '))===normalize(t[3]):normalize(r)===normalize(t[t[0]==='choice'?3:2]);if(ok)correct++;let why=t[0]==='match'?'Check how each item connects to its meaning.':t[0]==='order'?'Suggested order: '+t[3]:t[t[0]==='choice'?4:3];return `<div class="feedback"><b class="${ok?'good':'bad'}">Question ${i+1}: ${ok?'Correct ✓':'Try again'}</b><br>${escapeHTML(why)}</div>`}).join('');lastScore=Math.round(correct/tasks.length*100);let passed=lastScore>=80;if(passed&&!done.includes(current)){done.push(current);persist();nav();}evaluated=true;$('results').innerHTML=`<div class="explain"><div class="score">${lastScore}%</div><b>${passed?'Great work! Lesson completed.':'Keep practising! You need 80% to continue.'}</b><p>${correct} of ${tasks.length} questions correct.</p>${feedback}</div><button class="secondary smallbtn" id="retry">Try again</button>${passed&&current<lessons.length-1?'<button class="primary smallbtn" id="next">Next lesson →</button>':''}${passed&&current===lessons.length-1?'<p class="good"><b>Congratulations! You have completed Writing Basics.</b></p>':''}`;$('retry').onclick=()=>{responses={};evaluated=false;render()};if($('next'))$('next').onclick=()=>openLesson(current+1);if(passed)showWriting();$('results').scrollIntoView({behavior:'smooth',block:'start'});}
function showWriting(){let isFinal=current===5;let prompts=['Write three sentences about your daily routine. Include when you do something.','Write two sentences about your favourite subject. Check capitals and punctuation.','Write three sentences using because, but and so.','Write a short paragraph (4–5 sentences) about a hobby.','Improve this basic idea with specific details: “I had a good weekend.”','Write a short paragraph (5–7 sentences) about a place you enjoy. Explain why you like it.'];$('writing').innerHTML=`<div class="explain"><h2>Write & Improve ${isFinal?'· Final writing challenge':''}</h2><p>${escapeHTML(prompts[current])}</p><p class="note">This is self-check practice, not automatic AI marking. Your text is not saved or uploaded.</p><textarea id="draft" placeholder="Write your own sentences here..."></textarea><p><b>Check your writing:</b></p>${['I used complete sentences.','I checked capitals and punctuation.','My ideas are clear and connected.','I included useful details.'].map((x,i)=>`<label class="checkline"><input type="checkbox" class="selfcheck">${x}</label>`).join('')}<button class="secondary" id="review">Review my checklist</button><div id="reviewResult" class="feedback" hidden></div></div>`;$('review').onclick=()=>{let text=$('draft').value.trim(),checked=[...document.querySelectorAll('.selfcheck')].filter(x=>x.checked).length;let count=text?text.split(/\s+/).length:0;$('reviewResult').hidden=false;$('reviewResult').textContent=!text?'Write something first.':`You wrote approximately ${count} words and checked ${checked} of 4 items. Read your paragraph aloud and revise anything that sounds unclear. This is a checklist, not a grammar assessment.`};}
$('reset').onclick=()=>{if(confirm('Reset all Writing Basics progress on this device?')){done=[];persist();openLesson(0)}};const first=lessons.findIndex((_,i)=>!done.includes(i));openLesson(first<0?lessons.length-1:first);
</script><script>(function(){

function gameCount(file){try{let v=localStorage.getItem('academy3.plays.'+file);return v===null?(localStorage.getItem(prefix+file)==='1'?1:0):Math.max(0,parseInt(v,10)||0)}catch(e){return 0}}
function gameDone(file){return gameCount(file)>0}
function celebration(title){let wrap=document.createElement('div');wrap.className='academy-celebration';wrap.innerHTML='<div class="academy-pop"><div style="font-size:52px">🏆 ✨ 🎉</div><h2>ACHIEVEMENT UNLOCKED!</h2><p></p><button type="button">Awesome! ✨</button></div>';wrap.querySelector('p').textContent='Well done! You have mastered '+title+'!';wrap.querySelector('button').onclick=()=>wrap.remove();document.body.append(wrap)}
function award(id,title){try{let k='academy2.achievement.'+id;if(!localStorage.getItem(k)){localStorage.setItem(k,'1');celebration(title)}}catch(e){}}
function checkAchievements(){let all=Object.keys(moduleKeys),grammar=all.filter(x=>/module_(1|4|8|11)\.html$/.test(x));if(grammar.every(x=>getModule(x)===6))award('grammar','all grammar modules');if(all.every(x=>getModule(x)===6))award('allmodules','all course modules');if(gameNames.every(gameDone))award('arcade','all arcade games');if(all.every(x=>getModule(x)===6)&&gameNames.every(gameDone))award('academy','English Academy')}
function markGame(file){try{let key='academy3.plays.'+file;localStorage.setItem(key,String(gameCount(file)+1))}catch(e){}checkAchievements()}
function renderHome(){document.querySelectorAll('a.card[href]').forEach(card=>{let file=card.getAttribute('href');let isModule=!!moduleKeys[file],isGame=gameNames.includes(file);if(!isModule&&!isGame)return;let n=isModule?getModule(file):gameCount(file);card.classList.toggle('academy-mastered',isModule&&n===6);let label=card.querySelector('.academy-status');if(!label){label=document.createElement('div');label.className='academy-status';card.insertBefore(label,card.querySelector('.go'))}if(isModule){label.innerHTML='<div class="academy-status-line"><span>'+(n===6?'✓ Mastered!':n+' / 6 lessons completed')+'</span><span>'+Math.round(n/6*100)+'%</span></div><div class="academy-track"><div style="width:'+Math.round(n/6*100)+'%"></div></div>'}else{label.innerHTML='<div class="academy-status-line"><span>🎮 '+n+' '+(n===1?'time':'times')+' played</span><span>'+(n?'Keep playing!':'Ready to play')+'</span></div>';}});let n=Object.keys(moduleKeys).reduce((a,x)=>a+getModule(x),0);let banner=document.getElementById('academy-overview');if(banner)banner.textContent='Your journey: '+n+' / 72 lessons completed · '+gameNames.reduce((a,x)=>a+gameCount(x),0)+' arcade rounds played';checkAchievements()}
window.Academy2={markGame,checkAchievements,renderHome};
if(document.body.querySelector('a.card[href]')){renderHome();window.addEventListener('pageshow',renderHome)}
else {let bar=document.createElement('div');bar.className='academy-back';bar.innerHTML='<a href="index.html">← Back to English Academy</a>';document.body.prepend(bar);let bottom=bar.cloneNode(true);bottom.className+=' academy-bottom';document.body.append(bottom);let file=location.pathname.split('/').pop();if(moduleKeys[file]){let old=getModule(file);setInterval(()=>{let now=getModule(file);if(now>old){old=now;if(now===6){award('module-'+file,document.title.replace(/\s*[|–-].*$/,'')||'this module');checkAchievements()}}},1300)}}
})();</script></body></html>
