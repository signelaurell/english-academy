<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Journey · Reading Skills II</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;color:#23304c;background:#f5f6fc}.top{background:linear-gradient(120deg,#30345d,#6651a8);color:white;padding:24px max(20px,calc((100vw - 1000px)/2))}.top h1{margin:5px 0;font-size:29px}.top small{opacity:.85}main{max-width:1000px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:260px 1fr;gap:20px}.panel{background:white;border:1px solid #e1e4f0;border-radius:17px;padding:23px;box-shadow:0 4px 15px #28315d0b}.nav button{display:block;width:100%;text-align:left;margin:9px 0;padding:13px;border:1px solid #e0e4ef;background:#fafbff;border-radius:11px;color:#293557;cursor:pointer}.nav button.active{background:#eee9ff;border-color:#a99ae8}.nav button:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-block;background:#e9e4fb;color:#5c4498;border-radius:20px;padding:5px 11px;font-size:12px;font-weight:700}.progress{height:9px;background:#e9eaf2;border-radius:9px;overflow:hidden;margin:13px 0}.progress>div{height:100%;background:#7461c8}.lesson h2{font-size:27px;margin:10px 0}.intro{color:#65718a}.learn{background:#f3f0ff;border-left:4px solid #8c75d6;border-radius:10px;padding:17px;margin:20px 0;line-height:1.65}.passage{background:#fafbff;border:1px solid #e2e4f0;border-radius:11px;padding:20px;line-height:1.85;font-size:16px}.task{border-top:1px solid #e7e8f0;padding:19px 0}.task p{font-weight:600}.options{display:grid;gap:9px}.options button{border:1px solid #dfe2ee;background:white;padding:12px;text-align:left;border-radius:9px;cursor:pointer;color:#263252;font-size:15px}.options button.selected{border-color:#7561c6;background:#eeeaff}.options button.good{background:#e5f6eb;border-color:#62ae7b}.options button.bad{background:#fff0ed;border-color:#d38a80}.feedback{margin-top:9px;color:#4c5870;font-size:14px}.primary,.secondary{border:0;background:#6754b3;color:white;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}.secondary{background:#eee9ff;color:#574298}.primary:disabled{opacity:.5;cursor:not-allowed}.sw{margin-top:8px}.score{background:#f1f9f4;padding:15px;border-radius:10px;margin:15px 0}.footer{font-size:12px;color:#7b8599;margin-top:25px}button:focus-visible{outline:3px solid #a28ce7}@media(max-width:740px){main{grid-template-columns:1fr}.top{padding:20px}.panel{padding:18px}}</style><style id="academy2-css">.academy-back{position:relative;z-index:10;padding:12px 22px;background:#171027;color:#e9d5ff;font:700 14px system-ui}.academy-back a{color:#e9d5ff;text-decoration:none}.academy-back a:hover{text-decoration:underline}.academy-bottom{margin-top:32px}.academy-status{margin:12px 0 0;font:600 12px system-ui;color:#cbb5e5}.academy-status-line{display:flex;justify-content:space-between;gap:8px}.academy-track{height:7px;border-radius:9px;background:#4d3766;overflow:hidden;margin-top:8px}.academy-track>div{height:100%;background:#ae72ff;border-radius:9px}.academy-mastered{border-color:#22c55e!important;background:linear-gradient(140deg,#16452d,#10291e)!important}.academy-mastered .academy-status{color:#9cf4b4}.academy-mastered .academy-track>div{background:#22c55e}.academy-celebration{position:fixed;inset:0;z-index:99999;background:#080411c9;display:grid;place-items:center;padding:20px}.academy-pop{width:min(440px,100%);padding:38px 25px;text-align:center;border:2px solid #a78bfa;border-radius:24px;background:#25143d;color:#fff;box-shadow:0 0 90px #a855f755;font-family:system-ui}.academy-pop h2{font-size:25px;color:#e9c5ff}.academy-pop p{font-size:18px;line-height:1.5}.academy-pop button{border:0;border-radius:12px;background:#a78bfa;color:#160b2a;font-weight:800;padding:14px 22px;cursor:pointer}</style></head><body><header class="top"><small>ENGLISH JOURNEY · MODULE 7</small><h1>Reading Skills II</h1><div>Read closely. Find clues. Think deeper.</div></header><main><aside class="panel"><b>Your learning path</b><div class="progress"><div id="bar"></div></div><small id="progressLabel"></small><nav class="nav" id="nav"></nav><button class="secondary" id="reset">Reset my progress</button></aside><section class="panel lesson" id="content"></section></main><script>const LESSONS=[{"title": "Understanding the Main Idea", "goal": "Find the central message rather than focusing on one detail.", "sw": "Huvudbudskapet är det viktigaste texten vill berätta. Fråga dig: Vad handlar hela texten om?", "passage": "At Greenhill School, students wanted a quieter place to spend their breaks. The playground was often crowded, and the library was closed at lunchtime. A group of students suggested turning an unused classroom into a reading room. They collected old chairs, painted the walls and asked families to donate books. After three weeks, the room opened. Some students came to read, while others simply enjoyed a calm place to sit. The headteacher said the project showed what students could achieve when they worked together.", "questions": [{"question": "What is the text mainly about?", "options": ["Why libraries should close", "Students creating a peaceful space", "A school buying new classrooms", "How to paint a wall"], "correct": "Students creating a peaceful space", "feedback": "The whole passage follows the students’ idea and what they created.", "evidence": "A group of students suggested turning an unused classroom into a reading room."}, {"question": "Why did students want a new space?", "options": ["Breaks were too quiet", "The playground was crowded", "They needed more sports equipment", "They disliked reading"], "correct": "The playground was crowded", "feedback": "The crowded playground created a need for a calmer option.", "evidence": "The playground was often crowded, and the library was closed at lunchtime."}, {"question": "Which title best fits the whole text?", "options": ["A Room for Everyone", "The Lost Library Book", "A Difficult Exam", "The Last Football Match"], "correct": "A Room for Everyone", "feedback": "The room welcomes students who read and students who simply want quiet.", "evidence": "Some students came to read, while others simply enjoyed a calm place to sit."}, {"question": "Which detail supports the main idea?", "options": ["Students worked together to prepare the room", "The school changed its timetable", "Teachers cancelled all breaks", "The playground was rebuilt"], "correct": "Students worked together to prepare the room", "feedback": "Their teamwork helped turn the idea into a real place.", "evidence": "They collected old chairs, painted the walls and asked families to donate books."}, {"question": "What does the headteacher admire?", "options": ["The cost of the chairs", "The students’ cooperation", "The size of the playground", "The number of teachers"], "correct": "The students’ cooperation", "feedback": "The headteacher praises what students can achieve together.", "evidence": "The headteacher said the project showed what students could achieve when they worked together."}, {"question": "Which summary is most accurate?", "options": ["A teacher opens a sports club", "Students improve school life by creating a quiet room", "Families replace the school library", "A classroom is closed because of noise"], "correct": "Students improve school life by creating a quiet room", "feedback": "A good summary includes the problem, solution and outcome.", "evidence": "A group of students suggested turning an unused classroom into a reading room."}]}, {"title": "Making Inferences", "goal": "Use clues to understand what the writer does not say directly.", "sw": "Att dra slutsatser innebär att kombinera ledtrådar i texten med logiskt tänkande.", "passage": "Maya checked the clock for the fourth time. Her train was due in five minutes, but the platform was almost empty. She pulled her jacket tighter and read the message from her brother again: “Don’t worry. I’ll wait outside the station.” A loud announcement said the train would be delayed. Maya sighed, typed “Sorry, running late” and put her phone away. When the train finally arrived, she hurried to the door before it had fully stopped.", "questions": [{"question": "How is Maya probably feeling at the beginning?", "options": ["Relaxed", "Impatient", "Proud", "Amused"], "correct": "Impatient", "feedback": "Repeatedly checking the clock suggests she is waiting anxiously.", "evidence": "Maya checked the clock for the fourth time."}, {"question": "Why does Maya message her brother?", "options": ["She has lost her ticket", "She expects to arrive later than planned", "She wants him to buy a jacket", "She has decided not to travel"], "correct": "She expects to arrive later than planned", "feedback": "She sends the message immediately after the delay is announced.", "evidence": "A loud announcement said the train would be delayed. Maya sighed, typed “Sorry, running late”"}, {"question": "What can we infer about the weather?", "options": ["It is probably chilly", "It is extremely hot", "It is raining heavily", "It is snowing"], "correct": "It is probably chilly", "feedback": "Pulling her jacket tighter suggests she feels cold; the text does not mention rain or snow.", "evidence": "She pulled her jacket tighter"}, {"question": "What does her brother’s message suggest?", "options": ["He is angry with her", "He plans to wait for her", "He has missed the train", "He is at her school"], "correct": "He plans to wait for her", "feedback": "He reassures her that he will wait outside the station.", "evidence": "“Don’t worry. I’ll wait outside the station.”"}, {"question": "Why does Maya hurry when the train arrives?", "options": ["She is eager to get moving", "She is trying to avoid her brother", "She wants to meet the driver", "She has forgotten her phone"], "correct": "She is eager to get moving", "feedback": "Her repeated clock-checking and late message suggest she wants to arrive quickly.", "evidence": "Maya checked the clock for the fourth time."}, {"question": "Which statement is an inference rather than a directly stated fact?", "options": ["The train is delayed", "Maya sends a message", "Maya is worried about being late", "Her brother will wait outside"], "correct": "Maya is worried about being late", "feedback": "Her worry is suggested by her actions but never directly named.", "evidence": "Maya checked the clock for the fourth time."}]}, {"title": "Words in Context", "goal": "Work out unfamiliar vocabulary from nearby clues.", "sw": "Läs meningen före och efter ett svårt ord. Ledtrådarna hjälper dig förstå betydelsen.", "passage": "The first day at the animal shelter was chaotic. Dogs barked, volunteers carried food bowls and the telephone rang constantly. Leo felt overwhelmed, so the manager gave him one simple job: prepare clean blankets. Soon, he found a routine and began to feel more confident. By the afternoon, the shelter was calmer. Leo was exhausted but delighted when a shy dog finally approached him and wagged its tail.", "questions": [{"question": "What does “chaotic” most likely mean?", "options": ["Very organised", "Confusing and busy", "Completely silent", "Dangerously cold"], "correct": "Confusing and busy", "feedback": "Barking, moving volunteers and a ringing phone show a busy, confusing scene.", "evidence": "Dogs barked, volunteers carried food bowls and the telephone rang constantly."}, {"question": "What does “overwhelmed” suggest about Leo?", "options": ["He feels there is too much happening", "He has finished every task", "He is bored by the silence", "He wants to lead the team"], "correct": "He feels there is too much happening", "feedback": "The manager responds by giving him just one simple task.", "evidence": "Leo felt overwhelmed, so the manager gave him one simple job"}, {"question": "What does “routine” mean here?", "options": ["A regular way of doing tasks", "A special kind of animal", "A long journey", "A loud announcement"], "correct": "A regular way of doing tasks", "feedback": "Finding a routine helps Leo manage the work more confidently.", "evidence": "Soon, he found a routine and began to feel more confident."}, {"question": "Which word is closest to “exhausted”?", "options": ["Curious", "Very tired", "Embarrassed", "Surprised"], "correct": "Very tired", "feedback": "After a busy day, exhausted describes having very little energy.", "evidence": "Leo was exhausted but delighted"}, {"question": "What does “delighted” mean?", "options": ["Very pleased", "Quite nervous", "Extremely hungry", "Slightly confused"], "correct": "Very pleased", "feedback": "The shy dog approaching is a happy moment for Leo.", "evidence": "a shy dog finally approached him and wagged its tail."}, {"question": "Which clue shows that the shelter became less busy?", "options": ["The telephone rang constantly", "The shelter was calmer", "Volunteers carried food bowls", "Dogs barked"], "correct": "The shelter was calmer", "feedback": "Calmer directly contrasts with the chaotic beginning.", "evidence": "By the afternoon, the shelter was calmer."}]}, {"title": "Fact or Opinion?", "goal": "Separate checkable information from personal judgements.", "sw": "Fakta kan kontrolleras. Åsikter uttrycker vad någon tycker eller värderar.", "passage": "The town council opened a new skate park on Saturday. The park has two ramps, a small practice area and benches for visitors. About 150 people attended the opening event, according to the council. “It is the best place in town,” said fourteen-year-old Amir. His friend Ella disagreed: “The old park is more exciting.” Both friends agreed that the new benches made it easier to watch other skaters.", "questions": [{"question": "Which statement is a fact reported in the text?", "options": ["The park is the best in town", "The old park is more exciting", "The new park has two ramps", "All skaters love the benches"], "correct": "The new park has two ramps", "feedback": "The number of ramps is a checkable detail given by the text.", "evidence": "The park has two ramps"}, {"question": "Which statement is an opinion?", "options": ["The park opened on Saturday", "The park has benches", "Amir says it is the best place in town", "The council reported attendance"], "correct": "Amir says it is the best place in town", "feedback": "“Best” expresses Amir’s personal judgement.", "evidence": "“It is the best place in town,” said fourteen-year-old Amir."}, {"question": "Who prefers the old park?", "options": ["Amir", "Ella", "The council", "The visitors"], "correct": "Ella", "feedback": "Ella calls the old park more exciting.", "evidence": "His friend Ella disagreed: “The old park is more exciting.”"}, {"question": "Which detail is attributed to a source?", "options": ["The park is exciting", "About 150 people attended", "The benches are beautiful", "The new ramps are difficult"], "correct": "About 150 people attended", "feedback": "The attendance figure is specifically attributed to the council.", "evidence": "About 150 people attended the opening event, according to the council."}, {"question": "Why can Amir and Ella disagree without either being wrong about their preference?", "options": ["They visited different towns", "Exciting and best are subjective judgements", "The park has no ramps", "The council changed its report"], "correct": "Exciting and best are subjective judgements", "feedback": "Preferences are personal rather than objectively true or false.", "evidence": "“It is the best place in town,” said fourteen-year-old Amir. His friend Ella disagreed"}, {"question": "Which statement is NOT supported by the text?", "options": ["The park opened on Saturday", "The new park includes benches", "Every visitor enjoyed the event", "Ella prefers the old park"], "correct": "Every visitor enjoyed the event", "feedback": "The text does not tell us how every visitor felt.", "evidence": "About 150 people attended the opening event, according to the council."}]}, {"title": "Reading Between the Lines", "goal": "Notice feelings, intentions and different perspectives.", "sw": "Titta på vad personerna säger och gör. Deras känslor kan visas utan att nämnas direkt.", "passage": "When Noah saw his painting on the classroom wall, he stopped walking. He had nearly thrown it away the night before because he thought the colours looked strange. “I like how you used the light,” said his classmate Iris. Noah looked down and smiled. Later, he noticed that someone had left a small note beside the painting: “This made me think of summer evenings.” He folded the note carefully and put it in his pocket.", "questions": [{"question": "Why is Noah surprised to see the painting displayed?", "options": ["He thought it was not good enough", "He forgot the classroom existed", "He had sold it", "He wanted to paint a different wall"], "correct": "He thought it was not good enough", "feedback": "He almost threw it away because he disliked the colours.", "evidence": "He had nearly thrown it away the night before because he thought the colours looked strange."}, {"question": "How does Iris probably affect Noah?", "options": ["She makes him feel encouraged", "She makes him angry", "She tells him to start again", "She makes him forget his painting"], "correct": "She makes him feel encouraged", "feedback": "Her positive comment is followed by his smile.", "evidence": "“I like how you used the light,” said his classmate Iris. Noah looked down and smiled."}, {"question": "Why does Noah keep the note?", "options": ["It contains homework", "It means something to him", "It has a phone number", "It tells him to remove the painting"], "correct": "It means something to him", "feedback": "Folding it carefully and keeping it suggests he values the compliment.", "evidence": "He folded the note carefully and put it in his pocket."}, {"question": "What theme best fits the text?", "options": ["The value of encouragement", "The dangers of painting", "The importance of winning", "The difficulty of travelling"], "correct": "The value of encouragement", "feedback": "Others’ positive reactions change how Noah feels about his work.", "evidence": "“I like how you used the light,” said his classmate Iris."}, {"question": "Which action most strongly suggests that Noah values the note?", "options": ["He stops walking", "He looks down", "He folds it carefully and keeps it", "He paints with strange colours"], "correct": "He folds it carefully and keeps it", "feedback": "His careful treatment of the note signals its importance.", "evidence": "He folded the note carefully and put it in his pocket."}, {"question": "Which description best captures Noah’s change?", "options": ["Confident to bored", "Uncertain to encouraged", "Angry to frightened", "Excited to disappointed"], "correct": "Uncertain to encouraged", "feedback": "He begins doubting his painting and ends keeping a positive message.", "evidence": "He had nearly thrown it away the night before"}]}, {"title": "Reading Challenge", "goal": "Combine all five strategies in one new text.", "sw": "Använd alla strategier: huvudbudskap, detaljer, ord i sammanhang, fakta/åsikt och slutsatser.", "passage": "Every Friday, a small group of students meets behind the sports hall to repair bicycles. The project began when Aisha noticed several broken bikes outside the school. Instead of asking for new ones, she suggested a repair club. At first, only three people joined. Now twelve students attend regularly, and a local mechanic sometimes visits to offer advice. Last week, the group fixed a bicycle for a younger student who had been walking forty minutes to school. “This is the most useful club we have,” said Aisha. When the younger student rode away, the volunteers exchanged quiet smiles. They had spent two afternoons on the repair, but none of them mentioned the time.", "questions": [{"question": "What is the main idea of the text?", "options": ["A school bans bicycles", "Students help others by repairing bikes", "A mechanic opens a shop", "Students train for a race"], "correct": "Students help others by repairing bikes", "feedback": "The text explains how a student-led repair club helps others.", "evidence": "she suggested a repair club."}, {"question": "How many students now attend regularly?", "options": ["Three", "Eight", "Twelve", "Forty"], "correct": "Twelve", "feedback": "The text explicitly says twelve students attend regularly.", "evidence": "Now twelve students attend regularly"}, {"question": "What does “regularly” most nearly mean here?", "options": ["Only once", "Often and repeatedly", "Very loudly", "Without permission"], "correct": "Often and repeatedly", "feedback": "The club meets every Friday, so regularly means on a repeated basis.", "evidence": "Every Friday, a small group of students meets"}, {"question": "Which statement is an opinion?", "options": ["The group meets on Fridays", "A local mechanic sometimes visits", "The club is the most useful one", "A younger student received a repaired bike"], "correct": "The club is the most useful one", "feedback": "“Most useful” is Aisha’s personal evaluation.", "evidence": "“This is the most useful club we have,” said Aisha."}, {"question": "What do the volunteers’ quiet smiles suggest?", "options": ["They are pleased they helped", "They are annoyed with the student", "They want to close the club", "They have forgotten the repair"], "correct": "They are pleased they helped", "feedback": "Their smiles after the student rides away suggest satisfaction.", "evidence": "When the younger student rode away, the volunteers exchanged quiet smiles."}, {"question": "Why is the detail about the forty-minute walk important?", "options": ["It explains why the repaired bike matters", "It describes the mechanic’s journey", "It tells us the club opens at forty minutes past", "It proves the school has no buses"], "correct": "It explains why the repaired bike matters", "feedback": "The long walk shows how useful the repaired bike could be.", "evidence": "a younger student who had been walking forty minutes to school."}]}];const KEY='english-journey-module7-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{unlocked:0,completed:[]}}catch(e){state={unlocked:0,completed:[]}}state.unlocked=Math.max(0,Math.min(5,state.unlocked||0));state.completed=Array.isArray(state.completed)?state.completed:[];let current=0,answers={},showSw=false,showEvidence={};const $=s=>document.querySelector(s);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}function render(){const nav=$('#nav');nav.replaceChildren();LESSONS.forEach((l,i)=>{const b=el('button',i===current?'active':'',`${state.completed.includes(i)?'✓':i>state.unlocked?'🔒':'○'}  ${i+1}. ${l.title}`);b.disabled=i>state.unlocked;b.onclick=()=>{current=i;answers={};showEvidence={};showSw=false;render()};nav.append(b)});$('#bar').style.width=(state.completed.length/6*100)+'%';$('#progressLabel').textContent=`${state.completed.length} of 6 lessons completed`;const l=LESSONS[current],c=$('#content');c.replaceChildren();c.append(el('span','pill',`LESSON ${current+1} OF 6`),el('h2','',l.title),el('p','intro',l.goal));const box=el('div','learn');box.append(el('b','', 'LEARN IT!'),el('p','',l.goal+' Read the text carefully. Look for clues and check the passage when you are unsure.'));const sw=el('button','secondary sw',showSw?'Hide Swedish support':'Visa svensk förklaring');sw.onclick=()=>{showSw=!showSw;render()};box.append(sw);if(showSw)box.append(el('p','',l.sw));c.append(box,el('h3','','READ IT!'),el('div','passage',l.passage),el('h3','','TRY IT!'));l.questions.forEach((q,i)=>{const task=el('div','task');task.append(el('p','',`${i+1}. ${q.question}`));const opts=el('div','options');q.options.forEach(option=>{let cls=answers[i]===option?'selected':'';if(answers[i]!==undefined&&answers[i]===option)cls=option===q.correct?'good':'bad';const b=el('button',cls,option);b.onclick=()=>{answers[i]=option;render()};opts.append(b)});task.append(opts);if(answers[i]!==undefined){const correct=answers[i]===q.correct;task.append(el('div','feedback',correct?'✓ Correct! '+q.feedback:'Not quite. '+(correct?'': 'Read the passage again and try another answer.')));if(correct){const evidenceBtn=el('button','secondary sw',showEvidence[i]?'Hide text clue':'Show text clue');evidenceBtn.onclick=()=>{showEvidence[i]=!showEvidence[i];render()};task.append(evidenceBtn);if(showEvidence[i])task.append(el('div','learn','Text clue: “'+q.evidence+'”'))}}c.append(task)});const right=l.questions.filter((q,i)=>answers[i]===q.correct).length;const total=l.questions.length;c.append(el('div','score',`Practice score: ${right}/${total} (${Math.round(100*right/total)}%). You need at least 80% to continue.`));const btn=el('button','primary',state.completed.includes(current)?'Lesson completed ✓':current===5?'Complete module':'Complete lesson →');btn.disabled=right<Math.ceil(total*.8);btn.onclick=()=>{if(!state.completed.includes(current))state.completed.push(current);state.unlocked=Math.min(5,Math.max(state.unlocked,current+1));save();if(current<5)current++;answers={};showEvidence={};showSw=false;render();window.scrollTo(0,0)};c.append(btn);if(state.completed.includes(5))c.append(el('div','score','🎉 Module complete! Great work. You are ready for the next module.'));c.append(el('div','footer','Your completed lessons are saved in this browser. Individual answers are not stored or sent anywhere.'))}$('#reset').onclick=()=>{if(confirm('Reset all progress for Module 7?')){state={unlocked:0,completed:[]};save();current=0;answers={};render()}};render();</script><script>(function(){
const moduleKeys={"english_journey_module_2.html": "english_journey_writing_basics_v1", "english_journey_module_5.html": "english-journey-vocab-v1", "english_journey_module_7.html": "english-journey-module7-v1", "english_journey_module_11.html": "english_journey_module_11_progress_v1", "english_journey_module_8.html": "english-journey-module8-v1", "english_journey_module_9_fixed.html": "english_journey_module_9_progress_v1", "english_journey_module_12_fixed.html": "english_journey_module_12_progress_v1", "english_journey_module_1.html": "english-journey-foundations-v1", "english_journey_module_6.html": "english-journey-module6-v1", "english_journey_module_4.html": "englishJourney_grammarInAction_v1", "english_journey_module_10.html": "english_journey_module_10_progress_v1", "english_journey_module_3.html": "englishJourney_readingSkillsI_v1"};
const gameNames=['english_arcade_grammar_rush.html','english_arcade_reading_detective.html','english_arcade_sentence_scramble.html','english_arcade_word_match.html','english_arcade_story_paths.html'];
const gameTitles=['Grammar Rush','Reading Detective','Sentence Scramble','Word Match','Story Paths'];
const prefix='academy2.game.';
function getModule(file){try{let d=JSON.parse(localStorage.getItem(moduleKeys[file])||'{}');let a=d.done||d.completed||[];return Math.min(6,Array.isArray(a)?new Set(a).size:0)}catch(e){return 0}}
function gameCount(file){try{let v=localStorage.getItem('academy3.plays.'+file);return v===null?(localStorage.getItem(prefix+file)==='1'?1:0):Math.max(0,parseInt(v,10)||0)}catch(e){return 0}}
function gameDone(file){return gameCount(file)>0}
function celebration(title){let wrap=document.createElement('div');wrap.className='academy-celebration';wrap.innerHTML='<div class="academy-pop"><div style="font-size:52px">🏆 ✨ 🎉</div><h2>ACHIEVEMENT UNLOCKED!</h2><p></p><button type="button">Awesome! ✨</button></div>';wrap.querySelector('p').textContent='Well done! You have mastered '+title+'!';wrap.querySelector('button').onclick=()=>wrap.remove();document.body.append(wrap)}
function award(id,title){try{let k='academy2.achievement.'+id;if(!localStorage.getItem(k)){localStorage.setItem(k,'1');celebration(title)}}catch(e){}}
function checkAchievements(){let all=Object.keys(moduleKeys),grammar=all.filter(x=>/module_(1|4|8|11)\.html$/.test(x));if(grammar.every(x=>getModule(x)===6))award('grammar','all grammar modules');if(all.every(x=>getModule(x)===6))award('allmodules','all course modules');if(gameNames.every(gameDone))award('arcade','all arcade games');if(all.every(x=>getModule(x)===6)&&gameNames.every(gameDone))award('academy','English Academy')}
function markGame(file){try{let key='academy3.plays.'+file;localStorage.setItem(key,String(gameCount(file)+1))}catch(e){}checkAchievements()}
function renderHome(){document.querySelectorAll('a.card[href]').forEach(card=>{let file=card.getAttribute('href');let isModule=!!moduleKeys[file],isGame=gameNames.includes(file);if(!isModule&&!isGame)return;let n=isModule?getModule(file):gameCount(file);card.classList.toggle('academy-mastered',isModule&&n===6);let label=card.querySelector('.academy-status');if(!label){label=document.createElement('div');label.className='academy-status';card.insertBefore(label,card.querySelector('.go'))}if(isModule){label.innerHTML='<div class="academy-status-line"><span>'+(n===6?'✓ Mastered!':n+' / 6 lessons completed')+'</span><span>'+Math.round(n/6*100)+'%</span></div><div class="academy-track"><div style="width:'+Math.round(n/6*100)+'%"></div></div>'}else{label.innerHTML='<div class="academy-status-line"><span>🎮 '+n+' '+(n===1?'time':'times')+' played</span><span>'+(n?'Keep playing!':'Ready to play')+'</span></div>';}});let n=Object.keys(moduleKeys).reduce((a,x)=>a+getModule(x),0);let banner=document.getElementById('academy-overview');if(banner)banner.textContent='Your journey: '+n+' / 72 lessons completed · '+gameNames.reduce((a,x)=>a+gameCount(x),0)+' arcade rounds played';checkAchievements()}
window.Academy2={markGame,checkAchievements,renderHome};
if(document.body.querySelector('a.card[href]')){renderHome();window.addEventListener('pageshow',renderHome)}
else {let bar=document.createElement('div');bar.className='academy-back';bar.innerHTML='<a href="index.html">← Back to English Academy</a>';document.body.prepend(bar);let bottom=bar.cloneNode(true);bottom.className+=' academy-bottom';document.body.append(bottom);let file=location.pathname.split('/').pop();if(moduleKeys[file]){let old=getModule(file);setInterval(()=>{let now=getModule(file);if(now>old){old=now;if(now===6){award('module-'+file,document.title.replace(/\s*[|–-].*$/,'')||'this module');checkAchievements()}}},1300)}}
})();</script></body></html>
