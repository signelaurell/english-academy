<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Journey · The English Challenge</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fc;color:#24314b;font-family:Inter,system-ui,Arial,sans-serif}.top{background:linear-gradient(115deg,#30345d,#6953a8);color:white;padding:26px max(22px,calc((100vw - 1080px)/2))}.top small{letter-spacing:2px;font-weight:700}.top h1{margin:7px 0;font-size:30px}.layout{max-width:1080px;margin:25px auto;display:grid;grid-template-columns:275px 1fr;gap:22px;padding:0 16px}.panel{background:white;border:1px solid #e3e5f1;border-radius:16px;padding:22px;box-shadow:0 4px 20px #2830500a}.nav button{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border:1px solid #e2e5f2;background:white;border-radius:11px;color:#35415e;cursor:pointer}.nav button.active{border-color:#7464b7;background:#f0ecff;font-weight:700}.nav button:disabled{opacity:.45;cursor:not-allowed}button{font:inherit}.primary{background:#6652a7;color:white;border:0;border-radius:9px;padding:11px 18px;cursor:pointer;font-weight:700}.secondary{background:white;border:1px solid #bbb7d9;border-radius:9px;padding:10px 14px;cursor:pointer}.muted{color:#65718a}.lessonbox{background:#f1f0fb;border-radius:12px;padding:18px;line-height:1.65}.question{border:1px solid #e1e4ef;border-radius:13px;padding:17px;margin-top:14px}.question h3{font-size:16px;margin:0 0 12px}.option{display:block;width:100%;text-align:left;border:1px solid #dfe3ed;background:white;border-radius:9px;margin:7px 0;padding:10px 12px;cursor:pointer}.option.selected{border-color:#6754a9;background:#f1edff}.option:disabled{cursor:default}.feedback{padding:11px;border-radius:9px;margin-top:9px;background:#f1f4fa}.good{background:#e5f7ec;color:#155d38}.bad{background:#fff1e6;color:#8c4117}textarea{width:100%;min-height:110px;border:1px solid #ccd2e2;border-radius:10px;padding:12px;font:inherit;resize:vertical}.check{display:block;margin:9px 0}.progress{height:9px;background:#e6e8f0;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#36a88e}.sectiontitle{margin-top:30px}.hidden{display:none}.tag{display:inline-block;background:#edeaf9;border-radius:30px;padding:5px 10px;font-size:12px;color:#55459b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#result{margin-top:16px}.footer{font-size:12px;color:#7b8498;margin-top:18px}@media(max-width:720px){.layout{grid-template-columns:1fr}.top h1{font-size:25px}}</style></head><body><header class="top"><small>ENGLISH JOURNEY · MODULE 12</small><h1>The English Challenge</h1><div>Bring all your English skills together. You’ve got this!</div></header><div class="layout"><aside class="panel"><h2>Your learning path</h2><p class="muted">Complete each lesson to unlock the next.</p><div class="progress"><div id="bar"></div></div><p id="progressText" class="muted"></p><nav class="nav" id="nav"></nav><button class="secondary" id="reset">Reset my progress</button></aside><main class="panel" id="main"></main></div><script>const LESSONS={"lessons": [{"title": "Grammar Master", "explain": "Review the grammar you have learnt: present and past tenses, questions, conditionals, relative clauses and passive voice. Look for time expressions and clues in each sentence.", "sv": "Repetition av tempus, frågor, konditionalis, relativa bisatser och passiv form. Leta efter tidsuttryck och ledtrådar.", "questions": [{"q": "My sister ___ to school every day.", "options": ["walk", "walks", "walking"], "answer": 1, "feedback": "With she, use walks in present simple."}, {"q": "They ___ a film when I called.", "options": ["watched", "were watching", "watch"], "answer": 1, "feedback": "Were watching describes an action in progress at that past moment."}, {"q": "Have you ever ___ sushi?", "options": ["eat", "ate", "eaten"], "answer": 2, "feedback": "Present perfect uses have + past participle."}, {"q": "If it rains tomorrow, we ___ inside.", "options": ["stay yesterday", "will stay", "would stayed"], "answer": 1, "feedback": "First conditional uses will + base verb."}, {"q": "The museum ___ opened in 2005.", "options": ["was", "were", "is being"], "answer": 0, "feedback": "Was opened is the past passive."}, {"q": "The person ___ helped us was friendly.", "options": ["which", "who", "where"], "answer": 1, "feedback": "Who refers to a person."}], "writing": {"prompt": "Write three sentences: one in past simple, one in present perfect and one using if.", "sample": "I visited my cousin last week. I have never been to Canada. If I have time, I will read tonight.", "checks": ["My ideas are clear and relevant.", "I checked vocabulary, grammar and punctuation.", "I improved at least one part of my answer."]}}, {"title": "Vocabulary Expert", "explain": "Choose words that fit both the meaning and the situation. Synonyms are not always interchangeable: consider tone, collocations and context.", "sv": "Välj ord efter betydelse och sammanhang. Tänk på uttryck och hur formellt språket är.", "questions": [{"q": "Which word is closest in meaning to exhausted?", "options": ["tired", "excited", "confused"], "answer": 0, "feedback": "Exhausted means very tired."}, {"q": "Choose the best word: “I need to ___ a decision.”", "options": ["do", "make", "build"], "answer": 1, "feedback": "Make a decision is the natural collocation."}, {"q": "Which word is the opposite of generous?", "options": ["selfish", "helpful", "patient"], "answer": 0, "feedback": "Selfish describes someone unwilling to share or consider others."}, {"q": "“The instructions were unclear.” Unclear means…", "options": ["easy to understand", "difficult to understand", "very detailed"], "answer": 1, "feedback": "Unclear means not easy to understand."}, {"q": "Which is the most suitable phrase in a polite email to a teacher?", "options": ["Send it now.", "I would appreciate your help.", "Give me that thing."], "answer": 1, "feedback": "The phrase is polite and appropriate for a teacher."}, {"q": "“She was reluctant to speak.” Reluctant means she…", "options": ["did not really want to", "was very eager to", "was unable to hear"], "answer": 0, "feedback": "Reluctant means unwilling or hesitant."}], "writing": {"prompt": "Replace two basic words in these sentences with more precise vocabulary: “The film was good. The ending was bad.”", "sample": "The film was captivating, but the ending was disappointing.", "checks": ["My ideas are clear and relevant.", "I checked vocabulary, grammar and punctuation.", "I improved at least one part of my answer."]}}, {"title": "Reading Detective", "explain": "Read this short story carefully: “At 7:45, Leo reached the bus stop. His bus normally arrived at 7:40. The road was empty. He checked his phone: the science presentation began at 8:15. Leo took a deep breath and started walking quickly towards school. At the classroom door, he heard applause. His teacher smiled and said, ‘You are just in time for your turn.’” Use both direct information and clues.", "sv": "Läs berättelsen och skilj mellan information som står direkt och slutsatser som bygger på ledtrådar.", "questions": [{"q": "What time did Leo normally expect the bus?", "options": ["7:40", "7:45", "8:15"], "answer": 0, "feedback": "The text says his bus normally arrived at 7:40."}, {"q": "Why did Leo start walking?", "options": ["He had missed the bus and needed to reach school.", "He wanted to exercise before school.", "He was meeting a friend nearby."], "answer": 0, "feedback": "The empty road, late bus and upcoming presentation explain his choice."}, {"q": "Which feeling is most strongly suggested when Leo checks the time?", "options": ["Worry", "Boredom", "Pride"], "answer": 0, "feedback": "The approaching presentation and his deep breath suggest worry."}, {"q": "What did Leo hear outside the classroom?", "options": ["Music", "Applause", "An alarm"], "answer": 1, "feedback": "The story explicitly mentions applause."}, {"q": "What can we infer about Leo’s arrival?", "options": ["He arrived before his turn to present.", "He missed the whole presentation.", "He arrived before anyone else."], "answer": 0, "feedback": "The teacher says he is just in time for his turn."}, {"q": "Which detail best supports the idea that Leo was in a hurry?", "options": ["He started walking quickly.", "His teacher smiled.", "The class applauded."], "answer": 0, "feedback": "Walking quickly directly supports the inference."}], "writing": {"prompt": "Explain in two sentences how Leo probably felt before and after reaching the classroom. Use evidence from the story.", "sample": "Leo was probably worried because he had missed his bus and his presentation was starting soon. He likely felt relieved when his teacher said he was just in time.", "checks": ["My ideas are clear and relevant.", "I checked vocabulary, grammar and punctuation.", "I improved at least one part of my answer."]}}, {"title": "Writing Workshop", "explain": "Good writing has a clear purpose, organised paragraphs and developed ideas. Compare: “Sports are good.” with “Team sports can build confidence because players learn to support one another.” The second gives a reason and a specific idea.", "sv": "Bra texter har tydligt syfte, sammanhang och utvecklade idéer. Motivera med exempel och förklaringar.", "questions": [{"q": "Which sentence develops an opinion best?", "options": ["School trips are nice.", "School trips can help classmates connect because they share new experiences.", "I like school trips."], "answer": 1, "feedback": "It gives an opinion and a reason."}, {"q": "Which is the strongest topic sentence for a paragraph about sleep?", "options": ["Sleep matters for teenagers in several ways.", "Yesterday I was tired.", "My pillow is blue."], "answer": 0, "feedback": "It clearly introduces a paragraph topic."}, {"q": "Choose the best linking word: “I wanted to go out; ___, it was raining heavily.”", "options": ["however", "because", "for example"], "answer": 0, "feedback": "However introduces a contrast."}, {"q": "Which sentence is the clearest?", "options": ["After finishing the book, Sara wrote a review.", "Sara book after review finishing wrote.", "Finishing Sara the book, wrote review."], "answer": 0, "feedback": "The word order makes the sequence clear."}, {"q": "Which detail would best support “Reading can improve vocabulary”?", "options": ["Readers meet unfamiliar words in different contexts.", "Books come in many colours.", "Some libraries close early."], "answer": 0, "feedback": "It explains how reading builds vocabulary."}, {"q": "What should you check when editing a paragraph?", "options": ["Only the number of words", "Meaning, organisation and language", "Only the first sentence"], "answer": 1, "feedback": "Effective editing checks ideas, structure and language."}], "writing": {"prompt": "Write a short paragraph (4–5 sentences): “Should students have homework?” Include an opinion, a reason, an example and a conclusion.", "sample": "I think students should have some homework, but not too much. Short tasks can help us remember what we learn in class. For example, ten minutes of vocabulary practice can make a difference. However, students also need time to rest. That is why homework should be useful and limited.", "checks": ["My ideas are clear and relevant.", "I checked vocabulary, grammar and punctuation.", "I improved at least one part of my answer."]}}, {"title": "English in Real Life", "explain": "English changes depending on the situation. Think about who you are speaking to, what you need and how polite or clear your message should be.", "sv": "Välj språk efter situation, mottagare och syfte. Tydlighet och artighet spelar roll.", "questions": [{"q": "You need help finding the train station. What is the most polite question?", "options": ["Where station?", "Could you tell me how to get to the station?", "You tell me station now."], "answer": 1, "feedback": "Could you tell me… is polite and clear."}, {"q": "A friend texts “Can you come at six?” You cannot. Which reply is clearest?", "options": ["No.", "Sorry, I cannot make six. Could we meet at seven?", "Maybe something."], "answer": 1, "feedback": "It explains the problem and suggests an alternative."}, {"q": "You are writing to a school librarian. Which opening fits best?", "options": ["Dear Librarian,", "Yo dude,", "Hey!!!"], "answer": 0, "feedback": "Dear Librarian is appropriate for a formal request."}, {"q": "A website says “Admission is free for under-16s.” You are 15. What does this mean?", "options": ["You must pay full price.", "You can enter without paying.", "Only 16-year-olds enter free."], "answer": 1, "feedback": "Under-16s includes people younger than 16."}, {"q": "Someone says “I’m afraid I disagree.” What are they doing?", "options": ["Politely expressing disagreement", "Saying they are frightened", "Agreeing enthusiastically"], "answer": 0, "feedback": "The phrase is a polite way to disagree."}, {"q": "You receive an email saying “Please reply by Friday.” What should you do?", "options": ["Reply no later than Friday.", "Wait until the following week.", "Reply only on Saturday."], "answer": 0, "feedback": "By Friday means Friday is the deadline."}], "writing": {"prompt": "Write a polite email (3–5 sentences) asking a teacher for clarification about an assignment.", "sample": "Dear Ms Green, I have a question about the writing assignment. Could you please explain how long the text should be? Thank you for your help. Best regards, Alex", "checks": ["My ideas are clear and relevant.", "I checked vocabulary, grammar and punctuation.", "I improved at least one part of my answer."]}}, {"title": "The Final Challenge", "explain": "You have reached the end of English Journey! This challenge mixes grammar, vocabulary, reading and writing choices. Read each question carefully. You need at least five correct answers to complete the course.", "sv": "Slututmaning med blandade färdigheter. Läs noga och använd strategierna från hela kursen.", "questions": [{"q": "Choose the correct sentence.", "options": ["She has lived here since 2022.", "She have lived here since 2022.", "She living here since 2022."], "answer": 0, "feedback": "She has + past participle is correct present perfect."}, {"q": "“Despite the rain, the match continued.” Despite means…", "options": ["because of", "even though there was", "before"], "answer": 1, "feedback": "Despite introduces a contrast: the rain did not stop the match."}, {"q": "Read: “Nora folded the invitation and put it in a drawer. She had wanted to go, but the tickets were too expensive.” Why did Nora put it away?", "options": ["She could not afford to go.", "She had already attended.", "She disliked the event."], "answer": 0, "feedback": "The text says the tickets were too expensive."}, {"q": "Which is the most developed argument?", "options": ["Cycling is good.", "Cycling is better because it is nice.", "Cycling to school can reduce traffic and help students stay active."], "answer": 2, "feedback": "It supports the idea with two specific benefits."}, {"q": "If I ___ more time, I would learn another language.", "options": ["have", "had", "will have"], "answer": 1, "feedback": "Second conditional uses past simple after if."}, {"q": "Which sentence is most suitable in a formal email?", "options": ["I would be grateful for your response.", "Answer me ASAP!!!", "Hey, reply now."], "answer": 0, "feedback": "It is respectful and appropriate in a formal email."}], "writing": {"prompt": "Write a final reflection: What have you improved in English, and what would you like to practise next? Give at least two specific examples.", "sample": "I have become better at choosing the right verb tense and explaining my opinions. I can now use examples to develop a paragraph. Next, I would like to practise listening to different accents and speaking more confidently.", "checks": ["My ideas are clear and relevant.", "I checked vocabulary, grammar and punctuation.", "I improved at least one part of my answer."]}}]}.lessons;const KEY='english_journey_module_12_progress_v1';let progress;try{progress=JSON.parse(localStorage.getItem(KEY))||{unlocked:0,done:[]}}catch(e){progress={unlocked:0,done:[]}};if(!Array.isArray(progress.done))progress.done=[];let current=Math.min(progress.unlocked,5),answers={},showSwedish=false,attempted=false;function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('bar').style.width=(progress.done.length/6*100)+'%';document.getElementById('progressText').textContent=progress.done.length+' of 6 lessons completed';document.getElementById('nav').innerHTML=LESSONS.map((l,i)=>`<button data-go="${i}" ${i>progress.unlocked?'disabled':''} class="${i===current?'active':''}">${progress.done.includes(i)?'✓ ':i>progress.unlocked?'🔒 ':''}${i+1}. ${esc(l.title)}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{current=+b.dataset.go;answers={};attempted=false;render()});let l=LESSONS[current];document.getElementById('main').innerHTML=`<div class="row"><span class="tag">LESSON ${current+1} / 6</span><span class="muted">~8–12 minutes</span></div><h1>${esc(l.title)}</h1><p class="muted">Read the explanation, practise, and check your understanding.</p><div class="lessonbox"><strong>Learn it!</strong><p>${esc(l.explain).replace(/\n/g,"<br>")}</p><button class="secondary" id="sv">${showSwedish?'Hide Swedish help':'Visa svensk förklaring'}</button>${showSwedish?`<p lang="sv">${esc(l.sv)}</p>`:''}</div><h2 class="sectiontitle">Try it! <small class="muted">6 questions</small></h2><div id="questions"></div><button class="primary" id="grade">Check my answers</button><div id="result" aria-live="polite"></div><h2 class="sectiontitle">Write & Reflect</h2><p>${esc(l.writing.prompt)}</p><textarea id="draft" placeholder="Write your own answer here..."></textarea><p class="muted">Your response is for practice. It is not sent or automatically assessed.</p><button class="secondary" id="sampleBtn">Show a model answer</button><div class="lessonbox hidden" id="sample"><strong>One possible answer</strong><p>${esc(l.writing.sample)}</p><p>Compare the structure and ideas, not just the exact words.</p></div><h3>Self-check</h3>${l.writing.checks.map(c=>`<label class="check"><input type="checkbox"> ${esc(c)}</label>`).join('')}<p class="footer">Progress is stored in this browser. Draft writing is not saved.</p>`;document.getElementById('sv').onclick=()=>{showSwedish=!showSwedish;const draft=document.getElementById('draft').value;render();document.getElementById('draft').value=draft};document.getElementById('sampleBtn').onclick=()=>document.getElementById('sample').classList.toggle('hidden');document.getElementById('grade').onclick=grade;drawQuestions()}function drawQuestions(){let l=LESSONS[current];document.getElementById('questions').innerHTML=l.questions.map((q,i)=>`<div class="question"><h3>${i+1}. ${esc(q.q)}</h3>${q.options.map((o,j)=>`<button class="option ${answers[i]===j?'selected':''}" data-q="${i}" data-a="${j}" ${attempted?'disabled':''}>${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}<div id="fb${i}"></div></div>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[+b.dataset.q]=+b.dataset.a;drawQuestions()})}function grade(){let l=LESSONS[current];if(Object.keys(answers).length<l.questions.length){document.getElementById('result').innerHTML='<div class="feedback bad">Answer all six questions before checking.</div>';return}attempted=true;drawQuestions();let score=0;l.questions.forEach((q,i)=>{let ok=answers[i]===q.answer;if(ok)score++;document.getElementById('fb'+i).innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'✓ Correct.':'Not yet. Correct answer: '+esc(q.options[q.answer])+'.'} ${esc(q.feedback)}</div>`});let pct=Math.round(score/l.questions.length*100),passed=pct>=80;document.getElementById('result').innerHTML=`<div class="feedback ${passed?'good':'bad'}"><strong>${score}/6 (${pct}%)</strong> — ${passed?'Well done! You have passed this lesson.':'You need at least 80% (5 out of 6). Review the explanations and try again.'}</div><div class="row" style="margin-top:12px"><button class="secondary" id="retry">Try again</button>${passed&&current<5?'<button class="primary" id="next">Next lesson →</button>':''}${passed&&current===5?'<strong>🎉 Congratulations! You have completed English Journey!</strong>':''}</div>`;if(passed){if(!progress.done.includes(current))progress.done.push(current);progress.unlocked=Math.max(progress.unlocked,Math.min(current+1,5));save();document.getElementById('bar').style.width=(progress.done.length/6*100)+'%';document.getElementById('progressText').textContent=progress.done.length+' of 6 lessons completed';document.querySelectorAll('[data-go]').forEach(b=>{if(+b.dataset.go<=progress.unlocked)b.disabled=false});}document.getElementById('retry').onclick=()=>{answers={};attempted=false;drawQuestions();document.getElementById('result').innerHTML=''};let n=document.getElementById('next');if(n)n.onclick=()=>{current++;answers={};attempted=false;showSwedish=false;render()}}document.getElementById('reset').onclick=()=>{if(confirm('Reset all progress for Module 12 on this browser?')){progress={unlocked:0,done:[]};current=0;answers={};attempted=false;save();render()}};render();</script></body></html>
