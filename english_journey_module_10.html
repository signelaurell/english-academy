<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Journey · Reading Between the Lines</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fc;color:#24314b;font-family:Inter,system-ui,Arial,sans-serif}.top{background:linear-gradient(115deg,#30345d,#6953a8);color:white;padding:26px max(22px,calc((100vw - 1080px)/2))}.top small{letter-spacing:2px;font-weight:700}.top h1{margin:7px 0;font-size:30px}.layout{max-width:1080px;margin:25px auto;display:grid;grid-template-columns:275px 1fr;gap:22px;padding:0 16px}.panel{background:white;border:1px solid #e3e5f1;border-radius:16px;padding:22px;box-shadow:0 4px 20px #2830500a}.nav button{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border:1px solid #e2e5f2;background:white;border-radius:11px;color:#35415e;cursor:pointer}.nav button.active{border-color:#7464b7;background:#f0ecff;font-weight:700}.nav button:disabled{opacity:.45;cursor:not-allowed}button{font:inherit}.primary{background:#6652a7;color:white;border:0;border-radius:9px;padding:11px 18px;cursor:pointer;font-weight:700}.secondary{background:white;border:1px solid #bbb7d9;border-radius:9px;padding:10px 14px;cursor:pointer}.muted{color:#65718a}.lessonbox{background:#f1f0fb;border-radius:12px;padding:18px;line-height:1.65}.question{border:1px solid #e1e4ef;border-radius:13px;padding:17px;margin-top:14px}.question h3{font-size:16px;margin:0 0 12px}.option{display:block;width:100%;text-align:left;border:1px solid #dfe3ed;background:white;border-radius:9px;margin:7px 0;padding:10px 12px;cursor:pointer}.option.selected{border-color:#6754a9;background:#f1edff}.option:disabled{cursor:default}.feedback{padding:11px;border-radius:9px;margin-top:9px;background:#f1f4fa}.good{background:#e5f7ec;color:#155d38}.bad{background:#fff1e6;color:#8c4117}textarea{width:100%;min-height:110px;border:1px solid #ccd2e2;border-radius:10px;padding:12px;font:inherit;resize:vertical}.check{display:block;margin:9px 0}.progress{height:9px;background:#e6e8f0;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#36a88e}.sectiontitle{margin-top:30px}.hidden{display:none}.tag{display:inline-block;background:#edeaf9;border-radius:30px;padding:5px 10px;font-size:12px;color:#55459b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#result{margin-top:16px}.footer{font-size:12px;color:#7b8498;margin-top:18px}@media(max-width:720px){.layout{grid-template-columns:1fr}.top h1{font-size:25px}}</style></head><body><header class="top"><small>ENGLISH JOURNEY · MODULE 10</small><h1>Reading Between the Lines</h1><div>Read closely. Find clues. Explain your thinking.</div></header><div class="layout"><aside class="panel"><h2>Your learning path</h2><p class="muted">Complete each lesson to unlock the next.</p><div class="progress"><div id="bar"></div></div><p id="progressText" class="muted"></p><nav class="nav" id="nav"></nav><button class="secondary" id="reset">Reset my progress</button></aside><main class="panel" id="main"></main></div><script>const LESSONS={"lessons": [{"title": "Themes & Messages", "explain": "A topic is what a story is about. A theme is a bigger idea it explores. A message is something the reader may learn. Look for repeated choices and consequences.\n\nREADING TEXT:\nEvery Tuesday, Mina waited outside the sports hall while her friends practised. She wanted to join, but she was afraid of making mistakes. One afternoon, the coach invited her in. Mina missed her first three shots. Nobody laughed. The next Tuesday, she arrived wearing trainers.", "sv": "Ämnet är vad texten handlar om. Tema och budskap handlar om större idéer som texten utforskar.", "questions": [{"q": "What is Mina afraid of?", "options": ["Getting lost", "Making mistakes", "The coach"], "answer": 1, "feedback": "She is worried about making mistakes."}, {"q": "Which theme fits best?", "options": ["Courage to try", "Winning competitions", "The weather"], "answer": 0, "feedback": "Mina decides to try despite her fear."}, {"q": "What changes at the end?", "options": ["She quits the team", "She becomes the coach", "She prepares to participate"], "answer": 2, "feedback": "Arriving in trainers suggests she intends to join."}, {"q": "What detail suggests the hall feels safer than Mina expected?", "options": ["Nobody laughed", "It was Tuesday", "She waited outside"], "answer": 0, "feedback": "The other players do not mock her missed shots."}, {"q": "Which message is most supported?", "options": ["You must always win", "Trying can be worthwhile even if you fail at first", "Sport is more important than school"], "answer": 1, "feedback": "Her missed shots do not stop her returning."}, {"q": "Which statement is an interpretation rather than a directly stated fact?", "options": ["She missed three shots", "The coach invited her in", "She begins to feel more confident"], "answer": 2, "feedback": "Confidence is inferred from her decision to return."}], "writing": {"prompt": "In 2–3 sentences, explain your interpretation. Mention a detail from the text as evidence.", "sample": "One possible interpretation is supported by a specific action or phrase in the text. Another interpretation may also work if you can explain the evidence.", "checks": ["I explain my interpretation.", "I refer to a specific detail from the text.", "I distinguish evidence from my own opinion."]}}, {"title": "Character Feelings & Motivation", "explain": "Authors often show feelings through actions, dialogue and small details instead of naming emotions. Ask what a character wants and why.\n\nREADING TEXT:\nLeo checked his phone again. No message. He placed two cups on the table and looked at the empty chair. When the door finally opened, he stood up so quickly that his chair scraped the floor. “You made it,” he said, trying not to smile too widely.", "sv": "Känslor kan visas genom handlingar och repliker, utan att de nämns direkt.", "questions": [{"q": "Who is Leo waiting for?", "options": ["Someone expected to arrive", "A teacher giving homework", "A delivery driver named in the text"], "answer": 0, "feedback": "The second cup and empty chair suggest a guest."}, {"q": "What does checking his phone repeatedly suggest?", "options": ["He is bored with his phone", "He is waiting anxiously for news", "He wants to buy a phone"], "answer": 1, "feedback": "Repeated checking signals anticipation or worry."}, {"q": "Which detail most strongly suggests excitement?", "options": ["Two cups", "The table", "He stands up suddenly"], "answer": 2, "feedback": "His quick reaction shows strong emotion."}, {"q": "Why might he try not to smile too widely?", "options": ["He wants to hide how pleased he is", "He is angry about the cups", "He dislikes the visitor"], "answer": 0, "feedback": "The text suggests he is pleased but restrained."}, {"q": "Which emotion best fits the ending?", "options": ["Relief", "Jealousy", "Disgust"], "answer": 0, "feedback": "The awaited person arrives, ending the uncertainty."}, {"q": "Which is directly stated?", "options": ["Leo is in love", "Leo checked his phone again", "The visitor is his brother"], "answer": 1, "feedback": "Only the phone action is explicitly described."}], "writing": {"prompt": "In 2–3 sentences, explain your interpretation. Mention a detail from the text as evidence.", "sample": "One possible interpretation is supported by a specific action or phrase in the text. Another interpretation may also work if you can explain the evidence.", "checks": ["I explain my interpretation.", "I refer to a specific detail from the text.", "I distinguish evidence from my own opinion."]}}, {"title": "Narrator & Perspective", "explain": "A first-person narrator uses I. A third-person narrator uses he, she or they. A narrator may know only part of the story; consider whose thoughts you can access.\n\nREADING TEXT:\nI thought the new student was ignoring me. Whenever I waved, she looked away. On Friday, our teacher asked us to work together. “Sorry,” she said. “I forgot my glasses this week. I couldn’t see who was waving.” I felt my face grow warm.", "sv": "Berättarperspektivet påverkar vad vi får veta. Fundera på vem som berättar och vad den personen kan känna till.", "questions": [{"q": "Which point of view is used?", "options": ["First person", "Second person", "Third person"], "answer": 0, "feedback": "The narrator uses I."}, {"q": "What does the narrator believe at first?", "options": ["The student is angry with the teacher", "The student is ignoring them", "The student lost her phone"], "answer": 1, "feedback": "The narrator interprets the lack of response as being ignored."}, {"q": "What new information changes the interpretation?", "options": ["The student forgot her glasses", "It is Friday", "The teacher sets group work"], "answer": 0, "feedback": "She could not see who was waving."}, {"q": "Why does the narrator feel embarrassed?", "options": ["They failed an exam", "They lost their glasses", "They may have judged the student unfairly"], "answer": 2, "feedback": "The explanation reveals the initial assumption was mistaken."}, {"q": "Which thought is available directly?", "options": ["The teacher’s private opinion", "The narrator’s original assumption", "The new student’s secret plan"], "answer": 1, "feedback": "We hear the narrator’s thoughts in first person."}, {"q": "What is a reasonable message?", "options": ["First impressions can be misleading", "Never wave at classmates", "Group work always fails"], "answer": 0, "feedback": "The misunderstanding is corrected by learning more."}], "writing": {"prompt": "In 2–3 sentences, explain your interpretation. Mention a detail from the text as evidence.", "sample": "One possible interpretation is supported by a specific action or phrase in the text. Another interpretation may also work if you can explain the evidence.", "checks": ["I explain my interpretation.", "I refer to a specific detail from the text.", "I distinguish evidence from my own opinion."]}}, {"title": "Tone & Atmosphere", "explain": "Tone is the attitude created by the writer’s word choices. Atmosphere is the feeling a scene creates. Notice descriptions, sounds and pace.\n\nREADING TEXT:\nThe corridor lights flickered. Somewhere behind the locked door, a slow tapping began. Amira stopped walking. Then a small orange cat squeezed through a gap and knocked over an empty plastic bottle. Amira laughed, and the corridor suddenly seemed ordinary again.", "sv": "Ton och stämning byggs med ordval, miljö och detaljer.", "questions": [{"q": "What atmosphere is created at the start?", "options": ["Tense and mysterious", "Cheerful and busy", "Peaceful and sunny"], "answer": 0, "feedback": "Flickering lights and unexplained tapping create suspense."}, {"q": "Which detail creates suspense?", "options": ["A plastic bottle", "Slow tapping behind a locked door", "Amira laughing"], "answer": 1, "feedback": "The sound is unexplained and comes from a locked room."}, {"q": "What causes the change in atmosphere?", "options": ["The cat explains the noise", "The lights turn blue", "The door disappears"], "answer": 0, "feedback": "The cat and bottle provide an ordinary explanation."}, {"q": "What is the tone near the end?", "options": ["Threatening", "Tragic", "Light and relieved"], "answer": 2, "feedback": "Amira laughs when the mystery is solved."}, {"q": "Which word best describes Amira’s first reaction?", "options": ["Cautious", "Proud", "Amused"], "answer": 0, "feedback": "She stops when she hears the sound."}, {"q": "Which statement is best supported?", "options": ["The corridor is haunted", "The initial fear came from uncertainty", "The cat wanted to scare Amira"], "answer": 1, "feedback": "An unexplained sound seems frightening until its source is revealed."}], "writing": {"prompt": "In 2–3 sentences, explain your interpretation. Mention a detail from the text as evidence.", "sample": "One possible interpretation is supported by a specific action or phrase in the text. Another interpretation may also work if you can explain the evidence.", "checks": ["I explain my interpretation.", "I refer to a specific detail from the text.", "I distinguish evidence from my own opinion."]}}, {"title": "Different Interpretations", "explain": "Readers may interpret a text differently. A strong interpretation is possible from the text and supported with evidence. Avoid claims that the text cannot support.\n\nREADING TEXT:\nWhen the class voted on the trip, Sam raised his hand for the museum. Most classmates chose the adventure park. “That’s fine,” Sam said. At lunch he sat alone, drawing a picture of a dinosaur skeleton. Later, he asked whether they could visit the museum on another day.", "sv": "Olika tolkningar kan vara rimliga om de stöds av texten. Skilj mellan ledtrådar och gissningar.", "questions": [{"q": "What did Sam vote for?", "options": ["The adventure park", "The museum", "A concert"], "answer": 1, "feedback": "The text explicitly says he voted for the museum."}, {"q": "Which interpretation is supported by his drawing?", "options": ["He is interested in dinosaurs", "He dislikes all classmates", "He has visited every museum"], "answer": 0, "feedback": "Drawing a skeleton suggests an interest in dinosaurs."}, {"q": "Which detail suggests disappointment?", "options": ["The class voted", "He raised his hand", "He asks to visit the museum another day"], "answer": 2, "feedback": "He still hopes to visit the museum."}, {"q": "Which claim goes beyond the evidence?", "options": ["Sam prefers the museum", "Sam secretly plans to ruin the trip", "Most classmates prefer the park"], "answer": 1, "feedback": "Nothing suggests sabotage."}, {"q": "Could “That’s fine” hide disappointment?", "options": ["Yes, because his later actions suggest he still wants the museum", "No, spoken words always show true feelings", "No, because he drew a dinosaur"], "answer": 0, "feedback": "His later request allows this interpretation."}, {"q": "What makes an interpretation strong?", "options": ["A dramatic guess", "A personal preference alone", "Evidence from the text"], "answer": 2, "feedback": "A convincing interpretation is grounded in details."}], "writing": {"prompt": "In 2–3 sentences, explain your interpretation. Mention a detail from the text as evidence.", "sample": "One possible interpretation is supported by a specific action or phrase in the text. Another interpretation may also work if you can explain the evidence.", "checks": ["I explain my interpretation.", "I refer to a specific detail from the text.", "I distinguish evidence from my own opinion."]}}, {"title": "Reading Between the Lines: Challenge", "explain": "Use everything you have practised: themes, motivation, narrator, atmosphere and evidence. Read closely before answering.\n\nREADING TEXT:\nThe notice on the library door read: “Last day: Friday.” Nora stood outside for a long time. Every Wednesday for three years, she had sat by the window to draw. Inside, the librarian was packing books into boxes. “We’re opening a smaller space at the community centre,” he said. Nora looked at the empty shelves. Then she picked up a marker and wrote on the notice: “See you there.”", "sv": "Sluttest: tolka budskap, känslor, perspektiv och stämning med stöd i texten.", "questions": [{"q": "What is happening to the library?", "options": ["It is closing in its current location", "It is opening for the first time", "It is becoming a sports hall"], "answer": 0, "feedback": "The last-day notice and packed books indicate closure."}, {"q": "What does the Wednesday routine suggest?", "options": ["Nora works as a librarian", "The library is important to Nora", "Nora dislikes drawing"], "answer": 1, "feedback": "She has spent time there regularly for years."}, {"q": "Which mood fits the middle of the text?", "options": ["Triumphant", "Silly", "Sad or uncertain"], "answer": 2, "feedback": "Empty shelves and Nora’s long pause suggest loss."}, {"q": "Why does Nora write “See you there”?", "options": ["She accepts the possibility of continuing at the new location", "She wants to stop reading", "She thinks the building will reopen tomorrow"], "answer": 0, "feedback": "The message refers to the new community-centre space."}, {"q": "Which theme is most supported?", "options": ["Competition", "Change and continuity", "Dangerous adventures"], "answer": 1, "feedback": "The place changes, but the activity may continue."}, {"q": "Which detail most clearly supports a hopeful ending?", "options": ["The empty shelves", "The boxes", "Nora writes “See you there”"], "answer": 2, "feedback": "Her message looks toward the future."}], "writing": {"prompt": "In 2–3 sentences, explain your interpretation. Mention a detail from the text as evidence.", "sample": "One possible interpretation is supported by a specific action or phrase in the text. Another interpretation may also work if you can explain the evidence.", "checks": ["I explain my interpretation.", "I refer to a specific detail from the text.", "I distinguish evidence from my own opinion."]}}]}.lessons;const KEY='english_journey_module_10_progress_v1';let progress;try{progress=JSON.parse(localStorage.getItem(KEY))||{unlocked:0,done:[]}}catch(e){progress={unlocked:0,done:[]}};if(!Array.isArray(progress.done))progress.done=[];let current=Math.min(progress.unlocked,5),answers={},showSwedish=false,attempted=false;function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('bar').style.width=(progress.done.length/6*100)+'%';document.getElementById('progressText').textContent=progress.done.length+' of 6 lessons completed';document.getElementById('nav').innerHTML=LESSONS.map((l,i)=>`<button data-go="${i}" ${i>progress.unlocked?'disabled':''} class="${i===current?'active':''}">${progress.done.includes(i)?'✓ ':i>progress.unlocked?'🔒 ':''}${i+1}. ${esc(l.title)}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{current=+b.dataset.go;answers={};attempted=false;render()});let l=LESSONS[current];document.getElementById('main').innerHTML=`<div class="row"><span class="tag">LESSON ${current+1} / 6</span><span class="muted">~10–15 minutes</span></div><h1>${esc(l.title)}</h1><p class="muted">Read the explanation, practise, and check your understanding.</p><div class="lessonbox"><strong>Learn it!</strong><p>${esc(l.explain).replace(/\n/g,"<br>")}</p><button class="secondary" id="sv">${showSwedish?'Hide Swedish help':'Visa svensk förklaring'}</button>${showSwedish?`<p lang="sv">${esc(l.sv)}</p>`:''}</div><h2 class="sectiontitle">Try it! <small class="muted">6 questions</small></h2><div id="questions"></div><button class="primary" id="grade">Check my answers</button><div id="result" aria-live="polite"></div><h2 class="sectiontitle">Reflect & Explain</h2><p>${esc(l.writing.prompt)}</p><textarea id="draft" placeholder="Write your own answer here..."></textarea><p class="muted">Your response is for practice. It is not sent or automatically assessed.</p><button class="secondary" id="sampleBtn">Show a model answer</button><div class="lessonbox hidden" id="sample"><strong>One possible answer</strong><p>${esc(l.writing.sample)}</p><p>Compare the structure and ideas, not just the exact words.</p></div><h3>Self-check</h3>${l.writing.checks.map(c=>`<label class="check"><input type="checkbox"> ${esc(c)}</label>`).join('')}<p class="footer">Progress is stored in this browser. Draft writing is not saved.</p>`;document.getElementById('sv').onclick=()=>{showSwedish=!showSwedish;const draft=document.getElementById('draft').value;render();document.getElementById('draft').value=draft};document.getElementById('sampleBtn').onclick=()=>document.getElementById('sample').classList.toggle('hidden');document.getElementById('grade').onclick=grade;drawQuestions()}function drawQuestions(){let l=LESSONS[current];document.getElementById('questions').innerHTML=l.questions.map((q,i)=>`<div class="question"><h3>${i+1}. ${esc(q.q)}</h3>${q.options.map((o,j)=>`<button class="option ${answers[i]===j?'selected':''}" data-q="${i}" data-a="${j}" ${attempted?'disabled':''}>${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}<div id="fb${i}"></div></div>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[+b.dataset.q]=+b.dataset.a;drawQuestions()})}function grade(){let l=LESSONS[current];if(Object.keys(answers).length<l.questions.length){document.getElementById('result').innerHTML='<div class="feedback bad">Answer all six questions before checking.</div>';return}attempted=true;drawQuestions();let score=0;l.questions.forEach((q,i)=>{let ok=answers[i]===q.answer;if(ok)score++;document.getElementById('fb'+i).innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'✓ Correct.':'Not yet. Correct answer: '+esc(q.options[q.answer])+'.'} ${esc(q.feedback)}</div>`});let pct=Math.round(score/l.questions.length*100),passed=pct>=80;document.getElementById('result').innerHTML=`<div class="feedback ${passed?'good':'bad'}"><strong>${score}/6 (${pct}%)</strong> — ${passed?'Well done! You have passed this lesson.':'You need at least 80% (5 out of 6). Review the explanations and try again.'}</div><div class="row" style="margin-top:12px"><button class="secondary" id="retry">Try again</button>${passed&&current<5?'<button class="primary" id="next">Next lesson →</button>':''}${passed&&current===5?'<strong>🎉 Module 10 complete!</strong>':''}</div>`;if(passed){if(!progress.done.includes(current))progress.done.push(current);progress.unlocked=Math.max(progress.unlocked,Math.min(current+1,5));save();document.getElementById('bar').style.width=(progress.done.length/6*100)+'%';document.getElementById('progressText').textContent=progress.done.length+' of 6 lessons completed';document.querySelectorAll('[data-go]').forEach(b=>{if(+b.dataset.go<=progress.unlocked)b.disabled=false});}document.getElementById('retry').onclick=()=>{answers={};attempted=false;drawQuestions();document.getElementById('result').innerHTML=''};let n=document.getElementById('next');if(n)n.onclick=()=>{current++;answers={};attempted=false;showSwedish=false;render()}}document.getElementById('reset').onclick=()=>{if(confirm('Reset all progress for Module 10 on this browser?')){progress={unlocked:0,done:[]};current=0;answers={};attempted=false;save();render()}};render();</script></body></html>
