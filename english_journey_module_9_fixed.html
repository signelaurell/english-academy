<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Journey · Writing Better Texts</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fc;color:#24314b;font-family:Inter,system-ui,Arial,sans-serif}.top{background:linear-gradient(115deg,#30345d,#6953a8);color:white;padding:26px max(22px,calc((100vw - 1080px)/2))}.top small{letter-spacing:2px;font-weight:700}.top h1{margin:7px 0;font-size:30px}.layout{max-width:1080px;margin:25px auto;display:grid;grid-template-columns:275px 1fr;gap:22px;padding:0 16px}.panel{background:white;border:1px solid #e3e5f1;border-radius:16px;padding:22px;box-shadow:0 4px 20px #2830500a}.nav button{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border:1px solid #e2e5f2;background:white;border-radius:11px;color:#35415e;cursor:pointer}.nav button.active{border-color:#7464b7;background:#f0ecff;font-weight:700}.nav button:disabled{opacity:.45;cursor:not-allowed}button{font:inherit}.primary{background:#6652a7;color:white;border:0;border-radius:9px;padding:11px 18px;cursor:pointer;font-weight:700}.secondary{background:white;border:1px solid #bbb7d9;border-radius:9px;padding:10px 14px;cursor:pointer}.muted{color:#65718a}.lessonbox{background:#f1f0fb;border-radius:12px;padding:18px;line-height:1.65}.question{border:1px solid #e1e4ef;border-radius:13px;padding:17px;margin-top:14px}.question h3{font-size:16px;margin:0 0 12px}.option{display:block;width:100%;text-align:left;border:1px solid #dfe3ed;background:white;border-radius:9px;margin:7px 0;padding:10px 12px;cursor:pointer}.option.selected{border-color:#6754a9;background:#f1edff}.option:disabled{cursor:default}.feedback{padding:11px;border-radius:9px;margin-top:9px;background:#f1f4fa}.good{background:#e5f7ec;color:#155d38}.bad{background:#fff1e6;color:#8c4117}textarea{width:100%;min-height:110px;border:1px solid #ccd2e2;border-radius:10px;padding:12px;font:inherit;resize:vertical}.check{display:block;margin:9px 0}.progress{height:9px;background:#e6e8f0;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#36a88e}.sectiontitle{margin-top:30px}.hidden{display:none}.tag{display:inline-block;background:#edeaf9;border-radius:30px;padding:5px 10px;font-size:12px;color:#55459b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#result{margin-top:16px}.footer{font-size:12px;color:#7b8498;margin-top:18px}@media(max-width:720px){.layout{grid-template-columns:1fr}.top h1{font-size:25px}}</style><style id="academy2-css">.academy-back{position:relative;z-index:10;padding:12px 22px;background:#171027;color:#e9d5ff;font:700 14px system-ui}.academy-back a{color:#e9d5ff;text-decoration:none}.academy-back a:hover{text-decoration:underline}.academy-bottom{margin-top:32px}.academy-status{margin:12px 0 0;font:600 12px system-ui;color:#cbb5e5}.academy-status-line{display:flex;justify-content:space-between;gap:8px}.academy-track{height:7px;border-radius:9px;background:#4d3766;overflow:hidden;margin-top:8px}.academy-track>div{height:100%;background:#ae72ff;border-radius:9px}.academy-mastered{border-color:#22c55e!important;background:linear-gradient(140deg,#16452d,#10291e)!important}.academy-mastered .academy-status{color:#9cf4b4}.academy-mastered .academy-track>div{background:#22c55e}.academy-celebration{position:fixed;inset:0;z-index:99999;background:#080411c9;display:grid;place-items:center;padding:20px}.academy-pop{width:min(440px,100%);padding:38px 25px;text-align:center;border:2px solid #a78bfa;border-radius:24px;background:#25143d;color:#fff;box-shadow:0 0 90px #a855f755;font-family:system-ui}.academy-pop h2{font-size:25px;color:#e9c5ff}.academy-pop p{font-size:18px;line-height:1.5}.academy-pop button{border:0;border-radius:12px;background:#a78bfa;color:#160b2a;font-weight:800;padding:14px 22px;cursor:pointer}</style></head><body><header class="top"><small>ENGLISH JOURNEY · MODULE 9</small><h1>Writing Better Texts</h1><div>Develop your ideas. Make every sentence count.</div></header><div class="layout"><aside class="panel"><h2>Your learning path</h2><p class="muted">Complete each lesson to unlock the next.</p><div class="progress"><div id="bar"></div></div><p id="progressText" class="muted"></p><nav class="nav" id="nav"></nav><button class="secondary" id="reset">Reset my progress</button></aside><main class="panel" id="main"></main></div><script>const LESSONS={"lessons": [{"title": "Develop Your Ideas", "explain": "A strong paragraph does more than state an opinion. Add a reason, a specific example and an explanation of why it matters.", "sv": "En utvecklad text innehåller inte bara ett påstående utan också en anledning, ett exempel och en förklaring.", "questions": [{"q": "Which sentence best develops “School trips are useful”?", "options": ["School trips are very useful.", "School trips are useful because we can learn outside the classroom, for example by visiting a museum.", "School trips are useful and good."], "answer": 1, "feedback": "The second sentence gives a reason and a specific example."}, {"q": "Which detail best supports “Exercise helps me concentrate”?", "options": ["My shoes are blue.", "I sometimes play games.", "After a short walk, I find it easier to focus on homework."], "answer": 2, "feedback": "The example shows a clear link between exercise and concentration."}, {"q": "Choose the strongest explanation after “I prefer reading on paper.”", "options": ["This is my opinion.", "It helps me avoid notifications and focus on the story.", "Books are books."], "answer": 1, "feedback": "The reason explains the preference clearly."}, {"q": "Which example supports “Volunteering teaches responsibility”?", "options": ["I helped organise equipment every Friday and had to arrive on time.", "Volunteering is interesting.", "My friend likes Fridays."], "answer": 0, "feedback": "A concrete action demonstrates responsibility."}, {"q": "Which sentence adds useful detail to “The concert was exciting”?", "options": ["It was exciting.", "The concert happened.", "The crowd sang along, and the band played our favourite song."], "answer": 2, "feedback": "Specific sights and sounds help readers imagine the event."}, {"q": "Which paragraph is most developed?", "options": ["I like art. It is nice. I like it a lot.", "I enjoy art because it lets me express ideas. For example, I draw comics to tell stories without many words.", "Art is a subject at school."], "answer": 1, "feedback": "It includes an idea, reason and relevant example."}], "writing": {"prompt": "Write 3–4 sentences explaining why a hobby matters to you. Include a reason and a specific example.", "sample": "I enjoy drawing because it helps me relax. For example, I often sketch characters after a busy school day. It gives me time to think creatively.", "checks": ["I give a clear main idea.", "I include a reason.", "I add a specific example."]}}, {"title": "Vary Your Sentences", "explain": "Mix shorter sentences with longer ones. You can start with a time phrase, use because or although, or combine related ideas. Keep the meaning clear.", "sv": "Variera meningsstarter och meningslängd. Använd exempelvis tidsuttryck, because och although utan att göra meningarna otydliga.", "questions": [{"q": "Choose the best combination: “I was tired. I finished my homework.”", "options": ["Although I was tired, I finished my homework.", "I was tired because I finished my homework, although.", "Tired I was finished homework."], "answer": 0, "feedback": "Although expresses a contrast between being tired and finishing."}, {"q": "Which opening adds variety?", "options": ["I went to the park.", "After school, I went to the park.", "I park went after."], "answer": 1, "feedback": "The time phrase creates a different sentence opening."}, {"q": "Combine: “The film was long. It was interesting.”", "options": ["The film was long because interesting.", "The film was long and it was film.", "The film was long, but it was interesting."], "answer": 2, "feedback": "But links contrasting descriptions naturally."}, {"q": "Which sentence uses because correctly?", "options": ["I stayed inside because it was raining.", "Because raining I inside stayed.", "I because stayed it was raining inside."], "answer": 0, "feedback": "Because introduces the reason for staying inside."}, {"q": "Which revision avoids repetitive starts?", "options": ["I woke up. I ate breakfast. I went out.", "After breakfast, I went out for a walk.", "I woke up and I ate breakfast and I went out and I walked and I came back."], "answer": 1, "feedback": "A time phrase and concise structure improve flow."}, {"q": "Which sentence expresses contrast clearly?", "options": ["Although it was cold, we went swimming.", "Although it was cold, but we went swimming.", "Although cold we swimming went."], "answer": 0, "feedback": "Although already signals contrast; adding but is unnecessary."}], "writing": {"prompt": "Write 3 sentences about a memorable day. Use two different sentence openings and one contrast.", "sample": "Last Saturday, we visited the coast. Although it was windy, we stayed for hours. At sunset, we took the train home.", "checks": ["I vary my sentence openings.", "I use a contrast word correctly.", "My sentences are clear."]}}, {"title": "Linking Words & Flow", "explain": "Choose linking words for their meaning: because gives a reason; however shows contrast; for example introduces evidence; therefore signals a result.", "sv": "Välj sambandsord utifrån funktionen: orsak, motsättning, exempel eller följd.", "questions": [{"q": "“The bus was late. ___, we missed the start.”", "options": ["However", "As a result", "For example"], "answer": 1, "feedback": "Missing the start is a consequence of the late bus."}, {"q": "“Many students enjoy team sports. ___, football and basketball are popular.”", "options": ["For example", "However", "Therefore"], "answer": 0, "feedback": "The second sentence provides examples."}, {"q": "“I enjoy science. ___, I find some experiments difficult.”", "options": ["Therefore", "For example", "However"], "answer": 2, "feedback": "However introduces a contrasting idea."}, {"q": "“I took an umbrella ___ the forecast predicted rain.”", "options": ["because", "although", "however"], "answer": 0, "feedback": "Because introduces the reason."}, {"q": "“The library was closed. ___, we studied at home.”", "options": ["For example", "Therefore", "Although"], "answer": 1, "feedback": "Therefore signals a result."}, {"q": "“___ I was nervous, I gave my presentation.”", "options": ["Because", "For example", "Although"], "answer": 2, "feedback": "Although shows a contrast between feeling nervous and presenting."}], "writing": {"prompt": "Write a short paragraph about a school rule. Use a reason, a contrast and an example.", "sample": "Phones can be useful for learning because they help us find information. However, they can also distract us. For example, notifications may interrupt a lesson.", "checks": ["I use linking words with the right meanings.", "I include an example.", "My ideas follow logically."]}}, {"title": "Paragraph Structure", "explain": "A clear paragraph usually has a topic sentence, supporting detail and a closing or linking sentence. Keep each paragraph focused on one main idea.", "sv": "Ett tydligt stycke har en huvudtanke, stödjande detaljer och gärna en avslutande eller överledande mening.", "questions": [{"q": "Which is the best topic sentence for a paragraph about cycling to school?", "options": ["Cycling to school has several benefits.", "My bike is red.", "Yesterday was Tuesday."], "answer": 0, "feedback": "It introduces the main idea that the paragraph can develop."}, {"q": "Which detail supports “Learning languages opens opportunities”?", "options": ["My classroom has windows.", "Knowing another language can help you speak to people when travelling.", "Some words have six letters."], "answer": 1, "feedback": "The detail directly supports the topic sentence."}, {"q": "Which sentence does NOT belong in a paragraph about healthy sleep?", "options": ["A regular bedtime can help you feel rested.", "Putting your phone away may make it easier to fall asleep.", "My favourite pizza topping is mushrooms."], "answer": 2, "feedback": "The pizza sentence changes the subject."}, {"q": "Which order makes the clearest paragraph?", "options": ["Example → unrelated detail → topic", "Topic sentence → explanation → example", "Closing sentence → new topic → example"], "answer": 1, "feedback": "Start with the main idea, then develop it."}, {"q": "Choose the best concluding sentence for a paragraph about reading for pleasure.", "options": ["That is why reading can be a valuable way to spend free time.", "My friend has a bicycle.", "Books have pages and covers."], "answer": 0, "feedback": "It returns to and sums up the main idea."}, {"q": "Which paragraph stays focused?", "options": ["My town has a park. I like pizza. My shoes are new.", "Music helps me relax. It makes long journeys more enjoyable, and I often listen after school.", "I like music. My dog is small. It rained yesterday."], "answer": 1, "feedback": "Every sentence develops the idea of music as enjoyable or relaxing."}], "writing": {"prompt": "Write a 4-sentence paragraph about a place you like. Begin with a topic sentence.", "sample": "The local park is my favourite place to relax. It has quiet paths and a small lake. I often walk there after school because the fresh air helps me unwind. For these reasons, I enjoy spending time there.", "checks": ["I start with a topic sentence.", "My details stay on topic.", "I finish with a relevant closing sentence."]}}, {"title": "Edit & Improve", "explain": "When editing, check meaning first: Is the idea clear and supported? Then check paragraph flow, sentence variety and language accuracy. Read the text again after changes.", "sv": "Bearbeta i flera steg: innehåll, struktur, variation och sist språklig korrekthet.", "questions": [{"q": "Improve: “The game was good.”", "options": ["The game was good and good.", "The final level was exciting because we had to solve puzzles together.", "Game good was."], "answer": 1, "feedback": "A specific detail and reason make the description stronger."}, {"q": "Edit: “She don’t like noisy places.”", "options": ["She doesn’t like noisy places.", "She not likes noisy places.", "She doesn’t likes noisy places."], "answer": 0, "feedback": "Third-person singular negatives use doesn’t + base verb."}, {"q": "Improve flow: “I studied hard. I passed the test.”", "options": ["I studied hard, so I passed the test.", "I studied hard, but I passed the test.", "I studied hard, for example I passed the test."], "answer": 0, "feedback": "So introduces the result."}, {"q": "Which revision removes unnecessary repetition?", "options": ["The book was interesting, interesting and very interesting.", "The book was interesting because its ending surprised me.", "The interesting book was an interesting book."], "answer": 1, "feedback": "The revision replaces repetition with explanation."}, {"q": "Correct: “Although I was late, but I caught the bus.”", "options": ["Although I was late, I caught the bus.", "Although I was late but caught the bus.", "Although late I, caught the bus."], "answer": 0, "feedback": "Although and but should not be paired this way."}, {"q": "Which editing question focuses on content rather than spelling?", "options": ["Have I supported my main point with an example?", "Have I spelled every word correctly?", "Have I used capital letters?"], "answer": 0, "feedback": "Supporting examples strengthen the content."}], "writing": {"prompt": "Improve this draft in your own words: “My weekend was good. I went out. It was fun.” Add detail and vary the sentences.", "sample": "On Saturday morning, I visited a climbing centre with my cousin. Although I was nervous at first, I enjoyed trying the taller walls. It was especially fun when we reached the top together.", "checks": ["I replace vague words with details.", "I vary sentence structures.", "I check grammar and punctuation."]}}, {"title": "Writing Challenge", "explain": "Bring your skills together: develop ideas, vary sentences, connect them logically, organise a paragraph and edit carefully.", "sv": "Nu använder du allt tillsammans: utveckling, variation, samband, styckeindelning och bearbetning.", "questions": [{"q": "Which opening is best for a paragraph about a hobby?", "options": ["My hobby is good.", "Playing basketball has taught me to cooperate with others.", "Hobbies exist."], "answer": 1, "feedback": "It introduces a focused idea that can be developed."}, {"q": "Which sentence best supports “Online learning can be flexible”?", "options": ["For example, students can replay explanations when they need more time.", "Online learning uses screens.", "Learning is something people do."], "answer": 0, "feedback": "The example shows what flexibility means."}, {"q": "“I wanted to join the club. ___, the meeting time clashed with football.”", "options": ["Therefore", "However", "For example"], "answer": 1, "feedback": "However introduces the obstacle."}, {"q": "Which sentence has the clearest structure?", "options": ["After the match, we celebrated because we had worked hard as a team.", "After match celebrated because team worked we.", "We celebrated after because match the team."], "answer": 0, "feedback": "The sentence uses a clear time phrase and reason."}, {"q": "Which paragraph is strongest?", "options": ["I like my town. It is good. It is very good.", "My town has a library. I have a blue jacket. My friend is tall.", "My town is a great place for teenagers because there are free activities. For example, the library runs a weekly games club."], "answer": 2, "feedback": "It develops one clear idea with a reason and example."}, {"q": "What is the most useful final step before finishing a text?", "options": ["Add difficult words even if they do not fit.", "Read it again to check clarity, structure and accuracy.", "Make every sentence longer."], "answer": 1, "feedback": "A final review helps catch unclear ideas and language mistakes."}], "writing": {"prompt": "Write a paragraph of 5–7 sentences: Should students have more choice in school activities? Give your view, a reason, an example and a contrasting idea.", "sample": "Students should have more choice in school activities because different people enjoy different things. For example, some students prefer art while others enjoy sports. Having options could make school more motivating. However, everyone should still try new activities sometimes. A balance between choice and shared activities would work well.", "checks": ["I state a clear opinion.", "I support it with a reason and example.", "I include a contrasting idea.", "I check organisation and language."]}}]}.lessons;const KEY='english_journey_module_9_progress_v1';let progress;try{progress=JSON.parse(localStorage.getItem(KEY))||{unlocked:0,done:[]}}catch(e){progress={unlocked:0,done:[]}};if(!Array.isArray(progress.done))progress.done=[];let current=Math.min(progress.unlocked,5),answers={},showSwedish=false,attempted=false;function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('bar').style.width=(progress.done.length/6*100)+'%';document.getElementById('progressText').textContent=progress.done.length+' of 6 lessons completed';document.getElementById('nav').innerHTML=LESSONS.map((l,i)=>`<button data-go="${i}" ${i>progress.unlocked?'disabled':''} class="${i===current?'active':''}">${progress.done.includes(i)?'✓ ':i>progress.unlocked?'🔒 ':''}${i+1}. ${esc(l.title)}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{current=+b.dataset.go;answers={};attempted=false;render()});let l=LESSONS[current];document.getElementById('main').innerHTML=`<div class="row"><span class="tag">LESSON ${current+1} / 6</span><span class="muted">~10–15 minutes</span></div><h1>${esc(l.title)}</h1><p class="muted">Read the explanation, practise, and check your understanding.</p><div class="lessonbox"><strong>Learn it!</strong><p>${esc(l.explain)}</p><button class="secondary" id="sv">${showSwedish?'Hide Swedish help':'Visa svensk förklaring'}</button>${showSwedish?`<p lang="sv">${esc(l.sv)}</p>`:''}</div><h2 class="sectiontitle">Try it! <small class="muted">6 questions</small></h2><div id="questions"></div><button class="primary" id="grade">Check my answers</button><div id="result" aria-live="polite"></div><h2 class="sectiontitle">Write & Improve</h2><p>${esc(l.writing.prompt)}</p><textarea id="draft" placeholder="Write your own answer here..."></textarea><p class="muted">Your draft is for practice only. It is not sent to your teacher or automatically assessed.</p><button class="secondary" id="sampleBtn">Show a model answer</button><div class="lessonbox hidden" id="sample"><strong>One possible answer</strong><p>${esc(l.writing.sample)}</p><p>Compare the structure and ideas, not just the exact words.</p></div><h3>Self-check</h3>${l.writing.checks.map(c=>`<label class="check"><input type="checkbox"> ${esc(c)}</label>`).join('')}<p class="footer">Progress is stored in this browser. Draft writing is not saved.</p>`;document.getElementById('sv').onclick=()=>{showSwedish=!showSwedish;const draft=document.getElementById('draft').value;render();document.getElementById('draft').value=draft};document.getElementById('sampleBtn').onclick=()=>document.getElementById('sample').classList.toggle('hidden');document.getElementById('grade').onclick=grade;drawQuestions()}function drawQuestions(){let l=LESSONS[current];document.getElementById('questions').innerHTML=l.questions.map((q,i)=>`<div class="question"><h3>${i+1}. ${esc(q.q)}</h3>${q.options.map((o,j)=>`<button class="option ${answers[i]===j?'selected':''}" data-q="${i}" data-a="${j}" ${attempted?'disabled':''}>${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}<div id="fb${i}"></div></div>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[+b.dataset.q]=+b.dataset.a;drawQuestions()})}function grade(){let l=LESSONS[current];if(Object.keys(answers).length<l.questions.length){document.getElementById('result').innerHTML='<div class="feedback bad">Answer all six questions before checking.</div>';return}attempted=true;drawQuestions();let score=0;l.questions.forEach((q,i)=>{let ok=answers[i]===q.answer;if(ok)score++;document.getElementById('fb'+i).innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'✓ Correct.':'Not yet. Correct answer: '+esc(q.options[q.answer])+'.'} ${esc(q.feedback)}</div>`});let pct=Math.round(score/l.questions.length*100),passed=pct>=80;document.getElementById('result').innerHTML=`<div class="feedback ${passed?'good':'bad'}"><strong>${score}/6 (${pct}%)</strong> — ${passed?'Well done! You have passed this lesson.':'You need at least 80% (5 out of 6). Review the explanations and try again.'}</div><div class="row" style="margin-top:12px"><button class="secondary" id="retry">Try again</button>${passed&&current<5?'<button class="primary" id="next">Next lesson →</button>':''}${passed&&current===5?'<strong>🎉 Module 9 complete!</strong>':''}</div>`;if(passed){if(!progress.done.includes(current))progress.done.push(current);progress.unlocked=Math.max(progress.unlocked,Math.min(current+1,5));save();document.getElementById('bar').style.width=(progress.done.length/6*100)+'%';document.getElementById('progressText').textContent=progress.done.length+' of 6 lessons completed';document.querySelectorAll('[data-go]').forEach(b=>{if(+b.dataset.go<=progress.unlocked)b.disabled=false});}document.getElementById('retry').onclick=()=>{answers={};attempted=false;drawQuestions();document.getElementById('result').innerHTML=''};let n=document.getElementById('next');if(n)n.onclick=()=>{current++;answers={};attempted=false;showSwedish=false;render()}}document.getElementById('reset').onclick=()=>{if(confirm('Reset all progress for Module 9 on this browser?')){progress={unlocked:0,done:[]};current=0;answers={};attempted=false;save();render()}};render();</script><script>(function(){
const moduleKeys={"english_journey_module_2.html": "english_journey_writing_basics_v1", "english_journey_module_5.html": "english-journey-vocab-v1", "english_journey_module_7.html": "english-journey-module7-v1", "english_journey_module_11.html": "english_journey_module_11_progress_v1", "english_journey_module_8.html": "english-journey-module8-v1", "english_journey_module_9_fixed.html": "english_journey_module_9_progress_v1", "english_journey_module_12_fixed.html": "english_journey_module_12_progress_v1", "english_journey_module_1.html": "english-journey-foundations-v1", "english_journey_module_6.html": "english-journey-module6-v1", "english_journey_module_4.html": "englishJourney_grammarInAction_v1", "english_journey_module_10.html": "english_journey_module_10_progress_v1", "english_journey_module_3.html": "englishJourney_readingSkillsI_v1"};
const gameNames=['english_arcade_grammar_rush.html','english_arcade_reading_detective.html','english_arcade_sentence_scramble.html','english_arcade_word_match.html','english_arcade_story_paths.html'];
const gameTitles=['Grammar Rush','Reading Detective','Sentence Scramble','Word Match','Story Paths'];
const prefix='academy2.game.';
function getModule(file){try{let d=JSON.parse(localStorage.getItem(moduleKeys[file])||'{}');let a=d.done||d.completed||[];return Math.min(6,Array.isArray(a)?new Set(a).size:0)}catch(e){return 0}}
function gameCount(file){try{let v=localStorage.getItem('academy3.plays.'+file);return v===null?(localStorage.getItem(prefix+file)==='1'?1:0):Math.max(0,parseInt(v,10)||0)}catch(e){return 0}}
function gameDone(file){return gameCount(file)>0}
function celebration(title){let wrap=document.createElement('div');wrap.className='academy-celebration';wrap.innerHTML='<div class="academy-pop"><div style="font-size:52px">🏆 ✨ 🎉</div><h2>ACHIEVEMENT UNLOCKED!</h2><p></p><button type="button">Awesome! ✨</button></div>';wrap.querySelector('p').textContent='Well done! You have mastered '+title+'!';wrap.querySelector('button').onclick=()=>wrap.remove();document.body.append(wrap)}
function award(id,title){try{let k='academy2.achievement.'+id;if(!localStorage.getItem(k)){localStorage.setItem(k,'1');celebration(title)}}catch(e){}}
function checkAchievements(){let all=Object.keys(moduleKeys),grammar=all.filter(x=>/module_(1|4|8|11)\.html$/.test(x));if(grammar.every(x=>getModule(x)===6))award('grammar','all grammar modules');if(all.every(x=>getModule(x)===6))award('allmodules','all course modules');if(gameNames.every(gameDone))award('arcade','all arcade games');if(all.every(x=>getModule(x)===6)&&gameNames.every(gameDone))award('academy','English Academy')}
function markGame(file){try{let key='academy3.plays.'+file;localStorage.setItem(key,String(gameCount(file)+1))}catch(e){}checkAchievements()}
function renderHome(){document.querySelectorAll('a.card[href]').forEach(card=>{let file=card.getAttribute('href');let isModule=!!moduleKeys[file],isGame=gameNames.includes(file);if(!isModule&&!isGame)return;let n=isModule?getModule(file):gameCount(file);card.classList.toggle('academy-mastered',isModule&&n===6);let label=card.querySelector('.academy-status');if(!label){label=document.createElement('div');label.className='academy-status';card.insertBefore(label,card.querySelector('.go'))}if(isModule){label.innerHTML='<div class="academy-status-line"><span>'+(n===6?'✓ Mastered!':n+' / 6 lessons completed')+'</span><span>'+Math.round(n/6*100)+'%</span></div><div class="academy-track"><div style="width:'+Math.round(n/6*100)+'%"></div></div>'}else{label.innerHTML='<div class="academy-status-line"><span>🎮 '+n+' '+(n===1?'time':'times')+' played</span><span>'+(n?'Keep playing!':'Ready to play')+'</span></div>';}});let n=Object.keys(moduleKeys).reduce((a,x)=>a+getModule(x),0);let banner=document.getElementById('academy-overview');if(banner)banner.textContent='Your journey: '+n+' / 72 lessons completed · '+gameNames.reduce((a,x)=>a+gameCount(x),0)+' arcade rounds played';checkAchievements()}
window.Academy2={markGame,checkAchievements,renderHome};
if(document.body.querySelector('a.card[href]')){renderHome();window.addEventListener('pageshow',renderHome)}
else {let bar=document.createElement('div');bar.className='academy-back';bar.innerHTML='<a href="index.html">← Back to English Academy</a>';document.body.prepend(bar);let bottom=bar.cloneNode(true);bottom.className+=' academy-bottom';document.body.append(bottom);let file=location.pathname.split('/').pop();if(moduleKeys[file]){let old=getModule(file);setInterval(()=>{let now=getModule(file);if(now>old){old=now;if(now===6){award('module-'+file,document.title.replace(/\s*[|–-].*$/,'')||'this module');checkAchievements()}}},1300)}}
})();</script></body></html>
