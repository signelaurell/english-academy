<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Journey · Writing with Purpose</title><style>:root{font-family:Inter,system-ui,Arial,sans-serif;color:#23304c;background:#f5f6fc}*{box-sizing:border-box}body{margin:0}.top{background:linear-gradient(120deg,#30345d,#6651a8);color:white;padding:24px max(20px,calc((100vw - 1000px)/2))}.top h1{margin:5px 0;font-size:29px}.top small{opacity:.85}main{max-width:1000px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:260px 1fr;gap:20px}.panel{background:white;border:1px solid #e1e4f0;border-radius:17px;padding:23px;box-shadow:0 4px 15px #28315d0b}.nav button{display:block;width:100%;text-align:left;margin:9px 0;padding:13px;border:1px solid #e0e4ef;background:#fafbff;border-radius:11px;color:#293557;cursor:pointer}.nav button.active{background:#eee9ff;border-color:#a99ae8}.nav button:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-block;background:#e9e4fb;color:#5c4498;border-radius:20px;padding:5px 11px;font-size:12px;font-weight:700}.progress{height:9px;background:#e9eaf2;border-radius:9px;overflow:hidden;margin:13px 0}.progress>div{height:100%;background:#7461c8}.lesson h2{font-size:27px;margin:10px 0}.intro{color:#65718a}.learn{background:#f3f0ff;border-left:4px solid #8c75d6;border-radius:10px;padding:17px;margin:20px 0;white-space:pre-line;line-height:1.65}.task{border-top:1px solid #e7e8f0;padding:19px 0}.task p{font-weight:600}.options{display:grid;gap:9px}.options button{border:1px solid #dfe2ee;background:white;padding:12px;text-align:left;border-radius:9px;cursor:pointer;color:#263252;font-size:15px}.options button.selected{border-color:#7561c6;background:#eeeaff}.options button.good{background:#e5f6eb;border-color:#62ae7b}.options button.bad{background:#fff0ed;border-color:#d38a80}.feedback{margin-top:9px;color:#4c5870;font-size:14px}.primary,.secondary{border:0;background:#6754b3;color:white;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}.secondary{background:#eee9ff;color:#574298}.primary:disabled{opacity:.5;cursor:not-allowed}.sw{margin-top:8px}.write{width:100%;min-height:135px;border:1px solid #d7dbea;border-radius:10px;padding:13px;font:inherit;resize:vertical}.checklist label{display:block;margin:10px 0}.score{background:#f1f9f4;padding:15px;border-radius:10px;margin:15px 0}.footer{font-size:12px;color:#7b8599;margin-top:25px}button:focus-visible,textarea:focus-visible{outline:3px solid #a28ce7}@media(max-width:740px){main{grid-template-columns:1fr}.top{padding:20px}.panel{padding:18px}}</style><style id="academy2-css">.academy-back{position:relative;z-index:10;padding:12px 22px;background:#171027;color:#e9d5ff;font:700 14px system-ui}.academy-back a{color:#e9d5ff;text-decoration:none}.academy-back a:hover{text-decoration:underline}.academy-bottom{margin-top:32px}.academy-status{margin:12px 0 0;font:600 12px system-ui;color:#cbb5e5}.academy-status-line{display:flex;justify-content:space-between;gap:8px}.academy-track{height:7px;border-radius:9px;background:#4d3766;overflow:hidden;margin-top:8px}.academy-track>div{height:100%;background:#ae72ff;border-radius:9px}.academy-mastered{border-color:#22c55e!important;background:linear-gradient(140deg,#16452d,#10291e)!important}.academy-mastered .academy-status{color:#9cf4b4}.academy-mastered .academy-track>div{background:#22c55e}.academy-celebration{position:fixed;inset:0;z-index:99999;background:#080411c9;display:grid;place-items:center;padding:20px}.academy-pop{width:min(440px,100%);padding:38px 25px;text-align:center;border:2px solid #a78bfa;border-radius:24px;background:#25143d;color:#fff;box-shadow:0 0 90px #a855f755;font-family:system-ui}.academy-pop h2{font-size:25px;color:#e9c5ff}.academy-pop p{font-size:18px;line-height:1.5}.academy-pop button{border:0;border-radius:12px;background:#a78bfa;color:#160b2a;font-weight:800;padding:14px 22px;cursor:pointer}</style></head><body><header class="top"><small>ENGLISH JOURNEY · MODULE 6</small><h1>Writing with Purpose</h1><div>Write clearly. Choose your words. Connect with your reader.</div></header><main><aside class="panel"><b>Your learning path</b><div class="progress"><div id="bar"></div></div><small id="progressLabel"></small><nav class="nav" id="nav"></nav><button class="secondary" id="reset">Reset my progress</button></aside><section class="panel lesson" id="content"></section></main><script>const LESSONS=[{"title": "Writing an Email", "goal": "Learn to write a friendly email with a clear beginning, middle and ending.", "sw": "Ett vänligt mejl behöver en hälsning, ett tydligt innehåll och en avslutning.", "example": "Hi Alex,\nThanks for your message! I would love to visit on Saturday. We could watch a film and make pizza.\nSee you soon,\nSam", "questions": [{"question": "Which opening suits an email to a friend?", "options": ["Dear Sir or Madam,", "Hi Maya,", "To whom it may concern,"], "correct": "Hi Maya,", "feedback": "Use a friendly greeting."}, {"question": "Which sentence clearly explains a plan?", "options": ["It was nice.", "We could meet at the library at two.", "Things are good."], "correct": "We could meet at the library at two.", "feedback": "Give the reader useful details."}, {"question": "Which closing suits a friendly email?", "options": ["Yours faithfully,", "See you soon,", "Respectfully submitted,"], "correct": "See you soon,", "feedback": "Think about your relationship with the reader."}, {"question": "Put these parts in a sensible order.", "options": ["Greeting → message → closing", "Closing → greeting → message", "Message → closing → greeting"], "correct": "Greeting → message → closing", "feedback": "Think about how you begin a conversation."}, {"question": "Which reply answers an invitation clearly?", "options": ["Maybe things.", "Yes, I can come on Friday. Thanks!", "I am a student."], "correct": "Yes, I can come on Friday. Thanks!", "feedback": "Answer the question directly."}], "prompt": "Write a short email to a friend inviting them to do something this weekend. Include when, where and what you will do.", "model": "Hi Noor,\nWould you like to go bowling on Saturday at 3 pm? We can meet outside the sports centre. Let me know!\nSee you,\nJamie"}, {"title": "Describing People & Places", "goal": "Use specific details to help your reader imagine someone or somewhere.", "sw": "Beskriv med konkreta detaljer och varierade adjektiv, inte bara good och nice.", "example": "The small café sits beside a busy street. Inside, warm lights shine above wooden tables. The air smells of fresh bread.", "questions": [{"question": "Which description is most specific?", "options": ["The park is nice.", "The park has tall trees and a quiet lake.", "The park is a place."], "correct": "The park has tall trees and a quiet lake.", "feedback": "Look for details you can picture."}, {"question": "Which detail describes sound?", "options": ["The walls are blue.", "Birds sing outside the window.", "The soup tastes salty."], "correct": "Birds sing outside the window.", "feedback": "Think about what you hear."}, {"question": "Choose the stronger adjective for a very big building.", "options": ["tiny", "enormous", "ordinary"], "correct": "enormous", "feedback": "Choose a word that matches the size."}, {"question": "Which sentence shows rather than simply tells?", "options": ["She was nervous.", "Her hands shook as she opened the door.", "She had feelings."], "correct": "Her hands shook as she opened the door.", "feedback": "Actions can reveal emotions."}, {"question": "Which order makes a description easy to follow?", "options": ["Jump randomly between details", "Move from general impression to specific details", "Repeat the same sentence"], "correct": "Move from general impression to specific details", "feedback": "Guide the reader through the scene."}], "prompt": "Describe a place you know in 4–6 sentences. Include at least three specific details and two different senses.", "model": "My favourite place is a little beach near my home. Smooth stones cover the shore. I can hear waves against the rocks. In summer, the air smells of the sea. I go there when I want to relax."}, {"title": "Expressing Opinions", "goal": "State an opinion, give a reason and support it with an example.", "sw": "En åsikt blir tydligare när du motiverar den och ger ett konkret exempel.", "example": "I think schools should offer more creative activities because students learn in different ways. For example, making a short film can help students practise teamwork and English.", "questions": [{"question": "Which phrase introduces an opinion?", "options": ["For example,", "In my opinion,", "After that,"], "correct": "In my opinion,", "feedback": "Look for a phrase that signals a viewpoint."}, {"question": "Which sentence gives a reason?", "options": ["I like reading.", "I like reading because stories help me relax.", "Reading exists."], "correct": "I like reading because stories help me relax.", "feedback": "A reason explains why."}, {"question": "Which phrase introduces an example?", "options": ["For example,", "However,", "Finally,"], "correct": "For example,", "feedback": "Examples make reasons more concrete."}, {"question": "Which response respectfully disagrees?", "options": ["That is stupid.", "I see your point, but I disagree.", "You are wrong and silly."], "correct": "I see your point, but I disagree.", "feedback": "Disagree with the idea, not the person."}, {"question": "Which is the strongest argument?", "options": ["Homework is bad.", "I dislike homework, and that is all.", "Shorter homework could leave more time for sleep and hobbies."], "correct": "Shorter homework could leave more time for sleep and hobbies.", "feedback": "A useful argument explains a possible effect."}], "prompt": "Write 4–6 sentences: Should students be allowed to listen to music while working? Give your opinion, a reason and an example.", "model": "I think students should sometimes be allowed to listen to music while working. Quiet music can help some people concentrate. For example, I find it easier to write when there is no talking around me. However, music should not disturb other students."}, {"title": "Formal & Informal English", "goal": "Choose language that fits your audience and purpose.", "sw": "Språket behöver anpassas efter mottagare och situation.", "example": "To a friend: Hey! Can you send me the notes?\nTo a teacher: Hello, could you please send me the notes from yesterday’s lesson?", "questions": [{"question": "Which greeting is most suitable for a teacher you do not know well?", "options": ["Yo!", "Dear Ms Taylor,", "Hey buddy!"], "correct": "Dear Ms Taylor,", "feedback": "Consider a respectful tone."}, {"question": "Which request is most polite?", "options": ["Give me that.", "Could you please help me?", "Help now."], "correct": "Could you please help me?", "feedback": "Look for a polite request form."}, {"question": "Which phrase is informal?", "options": ["I would appreciate your reply.", "Thanks a lot!", "I look forward to hearing from you."], "correct": "Thanks a lot!", "feedback": "Think about language used with friends."}, {"question": "Which closing suits a formal email?", "options": ["Cheers,", "Kind regards,", "Catch you later,"], "correct": "Kind regards,", "feedback": "Choose a professional closing."}, {"question": "Which sentence is appropriate for a school application?", "options": ["I wanna join cos it looks cool.", "I would like to join because I am interested in the project.", "This thing seems kinda fun."], "correct": "I would like to join because I am interested in the project.", "feedback": "Avoid slang and contractions in a formal application."}], "prompt": "Rewrite this message as a polite email to a teacher: “hey i missed class send the homework thx”", "model": "Dear Mr Brown,\nI was absent from class yesterday. Could you please tell me what homework I need to complete?\nThank you for your help.\nKind regards,\nAlex"}, {"title": "Planning & Improving Texts", "goal": "Plan a clear beginning, middle and ending, then revise your draft.", "sw": "Planera först. Kontrollera sedan innehåll, struktur och språk i olika steg.", "example": "Plan: 1. Introduce the topic. 2. Explain two ideas with examples. 3. End with a clear conclusion.\nRevision: Check if each sentence helps your reader understand your message.", "questions": [{"question": "What should you do before writing a longer text?", "options": ["Make a short plan", "Check every comma", "Write the last sentence first"], "correct": "Make a short plan", "feedback": "Think about organising your ideas."}, {"question": "Which sentence improves a vague description?", "options": ["The trip was good.", "We visited a castle and learned about its history.", "The trip happened."], "correct": "We visited a castle and learned about its history.", "feedback": "Specific information helps readers."}, {"question": "Which linking word signals contrast?", "options": ["because", "however", "also"], "correct": "however", "feedback": "Contrast shows a difference between ideas."}, {"question": "What is useful during revision?", "options": ["Only count the words", "Check whether ideas are clear and connected", "Delete every adjective"], "correct": "Check whether ideas are clear and connected", "feedback": "Focus on the reader."}, {"question": "Which conclusion fits an opinion text?", "options": ["That is why I believe outdoor lessons are valuable.", "My name is Alex.", "For example, there are trees."], "correct": "That is why I believe outdoor lessons are valuable.", "feedback": "A conclusion returns to the main point."}], "prompt": "Write a short paragraph about an activity you recommend. Plan your main idea, two reasons and a final sentence before writing.", "model": "I recommend trying photography. First, it helps you notice small details in everyday life. It is also a creative activity you can do almost anywhere. For example, you can take interesting photos in your own neighbourhood. That is why I think photography is worth trying."}, {"title": "Writing Challenge", "goal": "Use what you have learned about purpose, audience, structure and language.", "sw": "Sluttestet blandar färdigheterna från hela modulen.", "example": "Read each question carefully. Think about who will read the text and what the writer wants to communicate.", "questions": [{"question": "Which opening fits an email to a friend?", "options": ["Dear Hiring Manager,", "Hi Leo,", "Dear Principal,"], "correct": "Hi Leo,", "feedback": "Match the greeting to the audience."}, {"question": "Which sentence uses a specific detail?", "options": ["The room was nice.", "Sunlight fell across the green sofa.", "It was a room."], "correct": "Sunlight fell across the green sofa.", "feedback": "Picture the scene."}, {"question": "Which phrase introduces a reason?", "options": ["because", "finally", "hello"], "correct": "because", "feedback": "Think about explaining why."}, {"question": "Which sentence politely asks for help?", "options": ["Help me now!", "Could you please explain the task?", "You must tell me."], "correct": "Could you please explain the task?", "feedback": "Consider tone."}, {"question": "Which structure suits a short opinion paragraph?", "options": ["Opinion → reason → example → conclusion", "Conclusion → greeting → question", "Example → random detail → greeting"], "correct": "Opinion → reason → example → conclusion", "feedback": "Organise ideas logically."}, {"question": "Which phrase shows contrast?", "options": ["also", "however", "for example"], "correct": "however", "feedback": "Think about opposing ideas."}, {"question": "Which is the clearest invitation?", "options": ["We should do stuff.", "Would you like to meet at the park on Sunday at 2 pm?", "It might be good."], "correct": "Would you like to meet at the park on Sunday at 2 pm?", "feedback": "Include practical details."}, {"question": "Which closing suits a formal email?", "options": ["See ya!", "Kind regards,", "Later!"], "correct": "Kind regards,", "feedback": "Consider a professional tone."}, {"question": "Which revision makes a sentence stronger?", "options": ["It was fun.", "We laughed as we raced across the wet grass.", "It was very very fun."], "correct": "We laughed as we raced across the wet grass.", "feedback": "Look for vivid details."}, {"question": "Which sentence includes an example supporting an opinion?", "options": ["I think sports are useful.", "For example, team games can teach cooperation.", "Sports are sports."], "correct": "For example, team games can teach cooperation.", "feedback": "Examples support claims."}], "prompt": "Final writing task: Write a short email to a friend recommending a place to visit. Give two reasons and include a friendly opening and closing.", "model": "Hi Mia,\nYou should visit the science museum this weekend! The experiments are fun, and you can try many of them yourself. There is also a brilliant space exhibition. I think you would love it.\nSee you soon,\nRobin"}];const KEY='english-journey-module6-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{unlocked:0,completed:[]}}catch(e){state={unlocked:0,completed:[]}};state.unlocked=Math.max(0,Math.min(5,state.unlocked||0));state.completed=Array.isArray(state.completed)?state.completed:[];let current=0,answers={},showSw=false,showExample=false,checks={};const $=s=>document.querySelector(s);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}function render(){const nav=$('#nav');nav.replaceChildren();LESSONS.forEach((l,i)=>{const b=el('button',i===current?'active':'',`${state.completed.includes(i)?'✓':i>state.unlocked?'🔒':'○'}  ${i+1}. ${l.title}`);b.disabled=i>state.unlocked;b.onclick=()=>{current=i;answers={};checks={};showExample=false;showSw=false;render()};nav.append(b)});$('#bar').style.width=(state.completed.length/6*100)+'%';$('#progressLabel').textContent=`${state.completed.length} of 6 lessons completed`;const l=LESSONS[current],c=$('#content');c.replaceChildren();c.append(el('span','pill',`LESSON ${current+1} OF 6`),el('h2','',l.title),el('p','intro',l.goal));const box=el('div','learn');box.append(el('b','', 'LEARN IT!'),el('div','',l.example));const sw=el('button','secondary sw',showSw?'Hide Swedish support':'Visa svensk förklaring');sw.onclick=()=>{showSw=!showSw;render()};box.append(sw);if(showSw)box.append(el('p','',l.sw));c.append(box,el('h3','','TRY IT!'));l.questions.forEach((q,i)=>{const task=el('div','task');task.append(el('p','',`${i+1}. ${q.question}`));const opts=el('div','options');q.options.forEach(option=>{let cls=answers[i]===option?'selected':'';if(answers[i]!==undefined&&answers[i]===option)cls=option===q.correct?'good':'bad';const b=el('button',cls,option);b.onclick=()=>{answers[i]=option;render()};opts.append(b)});task.append(opts);if(answers[i]!==undefined){task.append(el('div','feedback',answers[i]===q.correct?'✓ Correct! '+q.feedback:'Not quite. '+q.feedback+' Try another answer.'))}c.append(task)});const right=l.questions.filter((q,i)=>answers[i]===q.correct).length;const total=l.questions.length;const score=el('div','score',`Practice score: ${right}/${total} (${Math.round(100*right/total)}%). You need at least 80% to continue.`);c.append(score,el('h3','','WRITE & IMPROVE'),el('p','',l.prompt));const area=el('textarea','write');area.placeholder='Write your answer here. It stays on this page and is not submitted or saved.';area.value=window.drafts?.[current]||'';area.oninput=()=>{window.drafts=window.drafts||{};window.drafts[current]=area.value};c.append(area);const exampleBtn=el('button','secondary sw',showExample?'Hide example':'Show example answer');exampleBtn.onclick=()=>{showExample=!showExample;render()};c.append(exampleBtn);if(showExample)c.append(el('div','learn',l.model));c.append(el('h3','','SELF-CHECK'));const checkList=el('div','checklist');['I answered the task and included enough detail.','My writing has a clear beginning and ending.','I checked grammar, spelling and punctuation.'].forEach((s,i)=>{const lab=el('label');const cb=el('input');cb.type='checkbox';cb.checked=!!checks[i];cb.onchange=()=>{checks[i]=cb.checked};lab.append(cb,document.createTextNode(' '+s));checkList.append(lab)});c.append(checkList);const btn=el('button','primary',state.completed.includes(current)?'Lesson completed ✓':current===5?'Complete module':'Complete lesson →');btn.disabled=right<Math.ceil(total*.8);btn.onclick=()=>{if(!state.completed.includes(current))state.completed.push(current);state.unlocked=Math.min(5,Math.max(state.unlocked,current+1));save();if(current<5)current++;answers={};checks={};showExample=false;showSw=false;render();window.scrollTo(0,0)};c.append(btn);if(state.completed.includes(5))c.append(el('div','score','🎉 Module complete! Great work. You are ready for the next module.'));c.append(el('div','footer','Your quiz progress is saved in this browser. Written drafts are not stored or sent anywhere. Open writing tasks use self-review rather than automatic AI assessment.'))}$('#reset').onclick=()=>{if(confirm('Reset all progress for Module 6?')){state={unlocked:0,completed:[]};save();current=0;answers={};render()}};render();</script><script>(function(){
const moduleKeys={"english_journey_module_2.html": "english_journey_writing_basics_v1", "english_journey_module_5.html": "english-journey-vocab-v1", "english_journey_module_7.html": "english-journey-module7-v1", "english_journey_module_11.html": "english_journey_module_11_progress_v1", "english_journey_module_8.html": "english-journey-module8-v1", "english_journey_module_9_fixed.html": "english_journey_module_9_progress_v1", "english_journey_module_12_fixed.html": "english_journey_module_12_progress_v1", "english_journey_module_1.html": "english-journey-foundations-v1", "english_journey_module_6.html": "english-journey-module6-v1", "english_journey_module_4.html": "englishJourney_grammarInAction_v1", "english_journey_module_10.html": "english_journey_module_10_progress_v1", "english_journey_module_3.html": "englishJourney_readingSkillsI_v1"};
const gameNames=['english_arcade_grammar_rush.html','english_arcade_reading_detective.html','english_arcade_sentence_scramble.html','english_arcade_word_match.html','english_arcade_story_paths.html'];
const gameTitles=['Grammar Rush','Reading Detective','Sentence Scramble','Word Match','Story Paths'];
const prefix='academy2.game.';
function getModule(file){try{let d=JSON.parse(localStorage.getItem(moduleKeys[file])||'{}');let a=d.done||d.completed||[];return Math.min(6,Array.isArray(a)?new Set(a).size:0)}catch(e){return 0}}
function gameCount(file){try{let v=localStorage.getItem('academy3.plays.'+file);return v===null?(localStorage.getItem(prefix+file)==='1'?1:0):Math.max(0,parseInt(v,10)||0)}catch(e){return 0}}
function gameDone(file){return gameCount(file)>0}
function celebration(title){let wrap=document.createElement('div');wrap.className='academy-celebration';wrap.innerHTML='<div class="academy-pop"><div style="font-size:52px">🏆 ✨ 🎉</div><h2>ACHIEVEMENT UNLOCKED!</h2><p></p><button type="button">Awesome! ✨</button></div>';wrap.querySelector('p').textContent='Well done! You have mastered '+title+'!';wrap.querySelector('button').onclick=()=>wrap.remove();document.body.append(wrap)}
function award(id,title){try{let k='academy2.achievement.'+id;if(!localStorage.getItem(k)){localStorage.setItem(k,'1');celebration(title)}}catch(e){}}
function checkAchievements(){let all=Object.keys(moduleKeys),grammar=all.filter(x=>/module_(1|4|8|11)\.html$/.test(x));if(grammar.every(x=>getModule(x)===6))award('grammar','all grammar modules');if(all.every(x=>getModule(x)===6))award('allmodules','all course modules');if(gameNames.every(gameDone))award('arcade','all arcade games');if(all.every(x=>getModule(x)===6)&&gameNames.every(gameDone))award('academy','English Academy')}
function markGame(file){try{let key='academy3.plays.'+file;localStorage.setItem(key,String(gameCount(file)+1))}catch(e){}checkAchievements()}
function renderHome(){document.querySelectorAll('a.card[href]').forEach(card=>{let file=card.getAttribute('href');let isModule=!!moduleKeys[file],isGame=gameNames.includes(file);if(!isModule&&!isGame)return;let n=isModule?getModule(file):gameCount(file);card.classList.toggle('academy-mastered',isModule&&n===6);let label=card.querySelector('.academy-status');if(!label){label=document.createElement('div');label.className='academy-status';card.insertBefore(label,card.querySelector('.go'))}if(isModule){label.innerHTML='<div class="academy-status-line"><span>'+(n===6?'✓ Mastered!':n+' / 6 lessons completed')+'</span><span>'+Math.round(n/6*100)+'%</span></div><div class="academy-track"><div style="width:'+Math.round(n/6*100)+'%"></div></div>'}else{label.innerHTML='<div class="academy-status-line"><span>🎮 '+n+' '+(n===1?'time':'times')+' played</span><span>'+(n?'Keep playing!':'Ready to play')+'</span></div>';}});let n=Object.keys(moduleKeys).reduce((a,x)=>a+getModule(x),0);let banner=document.getElementById('academy-overview');if(banner)banner.textContent='Your journey: '+n+' / 72 lessons completed · '+gameNames.reduce((a,x)=>a+gameCount(x),0)+' arcade rounds played';checkAchievements()}
window.Academy2={markGame,checkAchievements,renderHome};
if(document.body.querySelector('a.card[href]')){renderHome();window.addEventListener('pageshow',renderHome)}
else {let bar=document.createElement('div');bar.className='academy-back';bar.innerHTML='<a href="index.html">← Back to English Academy</a>';document.body.prepend(bar);let bottom=bar.cloneNode(true);bottom.className+=' academy-bottom';document.body.append(bottom);let file=location.pathname.split('/').pop();if(moduleKeys[file]){let old=getModule(file);setInterval(()=>{let now=getModule(file);if(now>old){old=now;if(now===6){award('module-'+file,document.title.replace(/\s*[|–-].*$/,'')||'this module');checkAchievements()}}},1300)}}
})();</script></body></html>
