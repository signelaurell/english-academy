<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Journey | Reading Skills I</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1d2941;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}header{background:#182b52;color:white;padding:20px max(20px,calc((100vw - 1080px)/2))}header small{color:#b8c9ef}main{max-width:1080px;margin:auto;padding:26px 18px 80px}.hero{margin-bottom:20px}.hero h1{margin:8px 0}.layout{display:grid;grid-template-columns:270px 1fr;gap:20px}.panel{background:white;border:1px solid #dce3f1;border-radius:17px;padding:22px;box-shadow:0 5px 20px #182b5208}.navbtn{width:100%;border:1px solid #e2e7f1;border-radius:11px;background:white;text-align:left;padding:13px;margin:5px 0;color:#243456;cursor:pointer}.navbtn.active{border-color:#536dc6;background:#eef2ff}.navbtn:disabled{opacity:.5;cursor:not-allowed}.muted{color:#63708b}.small{font-size:.85rem}.progress{height:9px;border-radius:9px;background:#e5eaf3;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#36a78d;transition:width .2s}.lesson-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{background:#eaf2ff;border-radius:50px;padding:6px 12px;font-size:.8rem;color:#344c8b}.intro,.passage,.feedback,.help{padding:18px;border-radius:12px;margin:18px 0;line-height:1.65}.intro{background:#edf2ff}.passage{background:#f7f9fc;border:1px solid #e2e7f1}.passage h3{margin-top:0}.passage p{margin:10px 0}.feedback.good{background:#e7f8ef;color:#166444}.feedback.bad{background:#fff3e4;color:#754c0b}.help{background:#f0f6ff}.task{border-top:1px solid #e3e7ef;padding:18px 0}.task h3{font-size:1rem}.option{display:block;width:100%;text-align:left;background:white;border:1px solid #cbd5e4;border-radius:9px;padding:11px 13px;margin:7px 0;cursor:pointer;font:inherit;color:inherit}.option.selected{border-color:#536dc6;background:#eef2ff}.option:disabled{cursor:default}.btn{border:0;background:#3859b8;color:white;padding:11px 18px;border-radius:10px;font-weight:650;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#e8edfa;color:#273f82}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}input,select{font:inherit;padding:11px;border:1px solid #bdc9db;border-radius:9px;max-width:100%;width:100%}.match-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin:8px 0}.result{background:#eef8f5;padding:20px;border-radius:12px;margin-top:18px}.hidden{display:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a2b6ff;outline-offset:2px}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{padding:16px}.lesson-head{align-items:flex-start}.match-row{grid-template-columns:1fr}}
</style></head><body><header><strong>✦ English Journey</strong><br><small>Learn at your own pace</small></header><main><div class="hero"><div class="muted small">MODULE 3 · READING SKILLS I</div><h1>Read with Confidence</h1><p class="muted">Six short lessons · Immediate feedback · Learn independently</p></div><div class="layout"><aside class="panel"><strong>Your learning path</strong><p class="muted small">Complete each lesson to unlock the next.</p><div class="progress"><div id="bar"></div></div><p id="progressLabel" class="small muted"></p><div id="nav"></div><p class="small muted">Progress is saved in this browser only. Answers are not stored.</p><button class="btn secondary" id="reset">Reset progress</button></aside><section class="panel" id="content" aria-live="polite"></section></div></main><script>
const lessons=[{"title": "Skimming", "sub": "Find the main idea", "intro": "<b>Skimming</b> means reading quickly to understand the main idea. Look at the title, first sentences and repeated ideas. You do not need to understand every word.", "sv": "Skumma texten för att förstå huvudidén. Läs rubrik och början, och leta efter återkommande idéer.", "passage": "<h3>A Different Kind of Lunch</h3><p>Every Wednesday, students at Greenhill School can join a cooking club during lunch. They prepare simple meals together and learn how to use fresh ingredients. Some students come because they enjoy cooking. Others want to meet new friends. Last month, the club made vegetable wraps, pasta salad and fruit smoothies. The teachers say the club helps students become more confident in the kitchen.</p>", "tasks": [{"type": "choice", "question": "What is the text mainly about?", "options": ["A school cooking club", "A restaurant opening", "A difficult exam", "A sports competition"], "answer": "A school cooking club", "why": "Most of the text describes what students do in the cooking club."}, {"type": "choice", "question": "Which title fits the text best?", "options": ["Learning to Cook Together", "The Best Football Team", "A Trip to London", "How to Grow Tomatoes"], "answer": "Learning to Cook Together", "why": "The text focuses on students cooking and learning together."}, {"type": "choice", "question": "Why might a student skim this text?", "options": ["To understand the topic quickly", "To memorise every ingredient", "To count every word", "To check every spelling"], "answer": "To understand the topic quickly", "why": "Skimming helps you get the general idea before reading closely."}, {"type": "choice", "question": "Which detail is NOT the main focus?", "options": ["The exact food made last month", "Students cooking together", "Learning in a club", "Meeting other students"], "answer": "The exact food made last month", "why": "The food examples support the main idea, but they are not the main topic."}, {"type": "choice", "question": "Which sentence best summarises the passage?", "options": ["Students learn cooking skills and socialise at a school club.", "Students must cook lunch every day.", "Teachers have opened a restaurant.", "Students only make fruit smoothies."], "answer": "Students learn cooking skills and socialise at a school club.", "why": "This sentence covers the central ideas without focusing on one small detail."}]}, {"title": "Scanning", "sub": "Find specific details", "intro": "<b>Scanning</b> means searching for one piece of information. Look for names, times, numbers or keywords. Move your eyes through the text until you find the detail.", "sv": "Sök efter en viss uppgift, till exempel ett klockslag, namn eller datum. Du behöver inte läsa varje mening.", "passage": "<h3>Community Sports Day</h3><p>Saturday 14 June · Riverside Park</p><p>10:00 – Welcome and warm-up<br>10:30 – Basketball tournament<br>12:00 – Lunch break<br>13:00 – Skateboard workshop<br>14:30 – Fun run (2 km)<br>15:30 – Prize ceremony</p><p>Bring water and comfortable shoes. The event is free, but please register online by Thursday 12 June. If it rains, the activities will move to the sports hall on Oak Street.</p>", "tasks": [{"type": "choice", "question": "What time does the skateboard workshop begin?", "options": ["10:30", "12:00", "13:00", "14:30"], "answer": "13:00", "why": "The schedule lists the skateboard workshop at 13:00."}, {"type": "choice", "question": "Where will the event take place if it rains?", "options": ["Riverside Park", "Oak Street sports hall", "The town library", "The basketball court"], "answer": "Oak Street sports hall", "why": "The final sentence gives the rainy-weather location."}, {"type": "choice", "question": "How long is the fun run?", "options": ["1 km", "2 km", "3 km", "5 km"], "answer": "2 km", "why": "The schedule says “Fun run (2 km)”."}, {"type": "choice", "question": "What is the registration deadline?", "options": ["Thursday 12 June", "Saturday 14 June", "Friday 13 June", "Monday 16 June"], "answer": "Thursday 12 June", "why": "The registration sentence names Thursday 12 June."}, {"type": "gap", "question": "At what time is the prize ceremony? Type the time as HH:MM.", "answer": "15:30", "alternatives": [], "why": "The last activity in the schedule begins at 15:30."}]}, {"title": "Words in Context", "sub": "Guess meaning from clues", "intro": "When you see an unfamiliar word, read the words <b>before and after</b> it. Look for examples, contrasts and explanations. Make a sensible guess, then check whether it fits.", "sv": "Använd orden runt ett okänt ord för att gissa betydelsen. Leta efter exempel och motsatser.", "passage": "<h3>The Unexpected Visitor</h3><p>Leo was <b>exhausted</b> after walking for three hours. He could hardly keep his eyes open. As he sat on a bench, a <b>tiny</b> dog appeared. It was so small that it could fit inside his backpack. The dog seemed <b>timid</b>: it stayed behind a tree and moved away whenever Leo came closer. Leo waited patiently. After a while, the dog became <b>curious</b> and slowly walked over to sniff his shoes.</p>", "tasks": [{"type": "choice", "question": "What does “exhausted” most likely mean?", "options": ["Very tired", "Very hungry", "Very excited", "Very angry"], "answer": "Very tired", "why": "“Could hardly keep his eyes open” is a clue that Leo is very tired."}, {"type": "choice", "question": "What does “tiny” mean?", "options": ["Very small", "Very loud", "Very fast", "Very dirty"], "answer": "Very small", "why": "The next sentence says the dog could fit inside a backpack."}, {"type": "choice", "question": "Which word best describes “timid”?", "options": ["Shy or nervous", "Friendly and loud", "Angry and dangerous", "Sleepy and calm"], "answer": "Shy or nervous", "why": "The dog hides and moves away when Leo approaches."}, {"type": "choice", "question": "What does “curious” suggest about the dog?", "options": ["It wants to investigate", "It wants to sleep", "It wants to run away", "It wants to bark loudly"], "answer": "It wants to investigate", "why": "The dog comes closer to sniff Leo’s shoes."}, {"type": "match", "question": "Match the context clue to the word.", "pairs": [["Could hardly keep his eyes open", "exhausted"], ["Could fit inside a backpack", "tiny"], ["Stayed behind a tree", "timid"], ["Walked over to sniff", "curious"]], "why": "Each clue helps explain the meaning of a word in the story."}]}, {"title": "Reading Between the Lines", "sub": "Make simple inferences", "intro": "Writers do not always tell you everything directly. An <b>inference</b> is a sensible conclusion based on clues in the text. Ask: “What do I know, and what does that suggest?”", "sv": "Dra slutsatser med stöd i texten. Svaret står inte alltid uttryckligen, men det ska finnas ledtrådar.", "passage": "<h3>The Audition</h3><p>Amira stood outside the music room, holding her guitar case tightly. She had practised the same song every evening for two weeks. When the teacher called her name, she took a deep breath and stepped inside. Her hands shook a little as she began to play. Halfway through the song, she looked up and noticed the teacher smiling. When she finished, Amira walked out with a grin and immediately sent her best friend a message: “I actually did it!”</p>", "tasks": [{"type": "choice", "question": "How does Amira probably feel before playing?", "options": ["Nervous", "Bored", "Angry", "Sleepy"], "answer": "Nervous", "why": "Holding the case tightly, taking a deep breath and shaking hands suggest nerves."}, {"type": "choice", "question": "What suggests that the performance is going well?", "options": ["The teacher smiles", "Amira leaves the building", "Her friend sends a message", "The guitar case is heavy"], "answer": "The teacher smiles", "why": "The teacher’s smile is a positive clue during the performance."}, {"type": "choice", "question": "Why does Amira say “I actually did it!”?", "options": ["She is proud she performed", "She has bought a guitar", "She has finished her homework", "She has won a competition"], "answer": "She is proud she performed", "why": "She seems pleased that she managed to perform despite her nerves."}, {"type": "choice", "question": "Which claim is NOT supported by the text?", "options": ["Amira won first prize", "Amira practised often", "Amira played guitar", "Amira messaged a friend"], "answer": "Amira won first prize", "why": "No result or prize is mentioned, so we cannot conclude that she won."}, {"type": "choice", "question": "Which detail is the strongest clue that Amira feels relieved afterwards?", "options": ["She walks out with a grin", "She holds a guitar case", "The teacher calls her name", "She practises for two weeks"], "answer": "She walks out with a grin", "why": "Her grin after the audition suggests happiness and relief."}]}, {"title": "Understanding Text Structure", "sub": "Follow the order of ideas", "intro": "Look for <b>sequence words</b> (first, next, finally), <b>reasons</b> (because) and <b>contrasts</b> (however). These words show how ideas connect.", "sv": "Leta efter tidsord, orsaker och motsatser för att förstå hur texten hänger ihop.", "passage": "<h3>Our Class Podcast</h3><p>First, our class chose a topic: everyday technology. Next, we worked in small groups and wrote questions for our interviews. We wanted to record outside, but it started raining. Therefore, we moved to the library. After recording, we edited the sound and added a short introduction. Finally, we shared the podcast with our families. We were nervous at first; however, the positive comments made us feel proud.</p>", "tasks": [{"type": "choice", "question": "What did the class do first?", "options": ["Choose a topic", "Edit the sound", "Share the podcast", "Move to the library"], "answer": "Choose a topic", "why": "“First” introduces the earliest step."}, {"type": "choice", "question": "Why did the class move to the library?", "options": ["Because it started raining", "Because they finished editing", "Because families arrived", "Because the topic changed"], "answer": "Because it started raining", "why": "“Therefore” links the rain to their decision to move."}, {"type": "choice", "question": "What does “however” signal in the last sentence?", "options": ["A contrast", "A time", "A place", "A list"], "answer": "A contrast", "why": "“However” contrasts their initial nerves with their later pride."}, {"type": "choice", "question": "What happened immediately after recording?", "options": ["They edited the sound", "They chose a topic", "They wrote questions", "They shared the podcast"], "answer": "They edited the sound", "why": "The text says “After recording, we edited the sound”."}, {"type": "match", "question": "Match each linking word to its function.", "pairs": [["First", "beginning"], ["Next", "following step"], ["Therefore", "result"], ["However", "contrast"]], "why": "These linking words show sequence, result and contrast."}]}, {"title": "Reading Challenge", "sub": "Use all five strategies", "intro": "You have learned to skim, scan, guess word meanings, make inferences and follow text structure. Read the story carefully and use the strategy that fits each question.", "sv": "Sluttest: använd alla fem lässtrategierna. Du kan läsa texten flera gånger.", "passage": "<h3>A Small Idea, a Big Change</h3><p>When Noah joined Westbrook School, he noticed that the playground had very few places to sit. Students often ate lunch on the steps, even when the ground was wet. Noah suggested building benches from old wooden pallets. At first, his classmates were <b>hesitant</b>. They were unsure whether the project would work.</p><p>However, their science teacher offered to help. First, the group made a plan and checked which materials were safe to use. Then, they cleaned the pallets and painted them blue and yellow. The project took three Saturdays to finish.</p><p>On Monday morning, several students were already sitting on the new benches. Noah smiled when he saw them. A week later, the headteacher asked whether the group would like to create some planters too. Noah looked at his friends. This time, nobody hesitated.</p>", "tasks": [{"type": "choice", "question": "What is the main idea of the text?", "options": ["Students improve their school through a project", "A school closes its playground", "A teacher organises a science exam", "Students travel to a new city"], "answer": "Students improve their school through a project", "why": "The story follows a student-led project that makes the school better."}, {"type": "choice", "question": "How many Saturdays did the project take?", "options": ["One", "Two", "Three", "Four"], "answer": "Three", "why": "The second paragraph says the project took three Saturdays."}, {"type": "choice", "question": "What does “hesitant” most likely mean?", "options": ["Unsure about doing something", "Excited to start immediately", "Unable to speak", "Angry with the teacher"], "answer": "Unsure about doing something", "why": "The next sentence explains that the classmates were unsure."}, {"type": "choice", "question": "Why does Noah smile on Monday?", "options": ["He sees students using the benches", "He gets a new phone", "He wins a prize", "He skips his lesson"], "answer": "He sees students using the benches", "why": "The smile follows his seeing other students on the benches."}, {"type": "choice", "question": "What does “However” introduce?", "options": ["A change from doubt to support", "The final result", "The time of day", "The name of a student"], "answer": "A change from doubt to support", "why": "It contrasts classmates’ doubts with the teacher’s offer of help."}, {"type": "choice", "question": "What did the group do before painting?", "options": ["Cleaned the pallets", "Shared the benches", "Made planters", "Asked the headteacher"], "answer": "Cleaned the pallets", "why": "The text says they cleaned and then painted the pallets."}, {"type": "choice", "question": "Which detail shows the project was useful?", "options": ["Students sit on the new benches", "The pallets were old", "The benches were painted", "The teacher liked science"], "answer": "Students sit on the new benches", "why": "Students actually using the benches shows that they meet a need."}, {"type": "choice", "question": "What can we infer from “This time, nobody hesitated”?", "options": ["The group feels more confident", "The group wants to stop", "The school is closing", "The planters are already finished"], "answer": "The group feels more confident", "why": "Their success seems to have made them more willing to try another project."}, {"type": "choice", "question": "Which colour were the benches painted?", "options": ["Blue and yellow", "Green and white", "Red and black", "Orange and purple"], "answer": "Blue and yellow", "why": "The second paragraph names both colours."}, {"type": "choice", "question": "Which summary best captures the ending?", "options": ["The group may take on another project", "The students decide to remove the benches", "Noah leaves the school", "The headteacher cancels the project"], "answer": "The group may take on another project", "why": "The headteacher suggests planters and the group seems ready to help."}]}];
const key='englishJourney_readingSkillsI_v1';
let unlocked=0,completed=[],current=0,answers={},submitted=false,showSwedish=false;
try{const p=JSON.parse(localStorage.getItem(key)||'{}');unlocked=Math.max(0,Math.min(5,Number(p.unlocked)||0));completed=Array.isArray(p.completed)?p.completed.filter(n=>Number.isInteger(n)&&n>=0&&n<6):[]}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify({unlocked,completed}))}catch(e){}}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normal(x){return String(x??'').trim().toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' ')}
function nav(){document.getElementById('bar').style.width=(completed.length/6*100)+'%';document.getElementById('progressLabel').textContent=completed.length+' of 6 lessons completed';document.getElementById('nav').innerHTML=lessons.map((l,i)=>`<button class="navbtn ${i===current?'active':''}" data-nav="${i}" ${i>unlocked?'disabled':''}>${completed.includes(i)?'✓':i>unlocked?'🔒':'○'} ${i+1}. ${esc(l.title)}<br><span class="small muted">${esc(l.sub)}</span></button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{current=+b.dataset.nav;answers={};submitted=false;showSwedish=false;render()})}
function taskHTML(t,i){let body='';if(t.type==='choice'){body=t.options.map((o,j)=>`<button class="option ${answers[i]===o?'selected':''}" data-choice="${i}" data-value="${j}" ${submitted?'disabled':''}>${esc(o)}</button>`).join('')}else if(t.type==='gap'){body=`<input aria-label="Your answer" data-gap="${i}" value="${esc(answers[i]||'')}" ${submitted?'disabled':''} placeholder="Type your answer">`}else if(t.type==='match'){body=t.pairs.map((p,j)=>`<div class="match-row"><span>${esc(p[0])}</span><select aria-label="Match for ${esc(p[0])}" data-match="${i}" data-pair="${j}" ${submitted?'disabled':''}><option value="">Choose a match…</option>${t.pairs.map(z=>z[1]).sort().map(v=>`<option ${answers[i]?.[j]===v?'selected':''} value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>`).join('')}return `<div class="task"><h3>${i+1}. ${esc(t.question)}</h3>${body}${submitted?feedback(t,i):''}</div>`}
function correct(t,i){if(t.type==='choice')return answers[i]===t.answer;if(t.type==='gap')return [t.answer,...(t.alternatives||[])].some(a=>normal(answers[i])===normal(a));if(t.type==='match')return t.pairs.every((p,j)=>answers[i]?.[j]===p[1]);return false}
function feedback(t,i){let ok=correct(t,i);return `<div class="feedback ${ok?'good':'bad'}" role="status"><strong>${ok?'✓ Correct!':'Not quite.'}</strong> ${esc(t.why)}${!ok?`<br><strong>Answer:</strong> ${t.type==='match'?esc(t.pairs.map(p=>p[0]+' → '+p[1]).join('; ')):esc(t.answer)}`:''}</div>`}
function render(){nav();let l=lessons[current];let score=l.tasks.filter((t,i)=>correct(t,i)).length;document.getElementById('content').innerHTML=`<div class="lesson-head"><div><div class="muted small">LESSON ${current+1} OF 6</div><h2>${esc(l.title)}</h2><div class="muted">${esc(l.sub)}</div></div><span class="tag">${completed.includes(current)?'Completed':'Reading'}</span></div><div class="intro"><strong>Learn it!</strong><p>${l.intro}</p><button class="btn secondary" id="sv">${showSwedish?'Hide Swedish explanation':'Visa svensk förklaring'}</button>${showSwedish?`<div class="help">${esc(l.sv)}</div>`:''}</div><div class="passage">${l.passage}</div><h2>Try it!</h2><p class="muted small">Read the text again whenever you need to. Choose or type your answers.</p>${l.tasks.map(taskHTML).join('')}${submitted?`<div class="result"><h3>${score} / ${l.tasks.length} correct · ${Math.round(score/l.tasks.length*100)}%</h3><p>${score/l.tasks.length>=.8?'Great work! You have passed this lesson.':'You need at least 80% to continue. Review the explanations and try again.'}</p></div>`:''}<div class="actions">${!submitted?'<button class="btn" id="check">Check my answers</button>':`<button class="btn secondary" id="retry">Try again</button>${score/l.tasks.length>=.8&&current<5?'<button class="btn" id="next">Next lesson →</button>':''}${score/l.tasks.length>=.8&&current===5?'<strong>🎉 Module complete!</strong>':''}`}</div>`;
document.getElementById('sv').onclick=()=>{showSwedish=!showSwedish;render()};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answers[+b.dataset.choice]=l.tasks[+b.dataset.choice].options[+b.dataset.value];render()});document.querySelectorAll('[data-gap]').forEach(x=>x.oninput=()=>{answers[+x.dataset.gap]=x.value});document.querySelectorAll('[data-match]').forEach(x=>x.onchange=()=>{let i=+x.dataset.match,j=+x.dataset.pair;answers[i]??={};answers[i][j]=x.value});let c=document.getElementById('check');if(c)c.onclick=()=>{submitted=true;score=l.tasks.filter((t,i)=>correct(t,i)).length;if(score/l.tasks.length>=.8){if(!completed.includes(current))completed.push(current);unlocked=Math.max(unlocked,Math.min(5,current+1));save()}render()};let r=document.getElementById('retry');if(r)r.onclick=()=>{answers={};submitted=false;render()};let n=document.getElementById('next');if(n)n.onclick=()=>{current++;answers={};submitted=false;showSwedish=false;render()}}
document.getElementById('reset').onclick=()=>{if(confirm('Reset all progress for Module 3 on this device?')){unlocked=0;completed=[];current=0;answers={};submitted=false;save();render()}};render();
</script></body></html>
