</style><style id="academy2-css">.academy-back{position:relative;z-index:10;padding:12px 22px;background:#171027;color:#e9d5ff;font:700 14px system-ui}.academy-back a{color:#e9d5ff;text-decoration:none}.academy-back a:hover{text-decoration:underline}.academy-bottom{margin-top:32px}.academy-status{margin:12px 0 0;font:600 12px system-ui;color:#cbb5e5}.academy-status-line{display:flex;justify-content:space-between;gap:8px}.academy-track{height:7px;border-radius:9px;background:#4d3766;overflow:hidden;margin-top:8px}.academy-track>div{height:100%;background:#ae72ff;border-radius:9px}.academy-mastered{border-color:#22c55e!important;background:linear-gradient(140deg,#16452d,#10291e)!important}.academy-mastered .academy-status{color:#9cf4b4}.academy-mastered .academy-track>div{background:#22c55e}.academy-celebration{position:fixed;inset:0;z-index:99999;background:#080411c9;display:grid;place-items:center;padding:20px}.academy-pop{width:min(440px,100%);padding:38px 25px;text-align:center;border:2px solid #a78bfa;border-radius:24px;background:#25143d;color:#fff;box-shadow:0 0 90px #a855f755;font-family:system-ui}.academy-pop h2{font-size:25px;color:#e9c5ff}.academy-pop p{font-size:18px;line-height:1.5}.academy-pop button{border:0;border-radius:12px;background:#a78bfa;color:#160b2a;font-weight:800;padding:14px 22px;cursor:pointer}</style></head><body><header><strong>✦ English Journey</strong><br><small>Learn at your own pace</small></header><main><div class="hero"><div class="muted small">MODULE 4 · GRAMMAR IN ACTION</div><h1>Talk About the Past</h1><p class="muted">Six short lessons · Immediate feedback · Learn independently</p></div><div class="layout"><aside class="panel"><strong>Your learning path</strong><p class="muted small">Complete each lesson to unlock the next.</p><div class="progress"><div id="bar"></div></div><p id="progressLabel" class="small muted"></p><div id="nav"></div><p class="small muted">Progress is saved in this browser only. Answers are not stored.</p><button class="btn secondary" id="reset">Reset progress</button></aside><section class="panel" id="content" aria-live="polite"></section></div></main><script>
const lessons=[{"title": "Past Simple: Regular Verbs", "sub": "Talk about finished actions", "intro": "We use the <b>past simple</b> for actions that finished in the past. Most regular verbs end in <b>-ed</b>: play → played, visit → visited. If a verb ends in -e, add -d: live → lived. With consonant + y, change y to -ied: study → studied.", "sv": "Preteritum beskriver något som hände och avslutades. Regelbundna verb får oftast -ed. Verb på -e får -d, och study blir studied.", "passage": "", "tasks": [{"type": "choice", "question": "Yesterday, Mia ___ football after school.", "options": ["plays", "played", "playing", "play"], "answer": "played", "why": "Yesterday signals a finished action, so use played."}, {"type": "gap", "question": "Complete: We ___ (visit) our grandparents last weekend.", "answer": "visited", "alternatives": [], "why": "Visit is regular: add -ed."}, {"type": "choice", "question": "Which sentence is in the past simple?", "options": ["I watch a film.", "I am watching a film.", "I watched a film.", "I will watch a film."], "answer": "I watched a film.", "why": "Watched describes a finished action."}, {"type": "gap", "question": "Complete: They ___ (study) for the test yesterday.", "answer": "studied", "alternatives": [], "why": "Change consonant + y to -ied."}, {"type": "match", "question": "Match each present verb to its past form.", "pairs": [["play", "played"], ["live", "lived"], ["study", "studied"], ["walk", "walked"]], "why": "These are regular past-tense forms."}]}, {"title": "Past Simple: Irregular Verbs", "sub": "Learn common past forms", "intro": "Some verbs are <b>irregular</b>. They do not use -ed. Examples: go → went, see → saw, eat → ate, have → had, buy → bought, take → took. Learn them in short sentences: “I went home at five.”", "sv": "Oregelbundna verb följer inte -ed-regeln. Du behöver lära dig deras preteritumformer, till exempel go → went och have → had.", "passage": "", "tasks": [{"type": "choice", "question": "Last Friday, we ___ to the cinema.", "options": ["go", "went", "goed", "going"], "answer": "went", "why": "Went is the past simple of go."}, {"type": "gap", "question": "Complete: I ___ (see) my cousin yesterday.", "answer": "saw", "alternatives": [], "why": "Saw is the past simple of see."}, {"type": "match", "question": "Match the verbs.", "pairs": [["eat", "ate"], ["have", "had"], ["buy", "bought"], ["take", "took"]], "why": "Irregular verbs have special past forms."}, {"type": "choice", "question": "Which sentence is correct?", "options": ["She buyed a book.", "She bought a book.", "She buys a book yesterday.", "She buying a book."], "answer": "She bought a book.", "why": "Bought is the correct past form of buy."}, {"type": "gap", "question": "Complete: He ___ (have) a great time at the party.", "answer": "had", "alternatives": [], "why": "Had is the past form of have."}]}, {"title": "Questions in the Past", "sub": "Use did + base verb", "intro": "To ask about finished actions, use <b>Did + subject + base verb</b>. “Did you watch the match?” “Did she go home?” After <b>did</b>, the main verb stays in its base form—not watched or went.", "sv": "Frågor i preteritum bildas med did + person + verbets grundform: Did you play? Inte Did you played?", "passage": "", "tasks": [{"type": "choice", "question": "Choose the correct question.", "options": ["Did you went home?", "Did you go home?", "Do you went home?", "Did you going home?"], "answer": "Did you go home?", "why": "After did, use the base form go."}, {"type": "gap", "question": "Complete: ___ you finish your homework yesterday?", "answer": "Did", "alternatives": ["did"], "why": "Use Did to ask about a finished action."}, {"type": "choice", "question": "Which is correct?", "options": ["Did she saw the film?", "Did she sees the film?", "Did she see the film?", "Did she seeing the film?"], "answer": "Did she see the film?", "why": "See stays in its base form after did."}, {"type": "match", "question": "Match each answer to its question.", "pairs": [["Did you eat breakfast?", "Yes, I did."], ["Did he call you?", "No, he didn’t."], ["Did they arrive?", "Yes, they did."], ["Did she win?", "No, she didn’t."]], "why": "Short answers repeat did or didn’t."}, {"type": "gap", "question": "Complete with one word: Did they ___ (play) tennis?", "answer": "play", "alternatives": [], "why": "Use the base form play after did."}]}, {"title": "Negatives in the Past", "sub": "Use didn’t + base verb", "intro": "To say something did not happen, use <b>did not (didn’t) + base verb</b>. “I didn’t watch TV.” “He didn’t go to school.” Don’t add -ed or use an irregular past form after didn’t.", "sv": "Nekande meningar i preteritum: didn’t + grundform. Exempel: She didn’t go, inte She didn’t went.", "passage": "", "tasks": [{"type": "choice", "question": "Choose the correct sentence.", "options": ["I didn’t watched TV.", "I didn’t watch TV.", "I don’t watched TV.", "I didn’t watching TV."], "answer": "I didn’t watch TV.", "why": "Didn’t is followed by the base form watch."}, {"type": "gap", "question": "Complete with one word: We ___ visit the museum yesterday.", "answer": "didn’t", "alternatives": ["did not"], "why": "Didn’t makes the past sentence negative."}, {"type": "choice", "question": "Which is correct?", "options": ["He didn’t ate lunch.", "He didn’t eats lunch.", "He didn’t eat lunch.", "He not ate lunch."], "answer": "He didn’t eat lunch.", "why": "Use eat, not ate, after didn’t."}, {"type": "match", "question": "Match the affirmative sentence to its negative form.", "pairs": [["She played.", "She didn’t play."], ["They went.", "They didn’t go."], ["I saw it.", "I didn’t see it."], ["He studied.", "He didn’t study."]], "why": "The verb returns to its base form after didn’t."}, {"type": "gap", "question": "Complete: Maya didn’t ___ (buy) anything.", "answer": "buy", "alternatives": [], "why": "Buy is the base form; bought would be incorrect here."}]}, {"title": "Past Simple in Real Life", "sub": "Combine statements, questions and negatives", "intro": "Read this short story: <b>“On Saturday, Alex visited a friend. They made pizza and watched a film. Alex didn’t stay late because he had football practice on Sunday.”</b> Notice the mix of regular verbs (visited, watched), irregular verbs (made, had) and negatives (didn’t stay).", "sv": "Läs berättelsen och träna på att känna igen påståenden, frågor och nekande meningar i preteritum.", "passage": "", "tasks": [{"type": "choice", "question": "What did Alex and his friend make?", "options": ["Sandwiches", "Pizza", "Pancakes", "Soup"], "answer": "Pizza", "why": "The story says they made pizza."}, {"type": "choice", "question": "Which word in the story is an irregular past form?", "options": ["visited", "watched", "made", "stay"], "answer": "made", "why": "Made is the past form of make."}, {"type": "gap", "question": "Complete: Alex ___ (visit) a friend on Saturday.", "answer": "visited", "alternatives": [], "why": "Visited is the regular past form of visit."}, {"type": "choice", "question": "Choose the correct question about the story.", "options": ["Did Alex watched a film?", "Did Alex watch a film?", "Does Alex watched a film?", "Did Alex watching a film?"], "answer": "Did Alex watch a film?", "why": "Use did + base verb in a past question."}, {"type": "gap", "question": "Complete: Alex didn’t ___ (stay) late.", "answer": "stay", "alternatives": [], "why": "After didn’t, use the base form stay."}]}, {"title": "Grammar in Action: Final Challenge", "sub": "Show what you can do", "intro": "You have practised <b>regular and irregular past verbs</b>, <b>questions with did</b>, and <b>negatives with didn’t</b>. Read carefully. You need at least <b>80%</b> to complete the module. You can try again as often as you need.", "sv": "Sluttest med blandade uppgifter. Du behöver minst 80 % rätt. Läs återkopplingen och försök igen om det behövs.", "passage": "", "tasks": [{"type": "gap", "question": "Complete: Yesterday, we ___ (walk) to school.", "answer": "walked", "alternatives": [], "why": "Walk is regular: walked."}, {"type": "choice", "question": "Last night, I ___ a strange noise.", "options": ["hear", "heared", "heard", "hearing"], "answer": "heard", "why": "Heard is the irregular past of hear."}, {"type": "choice", "question": "Choose the correct question.", "options": ["Did you finish the book?", "Did you finished the book?", "Did you finishing the book?", "Do you finished the book?"], "answer": "Did you finish the book?", "why": "After did, use finish."}, {"type": "gap", "question": "Complete: She ___ (go) to London last summer.", "answer": "went", "alternatives": [], "why": "Went is the past of go."}, {"type": "choice", "question": "Which negative sentence is correct?", "options": ["They didn’t played.", "They didn’t play.", "They not played.", "They don’t played."], "answer": "They didn’t play.", "why": "Didn’t takes the base form."}, {"type": "gap", "question": "Complete: ___ he call you yesterday?", "answer": "Did", "alternatives": [], "why": "Did introduces a past simple question."}, {"type": "choice", "question": "Which sentence describes a finished action?", "options": ["We eat lunch now.", "We are eating lunch.", "We ate lunch at noon.", "We will eat lunch."], "answer": "We ate lunch at noon.", "why": "Ate describes a completed action."}, {"type": "match", "question": "Match the present and past forms.", "pairs": [["write", "wrote"], ["run", "ran"], ["make", "made"], ["drink", "drank"]], "why": "These are common irregular verbs."}, {"type": "gap", "question": "Complete: I didn’t ___ (see) the message.", "answer": "see", "alternatives": [], "why": "After didn’t, use see, not saw."}, {"type": "choice", "question": "Choose the correct sentence.", "options": ["She studyed yesterday.", "She studied yesterday.", "She studies yesterday.", "She studying yesterday."], "answer": "She studied yesterday.", "why": "Study changes to studied in the past simple."}]}];
const key='englishJourney_grammarInAction_v1';
let unlocked=0,completed=[],current=0,answers={},submitted=false,showSwedish=false;
try{const p=JSON.parse(localStorage.getItem(key)||'{}');unlocked=Math.max(0,Math.min(5,Number(p.unlocked)||0));completed=Array.isArray(p.completed)?p.completed.filter(n=>Number.isInteger(n)&&n>=0&&n<6):[]}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify({unlocked,completed}))}catch(e){}}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normal(x){return String(x??'').trim().toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' ')}
function nav(){document.getElementById('bar').style.width=(completed.length/6*100)+'%';document.getElementById('progressLabel').textContent=completed.length+' of 6 lessons completed';document.getElementById('nav').innerHTML=lessons.map((l,i)=>`<button class="navbtn ${i===current?'active':''}" data-nav="${i}" ${i>unlocked?'disabled':''}>${completed.includes(i)?'✓':i>unlocked?'🔒':'○'} ${i+1}. ${esc(l.title)}<br><span class="small muted">${esc(l.sub)}</span></button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{current=+b.dataset.nav;answers={};submitted=false;showSwedish=false;render()})}
function taskHTML(t,i){let body='';if(t.type==='choice'){body=t.options.map((o,j)=>`<button class="option ${answers[i]===o?'selected':''}" data-choice="${i}" data-value="${j}" ${submitted?'disabled':''}>${esc(o)}</button>`).join('')}else if(t.type==='gap'){body=`<input aria-label="Your answer" data-gap="${i}" value="${esc(answers[i]||'')}" ${submitted?'disabled':''} placeholder="Type your answer">`}else if(t.type==='match'){body=t.pairs.map((p,j)=>`<div class="match-row"><span>${esc(p[0])}</span><select aria-label="Match for ${esc(p[0])}" data-match="${i}" data-pair="${j}" ${submitted?'disabled':''}><option value="">Choose a match…</option>${t.pairs.map(z=>z[1]).sort().map(v=>`<option ${answers[i]?.[j]===v?'selected':''} value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>`).join('')}return `<div class="task"><h3>${i+1}. ${esc(t.question)}</h3>${body}${submitted?feedback(t,i):''}</div>`}
function correct(t,i){if(t.type==='choice')return answers[i]===t.answer;if(t.type==='gap')return [t.answer,...(t.alternatives||[])].some(a=>normal(answers[i])===normal(a));if(t.type==='match')return t.pairs.every((p,j)=>answers[i]?.[j]===p[1]);return false}
function feedback(t,i){let ok=correct(t,i);return `<div class="feedback ${ok?'good':'bad'}" role="status"><strong>${ok?'✓ Correct!':'Not quite.'}</strong> ${esc(t.why)}${!ok?`<br><strong>Answer:</strong> ${t.type==='match'?esc(t.pairs.map(p=>p[0]+' → '+p[1]).join('; ')):esc(t.answer)}`:''}</div>`}
function render(){nav();let l=lessons[current];let score=l.tasks.filter((t,i)=>correct(t,i)).length;document.getElementById('content').innerHTML=`<div class="lesson-head"><div><div class="muted small">LESSON ${current+1} OF 6</div><h2>${esc(l.title)}</h2><div class="muted">${esc(l.sub)}</div></div><span class="tag">${completed.includes(current)?'Completed':'Grammar'}</span></div><div class="intro"><strong>Learn it!</strong><p>${l.intro}</p><button class="btn secondary" id="sv">${showSwedish?'Hide Swedish explanation':'Visa svensk förklaring'}</button>${showSwedish?`<div class="help">${esc(l.sv)}</div>`:''}</div><div class="passage">${l.passage}</div><h2>Try it!</h2><p class="muted small">Read the text again whenever you need to. Choose or type your answers.</p>${l.tasks.map(taskHTML).join('')}${submitted?`<div class="result"><h3>${score} / ${l.tasks.length} correct · ${Math.round(score/l.tasks.length*100)}%</h3><p>${score/l.tasks.length>=.8?'Great work! You have passed this lesson.':'You need at least 80% to continue. Review the explanations and try again.'}</p></div>`:''}<div class="actions">${!submitted?'<button class="btn" id="check">Check my answers</button>':`<button class="btn secondary" id="retry">Try again</button>${score/l.tasks.length>=.8&&current<5?'<button class="btn" id="next">Next lesson →</button>':''}${score/l.tasks.length>=.8&&current===5?'<strong>🎉 Module complete!</strong>':''}`}</div>`;
document.getElementById('sv').onclick=()=>{showSwedish=!showSwedish;render()};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answers[+b.dataset.choice]=l.tasks[+b.dataset.choice].options[+b.dataset.value];render()});document.querySelectorAll('[data-gap]').forEach(x=>x.oninput=()=>{answers[+x.dataset.gap]=x.value});document.querySelectorAll('[data-match]').forEach(x=>x.onchange=()=>{let i=+x.dataset.match,j=+x.dataset.pair;answers[i]??={};answers[i][j]=x.value});let c=document.getElementById('check');if(c)c.onclick=()=>{submitted=true;score=l.tasks.filter((t,i)=>correct(t,i)).length;if(score/l.tasks.length>=.8){if(!completed.includes(current))completed.push(current);unlocked=Math.max(unlocked,Math.min(5,current+1));save()}render()};let r=document.getElementById('retry');if(r)r.onclick=()=>{answers={};submitted=false;render()};let n=document.getElementById('next');if(n)n.onclick=()=>{current++;answers={};submitted=false;showSwedish=false;render()}}
document.getElementById('reset').onclick=()=>{if(confirm('Reset all progress for Module 4 on this device?')){unlocked=0;completed=[];current=0;answers={};submitted=false;save();render()}};render();
</script><script>(function(){
const moduleKeys={"english_journey_module_2.html": "english_journey_writing_basics_v1", "english_journey_module_5.html": "english-journey-vocab-v1", "english_journey_module_7.html": "english-journey-module7-v1", "english_journey_module_11.html": "english_journey_module_11_progress_v1", "english_journey_module_8.html": "english-journey-module8-v1", "english_journey_module_9_fixed.html": "english_journey_module_9_progress_v1", "english_journey_module_12_fixed.html": "english_journey_module_12_progress_v1", "english_journey_module_1.html": "english-journey-foundations-v1", "english_journey_module_6.html": "english-journey-module6-v1", "english_journey_module_4.html": "englishJourney_grammarInAction_v1", "english_journey_module_10.html": "english_journey_module_10_progress_v1", "english_journey_module_3.html": "englishJourney_readingSkillsI_v1"};
const gameNames=['english_arcade_grammar_rush.html','english_arcade_reading_detective.html','english_arcade_sentence_scramble.html','english_arcade_word_match.html','english_arcade_story_paths.html'];

function checkAchievements(){let all=Object.keys(moduleKeys),grammar=all.filter(x=>/module_(1|4|8|11)\.html$/.test(x));if(grammar.every(x=>getModule(x)===6))award('grammar','all grammar modules');if(all.every(x=>getModule(x)===6))award('allmodules','all course modules');if(gameNames.every(gameDone))award('arcade','all arcade games');if(all.every(x=>getModule(x)===6)&&gameNames.every(gameDone))award('academy','English Academy')}

function renderHome(){document.querySelectorAll('a.card[href]').forEach(card=>{let file=card.getAttribute('href');let isModule=!!moduleKeys[file],isGame=gameNames.includes(file);if(!isModule&&!isGame)return;let n=isModule?getModule(file):gameCount(file);card.classList.toggle('academy-mastered',isModule&&n===6);let label=card.querySelector('.academy-status');if(!label){label=document.createElement('div');label.className='academy-status';card.insertBefore(label,card.querySelector('.go'))}if(isModule){label.innerHTML='<div class="academy-status-line"><span>'+(n===6?'✓ Mastered!':n+' / 6 lessons completed')+'</span><span>'+Math.round(n/6*100)+'%</span></div><div class="academy-track"><div style="width:'+Math.round(n/6*100)+'%"></div></div>'}else{label.innerHTML='<div class="academy-status-line"><span>🎮 '+n+' '+(n===1?'time':'times')+' played</span><span>'+(n?'Keep playing!':'Ready to play')+'</span></div>';}});let n=Object.keys(moduleKeys).reduce((a,x)=>a+getModule(x),0);let banner=document.getElementById('academy-overview');if(banner)banner.textContent='Your journey: '+n+' / 72 lessons completed · '+gameNames.reduce((a,x)=>a+gameCount(x),0)+' arcade rounds played';checkAchievements()}
window.Academy2={markGame,checkAchievements,renderHome};
if(document.body.querySelector('a.card[href]')){renderHome();window.addEventListener('pageshow',renderHome)}
else {let bar=document.createElement('div');bar.className='academy-back';bar.innerHTML='<a href="index.html">← Back to English Academy</a>';document.body.prepend(bar);let bottom=bar.cloneNode(true);bottom.className+=' academy-bottom';document.body.append(bottom);let file=location.pathname.split('/').pop();if(moduleKeys[file]){let old=getModule(file);setInterval(()=>{let now=getModule(file);if(now>old){old=now;if(now===6){award('module-'+file,document.title.replace(/\s*[|–-].*$/,'')||'this module');checkAchievements()}}},1300)}}
})();</script></body></html>
